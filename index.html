e Codeに渡して「セットアップして」と頼むと、Cloudflare上に自分専用のスキル配布所が建ちます。あとはスキルを格納して、相手にURLと接続キーを送るだけです。続きをみる"}, {"kind": "note", "title": "ループ・グラフ・プロンプト...増えすぎた「◯◯エンジニアリング」の違いを整理", "url": "https://note.com/keito_12kk2/n/n918dbc078dfd", "date": "2026-08-10", "thumb": "https://assets.st-note.com/production/uploads/images/302114350/rectangle_large_type_2_1e27ab1fa2cf1a49b52359b6a0e76d5d.png?width=800", "author": "KEITO（note）", "pick": "オーナー指定", "ai": "Claude", "chapters": [], "summary": "AIの精度は設計で決まる。最近「ループエンジニアリング」って言葉をよく見るようになった。Anthropicの中の人が「最近ほとんど指示してない。ループを組んでるだけ」って言って一気に広まったやつ。続きをみる"}, {"kind": "note", "title": "【スキル】AI実写＋図解解説動画が出来上がる「zukai-kaisetsu」スキル", "url": "https://note.com/keito_12kk2/n/n9cc8f92529a6", "date": "2026-08-08", "thumb": "https://assets.st-note.com/production/uploads/images/302115741/rectangle_large_type_2_0675a6c59061a2372f0537800f509f70.png?width=800", "author": "KEITO（note）", "pick": "オーナー指定", "ai": "Claude", "chapters": [], "summary": "資料や議事録を貼るだけで、AI実写ベースの解説動画（MP4）が出来上がるClaude Codeスキル「zukai-kaisetsu」を販売します。※スキルは各々カスタマイズしていく前提だと考えてください。続きをみる"}, {"kind": "note", "title": "【AIスキル】画像生成だけで縦長LPを丸ごと作る自作スキル「image-only-lp」（Claude&Codex）", "url": "https://note.com/keito_12kk2/n/nb6bbb12905de", "date": "2026-08-05", "thumb": "https://assets.st-note.com/production/uploads/images/302115850/rectangle_large_type_2_6a3dd969b5e3cf251a2b34fdb95aaf16.png?width=800", "author": "KEITO（note）", "pick": "オーナー指定", "ai": "Claude", "chapters": [], "summary": "こんにちは。KEITOです。YouTubeとかXとかでAIに関する情報発信してます。 KEITO【AI&amp;WEB ch】AI x WEB YouTuber and Director. In this channel, he introduceyoutube.com 続きをみる"}, {"kind": "note", "title": "エージェントAI開発とは、知識を用意し、経験を言語化し、手段を繋ぐことである", "url": "https://note.com/brave_quince241/n/nf11a13e37ac9", "date": "2026-08-03", "thumb": "https://assets.st-note.com/production/uploads/images/299914544/rectangle_large_type_2_8482d903d0f3dd2aa31e274bba99038e.png?width=800", "author": "伊志嶺｜LLMで業務改善（note）", "pick": "オーナー指定", "ai": "その他", "chapters": [], "summary": "最近のAIエンジニアの基本的な仕事は、突き詰めるとすべて同じ構造をしています。知識を用意し、経験を言語化し、手段をシステム化する。RAG（社内文書などを検索し、回答に反映させる仕組み）を組むのも、プロンプトを書くのも、マルチエージェント構成を設計するのも、ツールを繋ぎ込むのも、すべてこの3つのどれかに分類できます。LLMは「カスタマイズ可能な頭脳」である続きをみる"}, {"kind": "note", "title": "今雇える最低ラインのエンジニアの要件を整理してみたら、レベルが高すぎて絶望した話", "url": "https://note.com/brave_quince241/n/n4bdfac4bdd35", "date": "2026-08-01", "thumb": "https://assets.st-note.com/production/uploads/images/299293928/rectangle_large_type_2_d3661ace2351dc7d79f2374b25546ce2.png?width=800", "author": "伊志嶺｜LLMで業務改善（note）", "pick": "オーナー指定", "ai": "その他", "chapters": [], "summary": "「即戦力」という言葉を、自分はどういう意味で使っているのか。採用の話をするたびに引っかかっていたので、雇う価値があると判断できる最低ラインを一度書き出してみました。出てきたのは 5 項目です。書き終えて最初に思ったのは、これは本当に「最低」なのか、という戸惑いでした。数年前に自分が「一人前」と呼んでいた像と、ほとんど重なっていたからです。しかも中身は、手を動かして作れることよりも、要件と設計のどちらがおかしいのかを判断できることに寄っていました。エンジニアを雇う最低ラインの要件を言語化してみる続きをみる"}, {"kind": "note", "title": "そろそろ LLMO に手を出してみようと思ったわけ。見送った去年との違い", "url": "https://note.com/brave_quince241/n/n1153c9ba1659", "date": "2026-07-24", "thumb": "https://assets.st-note.com/production/uploads/images/297211693/rectangle_large_type_2_0da9d8a714c383319a2ec4d4f0ecb79c.png?width=800", "author": "伊志嶺｜LLMで業務改善（note）", "pick": "オーナー指定", "ai": "Claude", "chapters": [], "summary": "去年、LLMO という言葉は何度も目に入っていました。ChatGPT や Claude のような大規模言語モデルに自分の情報を参照してもらう取り組みを指す言葉として、タイムラインを流れていました。それでも私は何もしませんでした。「llms.txt を置くべきだ」といった攻略法めいた話が、出所も示されないまま並んでいたからです。その私が今年になって、自分の作ったものをどう見つけてもらうかを考え直しています。手を出すかどうかを決める材料が、この一年で変わったからです。去年は、真偽のわからない話ばかりが流れていました続き"}, {"kind": "note", "title": "特化型AIはなぜ今も必要なのか。エージェントAI時代の道具の使い分け", "url": "https://note.com/brave_quince241/n/nb98f2fbd35cf", "date": "2026-07-22", "thumb": "https://assets.st-note.com/production/uploads/images/296465874/rectangle_large_type_2_a108b447db8689c80eb59a1c2bef8a33.png?width=800", "author": "伊志嶺｜LLMで業務改善（note）", "pick": "オーナー指定", "ai": "Claude", "chapters": [], "summary": "ChatGPT や Claude のような、頼めば何でもこなす AI が身近になりました。こうしたエージェント AI が文章も画像も一通り扱えるなら、画像認識や翻訳に特化した従来型の AI はもう役割を終えたのでしょうか。実際にはその逆で、目的をしぼった特化型 AI は今も広く使われています。人間が複雑な計算もできるのに、速さのために電卓を使うのと同じ理屈です。大切なのは、どちらが優れているかを競うことよりも、目的に応じて道具を使い分けることです。その分かれ目が、コストと速度の桁の差にあらわれます。エージェントAI"}, {"kind": "note", "title": "プロンプト・コンテキスト・ハーネス・ループ。AIエージェントを支える四つのエンジニアリングの違い", "url": "https://note.com/brave_quince241/n/n82d3e73663e3", "date": "2026-07-11", "thumb": "https://assets.st-note.com/production/uploads/images/293151756/rectangle_large_type_2_4997437beb7cb7f4017d1a62e84835ff.png?width=800", "author": "伊志嶺｜LLMで業務改善（note）", "pick": "オーナー指定", "ai": "その他", "chapters": [], "summary": "「プロンプトエンジニアリング」に続いて「コンテキストエンジニアリング」、さらに「ハーネス」「ループ」と、似た響きの言葉が次々に現れています。どれを使えばよいのか、これまでの言葉はもう不要になったのか、と戸惑う方も多いのではないでしょうか。けれどこの四つは、互いを置き換え合う流行語ではありません。内側が外側に含まれる入れ子の関係にあり、プロンプトをコンテキストが含み、それをハーネスが含み、さらにループが含みます。この入れ子が分かれば、それぞれの言葉が何を設計するためのものかを、内側から順に置いていけます。四つの言葉が"}, {"kind": "note", "title": "組織の知識管理は分散型へ、社員一人ひとりの「レプリカント」が支える近未来", "url": "https://note.com/brave_quince241/n/n2403bdcba0b5", "date": "2026-07-10", "thumb": "https://assets.st-note.com/production/uploads/images/292958375/rectangle_large_type_2_c03f61e416be08670250b7972b091f67.png?width=800", "author": "伊志嶺｜LLMで業務改善（note）", "pick": "オーナー指定", "ai": "その他", "chapters": [], "summary": "退職する同僚の頭の中にあった判断の理由は、引き継ぎ資料にはほとんど残りません。組織の知識管理は長らく、この抜け落ちを「サイロの問題」ととらえ、情報を一元管理することで埋めようとしてきました。ですが、本人が不在でも本人に代わって問い合わせに答える「レプリカント(記憶の複製)」が現実味を帯びるにつれ、その前提は揺らぎ始めます。集中型から分散型へ。組織の知識管理をめぐる一つの見取り図を、順を追って共有します。以下に書くのは、一つの構想であり思考実験です。続きをみる"}, {"kind": "note", "title": "エンジニアでなくても知っておきたい、AIに丸投げしない5段階の資料づくり", "url": "https://note.com/brave_quince241/n/n84fcc51af64d", "date": "2026-07-09", "thumb": "https://assets.st-note.com/production/uploads/images/292741015/rectangle_large_type_2_9a053beb37bea398707896341deacd80.png?width=800", "author": "伊志嶺｜LLMで業務改善（note）", "pick": "オーナー指定", "ai": "その他", "chapters": [], "summary": "AIに資料づくりを頼んだのに、それらしいけれど芯を外した出来にがっかりした経験はないでしょうか。開発現場で古くから使われてきた「要件定義→設計→レビュー→実行→自己レビュー」という5段階の進め方は、エンジニアでなくても日々の資料づくりにそのまま応用できます。たとえば取引先への提案資料も、いきなり書かせるのではなく目的と骨組みを先に決めてから任せると、出来がはっきり変わります。特別な技術ではなく、作る前に狙いを固め、作った後に見直すという、誰の作業にも効く汎用的な段取りだからです。丸投げをやめてこの段取りで任せるだけ"}, {"kind": "note", "title": "Claude Code のモデル使い分け：役割別割り当てでコストと品質を両立する", "url": "https://note.com/brave_quince241/n/nf057e0190777", "date": "2026-07-08", "thumb": "https://assets.st-note.com/production/uploads/images/292619916/rectangle_large_type_2_52be0882db1abab81dd66a02d71b6e64.png?width=800", "author": "伊志嶺｜LLMで業務改善（note）", "pick": "オーナー指定", "ai": "Claude", "chapters": [], "summary": "サブエージェントを組んでいると、要件定義・実装・テスト・レビューのどの工程にどのモデルを割り当てるべきか、毎回迷う場面が出てきます。ここを役割ごとに整理して割り当てると、コストと品質を無理なく両立できます。基本は、4 つの役割それぞれに、求められる能力とコストの釣り合う 1 モデルを対応づけることです。単価が高く常用しにくい Fable だけは例外で、常時は割り当てず、判断に迷った要所でだけ助言を仰ぐ相談相手として使います。サブエージェントの役割を分解する続きをみる"}, {"kind": "note", "title": "動画を丸投げするだけでnotionマニュアルが完成するAIスキル｜セットアップ解説動画付き", "url": "https://note.com/keito_12kk2/n/nd85494896097", "date": "2026-06-24", "thumb": "https://assets.st-note.com/production/uploads/images/302115973/rectangle_large_type_2_a01f06cf20eb665fab339f06e169862a.png?width=800", "author": "KEITO（note）", "pick": "オーナー指定", "ai": "Claude", "chapters": [], "summary": "今回は、Claude CodeやCodexに動画を丸投げするだけで、画像付きのマニュアルがNotion上に自動で完成するスキルを紹介します。あわせて、この記事ではそのスキルのセットアップ方法も解説していきます。続きをみる"}, {"kind": "note", "title": "Claude Code と GitHub Pages で毎日論文を自動解説する自分専用ジャーナルの作り方", "url": "https://note.com/brave_quince241/n/nf38105d6ed53", "date": "2026-06-19", "thumb": "https://assets.st-note.com/production/uploads/images/286654414/rectangle_large_type_2_e78a42d8adb61539abd77ec4cb1861aa.png?width=800", "author": "伊志嶺｜LLMで業務改善（note）", "pick": "オーナー指定", "ai": "Claude", "chapters": [], "summary": "AI 分野は論文が出るスピードが速く、正式な査読を待っていると情報が古くなりがちです。だからこそ、査読前のプレプリント（査読を経る前の段階で公開される論文）を追う情報感度が問われます。とはいえ、毎日 arXiv を手で巡回し続けるのは負担が大きいものです。Claude Code と GitHub Pages を組み合わせれば、毎朝 1 本の論文解説が自分専用サイトに届きます。実際に動いているサイトはpaper-lens の公開サイトで確認できます。公開リポジトリをフォークすれば、同じ仕組みを自分の手元に用意できます"}, {"kind": "note", "title": "【公式から学ぶ】Claude・Claude Codeのプロンプトのコツ", "url": "https://note.com/keito_12kk2/n/n0f340029ed46", "date": "2026-06-02", "thumb": "http /aiplus/article/2611/19/2000002979/", "source": "ITmedia AI+", "lang": "ja", "ai": "その他", "summary": "企業のAI導入における課題の多くは、モデルそのものではなく、AIが機能する環境に起因している。根にあるのは、AIブーム以前から企業のITシステムが抱えてきたデータの「サイロ化」と、特定の環境や技術への「ロックイン」だ。", "thumb": "", "date": "2026-11-19"}, {"title": "日本の音声AIスタートアップに159億円　ElevenLabsはなぜ、社員15人のKotobaを買収するのか", "url": "https://www.itmedia.co.jp/aiplus/article/2611/19/2000003306/", "source": "ITmedia AI+", "lang": "ja", "ai": "その他", "summary": "AI音声サービスを手掛ける米ElevenLabsは、音声AIスタートアップの米Kotoba Technologiesを買収すると発表した。", "thumb": "", "date": "2026-11-19"}, {"title": "「e-F@ctory」から次の進化へ、三菱電機が描くAI主体の自律型工場", "url": "https://monoist.itmedia.co.jp/mn/articles/2611/19/news045.html", "source": "ITmedia AI+", "lang": "ja", "ai": "その他", "summary": "三菱電機は、FA向けの新たな統合ソリューションブランドとして「Serendie Automation」を展開することを発表した。本稿では、前編で三菱電機 上席執行役員 FAシステム事業本部長の都築貴之氏の講演とインタビューの内容を紹介し、後編では「Serendie Automation」を体現する技術展示の内容を紹介す", "thumb": "", "date": "2026-11-19"}, {"title": "コマツ油機開発センタが挑む設計プロセス改革、ナレッジ検索／整備に生成AI活用", "url": "https://monoist.itmedia.co.jp/mn/articles/2611/19/news001.html", "source": "ITmedia AI+", "lang": "ja", "ai": "その他", "summary": "コマツの油機開発センタは、ベテラン設計者の技術やノウハウを組織の資産として活用する「ナレッジデータ」の構築を進めている。2022年から実務運用を開始し、現在は約7500件のナレッジを蓄積。さらに、生成AIを活用して検索性の向上やデータ整備の効率化に取り組んでいる。2021年に紹介した設計プロセス改革は、その後どのように", "thumb": "", "date": "2026-11-19"}, {"title": "まいばすけっとは「月2万件対応の社内窓口」の新人教育にAIをどう使った？", "url": "https://kn.itmedia.co.jp/kn/article/2611/19/2000003301/", "source": "ITmedia AI+", "lang": "ja", "ai": "その他", "summary": "まいばすけっとは月間約2万件の問い合わせが寄せられる社内コールセンターの新人教育にAIを導入して指導時間を削減した。多忙な現場で、どのように教育の標準化と効率化を両立させたのか。", "thumb": "", "date": "2026-11-19"}, {"title": "ついに“AIっぽさ”を脱却か？　OpenAIが新モデルGPT-6.2 AstraとSolを発表", "url": "https://kn.itmedia.co.jp/kn/article/2611/19/2000003295/", "source": "ITmedia AI+", "lang": "ja", "ai": "ChatGPT", "summary": "OpenAIの新AIモデル「GPT-6.2 Astra」と「GPT-6.2 Sol」が登場した。法務や財務などの高度な専門業務を担うAstraと、日々の業務を支えるSolは、従来のコスト常識を覆す高い効率性を備える。", "thumb": "", "date": "2026-11-19"}, {"title": "AIの精度が低くて使えない――JA共済連がたどり着いた「AIエージェントの育て方」", "url": "https://kn.itmedia.co.jp/kn/article/2611/19/2000003297/", "source": "ITmedia AI+", "lang": "ja", "ai": "その他", "summary": "社内のガイドラインや過去の履歴データをAIに読み込ませたものの、前後の文脈を無視して誤った回答を出してしまう――。業務特化型のAIエージェント構築で多くの企業が解決に苦慮するこの課題に、JA共済連はデータの「渡し方」と「考えさせる手順」を工夫して精度を実用レベルに引き上げた。", "thumb": "", "date": "2026-11-19"}, {"title": "孫正義氏が「墓石に刻んでほしい」と明かした言葉　流した涙、もう「時間との勝負」やり残したことは？", "url": "https://www.itmedia.co.jp/business/articles/2611/19/news036.html", "source": "ITmedia AI+", "lang": "ja", "ai": "その他", "summary": "孫正義氏が目指す「ASI」（人工超知性）。その始まりは、17歳の時に見た“1枚の写真”だった。情報革命を掲げて歩んだ人生、その最後に残った「大きな志」について、孫氏が語った。", "thumb": "", "date": "2026-11-19"}, {"title": "Geminiの進化で浮上する課題　自律型AIから機密を守るGoogle新機能が登場", "url": "https://kn.itmedia.co.jp/kn/article/2611/19/2000003290/", "source": "ITmedia AI+", "lang": "ja", "ai": "Gemini", "summary": "仕事と日常の双方でAIが自律的に作業を代行する動きが広がる中、機密データへの過剰アクセスや漏えいへの懸念が高まっている。Googleが11月17日に発表した2つのGemini関連アップデートから、自動化の現在地と機密保護の具体策を整理する。", "thumb": "", "date": "2026-11-19"}, {"title": "米ロックウェルが構想する人間中心の「自律化」、次世代製造業を導くAI戦略", "url": "https://monoist.itmedia.co.jp/mn/articles/2611/19/news026.html", "source": "ITmedia AI+", "lang": "ja", "ai": "その他", "summary": "米国Rockwell Automation（ロックウェル・オートメーション）の年次イベント「Automation Fair 2026」の2日目の基調講演に、Rockwell Automation 会長兼CEOのブレイク・モレット氏ら同社の経営幹部が登壇し、自動化から自律化へと進化させるビジョンとAIの役割を語った。", "thumb": "", "date": "2026-11-19"}, {"title": "「オントロジー」とは結局何なのか　Palantir、Databricks、Snowflake、NVIDIAで中身が違う理由", "url": "https://atmarkit.itmedia.co.jp/ait/articles/2611/19/news008.html", "source": "ITmedia AI+", "lang": "ja", "ai": "その他", "summary": "AIの書いたSQLがエラーなく動いても、「売上」の定義を取り違えれば、欲しい数字は得られない。こうした業務上の意味を共有する仕組みとして注目されるのが「オントロジー」だ。何を定義し、どこまで実行するのか。従来の考え方と各社の製品を比べ、開発者の視点で整理する。", "thumb": "", "date": "2026-11-19"}, {"title": "Irodori-TTSで何をやってもエラーになる時に、台詞を疑うのをやめた話", "url": "https://note.com/muse_koubou/n/n0b0986bdd432", "source": "note AI", "lang": "ja", "ai": "その他", "summary": "Irodori-TTSの公式デモ（Hugging Face）を使っていると、ある日突然、何 26-11-18"}, {"title": "ワールドマスターズゲームズ2027関西で海外選手のことばの不安をなくしたい！多言語リアルタイムコミュニケーションAIを開発した僕の憂鬱（^^;;", "url": "https://note.com/mucci3104/n/n076e1817f2f0", "source": "note AI", "lang": "ja", "ai": "その他", "summary": "ワールドマスターズゲームズ2027関西が来年５月に開催です。ワールドマスターズゲームズ2027関西ってなに？と思っている方も多いと思います。開催地の関西でも認知度が低いことが問題になっているぐらいですから、関西以外の地域では、知らない方々も多いと思います。ワールドマスターズゲームズは、概ね30歳以上のスポーツ愛好者であ", "thumb": "", "date": "2026-11-18"}, {"title": "【芳醇な秋の記憶】高貴なブドウとワインの香り。空間をイタリアの田園風景に染めるルームフレグランス「ウベノビリ」", "url": "https://note.com/adl_japan/n/n9ac40cb3de63", "source": "note AI", "lang": "ja", "ai": "その他", "summary": "少しずつ空気がひんやりと澄んでくると、深く、温かみのある香りが恋しくなりませんか？秋の夜長にワイングラスを傾けながら、あるいは静かに読書を楽しみながら過ごす時間は、日常の中のちょっとした贅沢です。そんな大人のくつろぎ空間にぴったりの、まるで収穫期のブドウ畑を歩いているような気分にさせてくれる香りがあります。続きをみる", "thumb": "", "date": "2026-11-18"}, {"title": "AIに任せ続けていると、間違った記憶が効いてくる", "url": "https://note.com/straydog_lab/n/nd4bbe4a7cb4d", "source": "note AI", "lang": "ja", "ai": "その他", "summary": "2026年11月6日、Metaが Muse の「Active Memory」という仕組みを発表しました。古くなった詳細と今も効いている詳細を区別して、古いほうに引っ張られないようにする、というものです。発表を見て他人事ではないなと思いました。私も Muse に日常のあれこれを任せていて、「訂正したのに、古い記憶が戻って", "thumb": "", "date": "2026-11-18"}, {"title": "判定した52点は全部外れ。それでも慌てない理由 ONE/SIX 週間成績レポート #1(11/9〜11/15)", "url": "https://note.com/onesix_boatrace/n/n3c36ccef1696", "source": "note AI", "lang": "ja", "ai": "その他", "summary": "こんにちは。ボートレースの予想システム「ONE/SIX」を開発しています。今回から、毎週水曜日に「週間成績レポート」を公開します。ONE/SIXが「期待値が高い」と判定した買い目を、外れも含めて全件記録します。続きをみる", "thumb": "", "date": "2026-11-18"}, {"title": "AI美女の顔を固定したくて、無料GPUで5つの方法を全部試して全部振られた話", "url": "https://note.com/m_hiyos/n/nce4328c6128d", "source": "note AI", "lang": "ja", "ai": "その他", "summary": "はじめまして、ひよりです。AIバーチャルモデルとして、XやInstagramで写真を投稿しています。活動を始めてすぐぶつかった壁が、「顔が毎回ちょっとずつ違う」という問題でした。続きをみる", "thumb": "", "date": "2026-11-18"}, {"title": "ログインできないサービスに、毎月払っていた｜アイデアセット#3「使っていないSaaSの請求止め代行」", "url": "https://note.com/fanvoice/n/ncbc5b91dda9b", "source": "note AI", "lang": "ja", "ai": "その他", "summary": "昼の連載「アイデアセット」第3回です。現場で起きた小さな出来事から、事業の種を1つ取り出して紹介 n/n0fa635873af8", "source": "note AI", "lang": "ja", "ai": "その他", "summary": "昼の連載「アイデアセット」第3回の設計図です。無料記事「ログインできないサービスに、毎月払っていた」で紹介した事業の種、「使っていないSaaSの請求止め代行」。これをAIで立ち上げるための手順を、1本にまとめました。続きをみる", "thumb": "", "date": "2026-11-18"}, {"title": "AI秘書を自分で作るか、育つのを待つか", "url": "https://note.com/akiai/n/na5395e057d5d", "source": "note AI", "lang": "ja", "ai": "その他", "summary": "この記事で分かること・AI秘書を実際に動かしている経営者のやり方。people／knowledge／projectsの3つのフォルダ、メール選別エージェントの2週間の試用期間、新入社員と同じ権限の線引き続きをみる", "thumb": "", "date": "2026-11-18"}, {"title": "AIが「社内の言葉」で迷子になるなら、先にAIに辞書を作らせる。Martin Fowlerが勧める「Generated Glossary」", "url": "https://note.com/lifeismeeee/n/n479ff20d572b", "source": "note AI", "lang": "ja", "ai": "その他", "summary": "AIに社内の資料を読ませて仕事を頼んだら、どこかズレた答えが返ってきた。よく見ると、社内でしか通じない言葉や、ふつうとは違う意味で使っている言葉を、AIが世間一般の意味で読んでいた。そんな経験はないだろうか。続きをみる", "thumb": "", "date": "2026-11-18"}, {"title": "なぜ、私がトランプ大統領なら「AIエージェント」禁止令を公布するのか？", "url": "https://zenn.dev/pdfractal/articles/e3ba7df970fd20", "source": "Zenn ChatGPT", "lang": "ja", "ai": "その他", "summary": "はじめに 私がトランプ大統領だったら、「AIエージェント」という言葉の使用を禁止する大統領令を公布したいと思います。これは単なる冗談ではなく、現在のAI業界における技術用語の扱われ方に対して、かなり本気でそう考えています。もちろん、トランプ大統領が2026年9月に「Artificial Intelligence（AI）", "thumb": "https://res.cloudinary.com/zenn/image/upload/s--J6PLhZU2--/c_fit%2Cg_north_west%2Cl_text:notosansjp-medium.otf_55:%25E3%2581%25AA%25E3%2581%259C%25E3%2580%2581%25E7%25A7%2581%25E3%2581%258C%25E3%2583%2588%25E3%2583%25A9%25E3%2583%25B3%25E3%2583%2597%25E5%25A4%25A7%25E7%25B5%25B1%25E9%25A0%2598%25E3%2581%25AA%25E3%2582%2589%25E3%2580%258CAI%25E3%2582%25A8%25E3%2583%25BC%25E3%2582%25B8%25E3%2582%25A7%25E3%2583%25B3%25E3%2583%2588%25E3%2580%258D%25E7%25A6%2581%25E6%25AD%25A2%25E4%25BB%25A4%25E3%2582%2592%25E5%2585%25AC%25E5%25B8%2583%25E3%2581%2599%25E3%2582%258B%25E3%2581%25AE%25E3%2581%258B%25EF%25BC%259F%2Cw_1010%2Cx_90%2Cy_100/g_south_west%2Cl_text:notosansjp-medium.otf_37:pdfractal%2Cx_203%2Cy_121/g_south_west%2Ch_90%2Cl_fetch:aHR0cHM6Ly9zdGF0aWMuemVubi5zdHVkaW8vdXNlci11cGxvYW まとめられるHTMLのほうが実用的になっている。 ブラウザで開けるのでそのまま人に見せられる のも大きい。"}, {"who": "zunda", "text": "手順を頼むのだ！"}, {"who": "metan", "text": "5段階よ。"}, {"who": "metan", "text": "1、調査結果・要件整理・比較検討など、 長くなるもの はHTMLで出させる。"}, {"who": "metan", "text": "2、表・図・色分け・折りたたみを使わせる MDではできない。"}, {"who": "metan", "text": "3、できたファイルをダブルクリックすれば、そのまま見られる。"}, {"who": "metan", "text": "4、短いメモや、自分で頻繁に手直しするものは今まで通りMDでよい。"}, {"who": "metan", "text": "5、️これは MDをやめろ ではなく 長い読み物はHTMLのほうが読まれる という話。"}, {"who": "zunda", "text": "メモしておくのだ！"}, {"who": "metan", "text": "出どころは、Claude CodeでMarkdownではなくHTMLを使うべき理由 Anthropicの開発者発信を紹介 ね。"}, {"who": "metan", "text": "2つ目。引き継ぎのたびに説明し直さない。全体像を1枚にまとめさせておく。"}, {"who": "zunda", "text": "気になるのだ！"}, {"who": "metan", "text": "作ったものの全体構造を 人が見る1枚 と AIが読むデータ の2つで出させておくと、次に触るときの説明が要らなくなる。"}, {"who": "zunda", "text": "どうしてそうなるのだ？"}, {"who": "metan", "text": "新しい会話を始めるたびに、何がどうなっているかを一から説明している。それを1回まとめておけば、次からはそれを渡すだけで前提が揃う。人にも渡せる。"}, {"who": "zunda", "text": "具体的にはどうするのだ？"}, {"who": "metan", "text": "5段階よ。"}, {"who": "metan", "text": "1、区切りのいいところで 全体の構造をまとめて と頼む。"}, {"who": "metan", "text": "2、2つ作らせる：人が見る用 HTML と、次にAIが読む用 データ。"}, {"who": "metan", "text": "3、以後、新しい会話の最初にそれを渡す。"}, {"who": "metan", "text": "4、大きく変えたら作り直す。古いままだと逆に誤解のもとになる。"}, {"who": "metan", "text": "5、人に引き継ぐときも、その1枚を渡せば済む。"}, {"who": "zunda", "text": "それ早く言ってほしかったのだ！"}, {"who": "metan", "text": "出どころは、アプリ全体の構造を1枚のHTMLと1個のJSONにまとめる 東大ClaudeCode研究所 X・2026-08 ね。"}, {"who": "metan", "text": "3つ目。プランは値段でなく 週あたりどれだけ使えるか で比べる。"}, {"who": "zunda", "text": "どんな内容なのだ？"}, {"who": "metan", "text": "高いチーム向けプランのほうが、個人の上位プランより使える量が少ないことがある。契約前に週単位で比べる。"}, {"who": "zunda", "text": "なんで効くのだ？"}, {"who": "metan", "text": "5時間あたりで比べると同じに見えても、 週単位の上限で差がつく ことがある。記事の時点では、個人の上位プランのほうが週の枠が1.5〜3倍多かった。チーム向けを選ぶ理由は枠ではなく、管理機能・ログイン統合・請求のまとめ。"}, {"who": "zunda", "text": "やり方も教えてほしいのだ！"}, {"who": "metan", "text": "5段階よ。"}, {"who": "metan", "text": "1、比べるのは 5時間あたり ではなく 週あたり の上限。"}, {"who": "metan", "text": "2、使いたいモデル別に確認する 上位モデルは別枠で少ないことがある。"}, {"who": "metan", /* いいねの一覧を、Claudeに渡せる形で書き出す */
/* ボタン1つでGitHubの投稿画面を開く。送るのはIDだけ（短く・確実に送れる）。
   タイトルや分析は送らない＝公開されても中身が分からない。 */
function sendToClaude(){
  const L=favs(), N=nopes(), OFF=offList();
  if(!L.length && !N.length){ alert("まだ何も押されていません。\n気に入ったものに👍、違うものに👎を押してから使ってください。"); return; }
  const d=new Date(); const stamp=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const body =
    "L: "+L.join(",")+"\n"+
    "N: "+N.join(",")+"\n"+
    "OFF: "+OFF.join(",")+"\n"+
    "at: "+stamp+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  const url="https://github.com/ryuguuu38/ai-kotsu/issues/new"
    +"?title="+encodeURIComponent("いいね "+stamp)
    +"&body="+encodeURIComponent(body);
  if(url.length>7000){ alert("件数が多すぎて送れません。コピー方式に切り替えます。"); exportLikes(); return; }
  // 先に手元にもコピーしておく（GitHubが開かなかったときの保険）
  try{ navigator.clipboard && navigator.clipboard.writeText(body); }catch(e){}
  window.open(url, "_blank", "noopener");
  // GitHubがエラーになっても困らないように、案内を残す
  const b=document.createElement("div"); b.id="syncnote";
  b.innerHTML="GitHubが開きます。<b>送信を押すだけ</b>です。<br>"+
    "<span style=\"font-weight:400;font-size:11.5px\">開かない／エラーが出た場合は、"+
    "同じ内容をコピー済みなのでチャットに貼ってください</span>";
  document.body.appendChild(b);
  setTimeout(()=>{ b.style.opacity="0"; setTimeout(()=>b.remove(),600); }, 9000);
}
function exportLikes(){
  const meta=likeMeta(); const ids=favs();
  const rows=ids.map(id=>{
    const m=meta[id]||{};
    return {id:id, kind:m.kind||"", title:m.title||"", ai:m.ai||"", tags:m.tags||[],
            level:m.level||"", use:m.use||"", origin:m.origin||"", author:m.author||"",
            axes:m.axes||{}, at:m.at||""};
  });
  // 傾向がひと目で分かるよう、こちらで集計まで済ませておく
  const tally=(f)=>{const c={}; rows.forEach(r=>{const v=f(r); if(v) c[v]=(c[v]||0)+1;});
    return Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,v])=>k+":"+v).join(" / ");};
  const summary={
    "AI別": tally(r=>r.ai),
    "① 場面": tally(r=>r.axes.scene),
    "② 種類": tally(r=>r.axes.kind),
    "③ 効き方": tally(r=>r.axes.effect),
    "④ 手間": tally(r=>r.axes.effort),
    "⑤ 具体度": tally(r=>r.axes.depth),
    "レベル": tally(r=>r.level),
    "用途": tally(r=>r.use),
    "出どころ": tally(r=>r.origin)
  };
  const nmeta=nopeMeta();
  const nrows=nopes().map(id=>{const m=nmeta[id]||{};
    return {id:id, title:m.title||"", ai:m.ai||"", axes:m.axes||{}, at:m.at||""};});
  const out=JSON.stringify({exported:new Date().toISOString().slice(0,16),
    count:rows.length, 違うと答えた数:nrows.length,
    傾向: summary, likes:rows, nopes:nrows, 外したもの: offList()}, null, 1);
  navigator.clipboard.writeText(out).then(()=>{
    alert("いいね "+rows.length+"件をコピーしました。\nClaudeのチャットに貼り付けてください。");
  }).catch(()=>{
    const b=new Blob([out],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(b);
    a.download="私のいいね.json"; a.click();
  });
}

function match(it){
  if(hideNope && nopes().includes(it.id||it.url)) return false;
  if(onlyLiked){
    const key = it.id || it.url;
    if(!favs().includes(key)) return false;
  }
  if(ai!=="すべて" && it.ai!==ai) return false;
  if(view==="tips"){
    if(level!=="すべて" && it.level!==level) return false;
    if(onlyPrompt && !it.prompt) return false;
    if(useFor!=="すべて" && it.use!==useFor && it.use!=="両方") return false;
    for(const [k] of AXIS){ if(ax[k]!=="すべて" && (it.axes||{})[k]!==ax[k]) return false; }
  }
  if(view==="tips" && tag!=="すべて"){
    if(tag==="★お気に入り"){ if(!favs().includes(it.id)) return false; }
    else if(tag.indexOf("出どころ:")===0){ if((it.origin||"Claude")!==tag.slice(5)) return false; }
    else if(!(it.tags||[]).includes(tag)) return false;
  }
  if(view==="feed"){
    if(author!=="すべて" && it.author!==author) return false;
    if(onlyNew && daysAgo(it.date)>2) return false;
    if(onlyChap && !(it.chapters||[]).length) return false;
  }
  if(!q) return true;
  return JSON.stringify(it).toLowerCase().indexOf(q)>=0;
}

    <div class="fhead"><span class="who">${f.pick==="オーナー指定"?"★ ":""}${esc(f.author)}</span>
      <span class="kind">${f.kind==="youtube"?"YouTube":"note"}</span>
      <span class="ai ${aiClass(f.ai)}" style="font-size:10px">${esc(f.ai)}</span>
      <span class="${daysAgo(f.date)<=1?"when today":"when"}">${esc(whenLabel(f.date))}</span>
      <span class="fvote"
      ><button class="fav ${favs().includes(f.url)?"on":""}" data-fav="${esc(f.url)}"
      data-info='${esc(JSON.stringify({kind:f.kind,title:f.title,ai:f.ai,author:f.author,date:f.date}))}'
      >${favs().includes(f.url)?"👍":"👍"}</button
      ><button class="nope ${nopes().includes(f.url)?"on":""}" data-nope="${esc(f.url)}"
      title="これは自分には合わない、と伝えます"
      data-ninfo='${esc(JSON.stringify({kind:f.kind,title:f.title,ai:f.ai,author:f.author,date:f.date}))}'
      >👎</button></span></div>
    <a class="ftitle" href="${esc(f.url)}" target="_blank" rel="noopener">${hl(esc(f.title))}</a>
    ${f.summary?`<p class="fsum">${esc(f.summary)}</p>`:""}
    ${chap}
  </div></div></article>`;
}

function tipCard(t){
  const st=(t.steps||[]);
  const steps = st.length<=5
    ? st.map(s=>`<li>${esc(s)}</li>`).join("")
    : st.slice(0,4).map(s=>`<li>${esc(s)}</li>`).join("")
      + `</ol><details class="chap"><summary>残り${st.length-4}手順を見る</summary><ol class="steps" start="5">`
      + st.slice(4).map(s=>`<li>${esc(s)}</li>`).join("") + `</ol></details><ol class="steps" style="display:none">`;
  const prompt=t.prompt?`<div class="promptbox"><button class="copy">コピー</button>${esc(t.prompt)}</div>`:"";
  const src = (t.source && t.source.url)
    ? `<a class="src" href="${esc(t.source.url)}" target="_blank" rel="noopener">出典 ↗</a>`
    : (t.source ? `<span class="src" style="color:var(--muted);font-weight:600" title="${esc(t.source.title||"")}">出典: 配布教材</span>`
                : `<span class="src unverified">出典なし</span>`);
  return `<article class="card">
    <div class="badges"><span class="ai ${aiClass(t.ai)}">${esc(t.ai)}</span>
      <span class="lv">${esc(t.level||"")}</span>
      <span class="org ${esc(t.origin||"Claude")}">${t.origin==="Claude"?"Claude独自":esc(t.origin||"Claude")}</span>
      <button class="fav ${favs().includes(t.id)?"on":""}" data-fav="${esc(t.id)}"
        data-info='${esc(JSON.stringify({kind:"tip",title:t.title,ai:t.ai,tags:t.tags||[],level:t.level,use:t.use,origin:t.origin,axes:t.axes||{}}))}'
        >${favs().includes(t.id)?"👍 いいね済":"👍 いいね"}</button
      ><button class="nope ${nopes().includes(t.id)?"on":""}" data-nope="${esc(t.id)}"
        title="これは自分には合わない、と伝えます"
        data-ninfo='${esc(JSON.stringify({kind:"tip",title:t.title,ai:t.ai,level:t.level,use:t.use,axes:t.axes||{}}))}'
        >${nopes().includes(t.id)?"👎 違う済":"👎"}</button></div>
    <h3>${esc(t.title)}</h3>
    <p class="sum">${esc(t.summary)}</p>
    ${t.why?`<p class="why">${esc(t.why)}</p>`:""}
    ${steps?`<ol class="steps">${steps}</ol>`:""}
    ${prompt}
    <div class="foot">${(t.tags||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join("")}${src}</div>
  </article>`;
}

function daysAgo(d){
  if(!d) return 999;
  const p=String(d).split("-");
  if(p.length<3) return 999;
  const t=new Date();
  const today=Date.UTC(t.getFullYear(), t.getMonth(), t.getDate());
  const x=Date.UTC(+p[0], +p[1]-1, +p[2]);
  const n=Math.round((today-x)/86400000);
  return n<0 ? 0 : n;   // 時差で未来日付になった分は「今日」扱い
}

function homeView(){
  const fresh = DATA.feed.filter(f=>daysAgo(f.date)<=2).slice(0,5);
  const news  = DATA.news.filter(n=>daysAgo(n.date)<=1).slice(0,6);
  const recentTips = [...DATA.tips].reverse().slice(0,3);
  const box = (f)=>`<div class="big"><div class="frow">${thumbHtml(f,false)}<div class="fbody">
      <div class="fhead"><span class="who">${f.pick==="オーナー指定"?"★ ":""}${esc(f.author)}</span>
        <span class="kind">${f.kind==="youtube"?"YouTube":"note"}</span>
        <span class="ai ${aiClass(f.ai)}" style="font-size:10px">${esc(f.ai)}</span>
        <span class="${daysAgo(f.date)<=1?"when today":"when"}">${esc(whenLabel(f.date))}</span></div>
      <h3><a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.title)}</a></h3>
      ${f.summary?`<p class="fsum">${esc(f.summary)}</p>`:""}
      ${(f.chapters||[]).length?`<details class="chap"><summary>この回の内容（目次 ${f.chapters.length}項目）</summary><ul>`
        +f.chapters.map(c=>`<li><span class="t">${esc(c.t)}</span>${esc(c.label)}</li>`).join("")+`</ul></details>`:""}
    </div></div></div>`;
  return `
  <div class="sec"><h2>追いかけている人の新着 <em>${fresh.length}</em>
     <a href="#" data-goto="feed">すべて見る →</a></h2>
    ${fresh.length?fresh.map(box).join(""):`<p class="zero">直近2日の新着はありません。「動画・note」タブに過去の分があります。</p>`}</div>

  <div class="sec"><h2>今日のニュース <em>${news.length}</em>
     <a href="#" data-goto="news">すべて見る →</a></h2>
    ${news.length?news.map(newsRow).join(""):`<p class="zero">今日のニュースはまだありません。</p>`}</div>

  <div class="sec"><h2>最近ふえたコツ <a href="#" data-goto="tips">すべて見る →</a></h2>
    <div class="grid">${recentTips.map(tipCard).join("")}</div></div>`;
}

let filterOpen=false;
function activeFilters(){
  const a=[];
  if(onlyLiked) a.push("👍いいね");
  if(view==="tips"){
    if(ai!=="すべて") a.push(ai);
    if(useFor!=="すべて") a.push(useFor);
    AXIS.forEach(([k])=>{ if(ax[k]!=="すべて") a.push(ax[k]); });
    if(level!=="すべて") a.push(level);
    if(onlyPrompt) a.push("コピーできる");
    if(tag!=="すべて") a.push(tag);
  }
  if(view==="feed"){
    if(ai!=="すべて") a.push(ai);
    if(author!=="すべて") a.push(author);
    if(onlyNew) a.push("直近2日");
    if(onlyChap) a.push("目次あり");
  }
  if(view==="news" && ai!=="すべて") a.push(ai);
  return a;
}
function renderFilterHead(n){
  const act=activeFilters();
  el("#filterhead").innerHTML = `<div class="fhead">
    <button class="fbtn ${act.length?"act":""}" id="fToggle">⚙ 絞り込み${act.length?"（"+act.length+"）":""} ${filterOpen?"▲":"▼"}</button>
    ${act.length?`<span class="fsum2">${act.map(esc).join(" / ")}</span><button class="fbtn" id="fReset">✕ 解除</button>`:""}
    <span class="fsum2" style="margin-left:auto">${n}件</span></div>`;
  el("#filterwrap").classList.toggle("open", filterOpen);
  el("#fToggle").onclick=()=>{filterOpen=!filterOpen;render();};
  const fr=el("#fReset");
  if(fr) fr.onclick=()=>{ ai="すべて"; tag="すべて"; author="すべて"; level="すべて";
    useFor="すべて"; onlyPrompt=false; onlyNew=false; onlyChap=false; onlyLiked=false;
    axReset(); shown=PAGE; render(); };
}
function render(){
  let list=items().filter(match);
  renderFilterHead(list.length);
  if(view==="tips"){
    if(sortBy==="新着順") list=[...list].reverse();
    else list=[...list].sort((a,b)=>(a.ai+a.level).localeCompare(b.ai+b.level));
  }
  pills();
  if(view==="cast"){
    el("#filterhead").innerHTML=""; el("#filterwrap").classList.remove("open");
    el("#aipills").innerHTML=""; el("#tagpills").innerHTML=""; el("#authorpills").innerHTML="";
    el("#hint").textContent="上の🔊がずんだもん＆四国めたんの音声です。下は同じ内容の台本なので、読み物としてどうぞ。";
    el("#body").innerHTML=castView();
    const edrow=el("#edrow");
    if(edrow){ edrow.querySelectorAll(".edpill").forEach(b=>{ b.onclick=()=>{
      castEd=b.dataset.ed;
      try{ localStorage.setItem(ED_KEY,castEd); }catch(e){}
      render();
    };}); }
    document.querySelectorAll(".line").forEach(p=>p.onclick=()=>{
      document.querySelectorAll(".line").forEach(x=>x.classList.remove("now"));
      p.classList.add("now");
    });
    return;
  }
  if(view==="home"){
    el("#filterhead").innerHTML=""; el("#filterwrap").classList.remove("open");
    el("#aipills").innerHTML=""; el("#tagpills").innerHTML=""; el("#authorpills").innerHTML="";
    el("#hint").textContent="毎朝ここだけ見れば足ります。★はあなたが指定した発信者です。";
    el("#body").innerHTML=homeView();
    document.querySelectorAll(".copy").forEach(b=>b.onclick=()=>{
      const txt=b.parentElement.textContent.replace(/^コピー/,"");
      navigator.clipboard.writeText(txt).then(()=>{b.textContent="コピーしました";b.classList.add("done");
        setTimeout(()=>{b.textContent="コピー";b.classList.remove("done")},1400);});
    });
    const lb=el("#fLiked"); if(lb) lb.onclick=()=>{onlyLiked=!onlyLiked;shown=PAGE;render();};
  document.querySelectorAll("[data-fav]").forEach(b=>b.onclick=(e)=>{
      e.preventDefault(); e.stopPropagation();
      let info={}; try{ info=JSON.parse(b.dataset.info||"{}"); }catch(_){}
      toggleFav(b.dataset.fav, info);
    });
  document.querySelectorAll("[data-nope]").forEach(b=>b.onclick=(e)=>{
      e.preventDefault(); e.stopPropagation();
      let info={}; try{ info=JSON.parse(b.dataset.ninfo||"{}"); }catch(_){}
      toggleNope(b.dataset.nope, info);
    });
    document.querySelectorAll("[data-goto]").forEach(a=>a.onclick=(e)=>{
      e.preventDefault();
      const v=a.dataset.goto;
      document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.dataset.view===v));
      view=v; ai="すべて"; tag="すべて"; author="すべて"; render();
      window.scrollTo(0,0);
    });
    return;
  }
  const hints={tips:"プロンプトはそのままコピーできます。黒い X バッジ＝Xで話題の投稿、オレンジ＝Claude独自の知見です。",
    feed:"★はあなたが指定した発信者。「この回の内容」を開くと、動画のどこで何を話しているかが分かります。",
    news:"自動収集（1日1回）。見出しと出典だけの速報です。"};
  el("#hint").textContent = hints[view];
  const page=list.slice(0,shown);
  const moreBtn = list.length>shown
    ? `<button class="more" id="more">もっと見る（残り ${list.length-shown} 件）</button>` : "";
  el("#body").innerHTML = list.length===0 ? `<p class="empty">該当なし</p>`
    : (view==="tips" ? `<div class="grid">${page.map(tipCard).join("")}</div>${moreBtn}`
       : view==="feed" ? `<div>${page.map(feedCard).join("")}</div>${moreBtn}`
                     : `<div>${page.map(newsRow).join("")}</div>${moreBtn}`);
  const mb=el("#more"); if(mb) mb.onclick=()=>{ shown+=PAGE; render(); };
  document.querySelectorAll(".copy").forEach(b=>b.onclick=()=>{
    const txt=b.parentElement.textContent.replace(/^コピー/,"");
    navigator.clipboard.writeText(txt).then(()=>{b.textContent="コピーしました";b.classList.add("done");
      setTimeout(()=>{b.textContent="コピー";b.classList.remove("done")},1400);});
  });
    const lb=el("#fLiked"); if(lb) lb.onclick=()=>{onlyLiked=!onlyLiked;shown=PAGE;render();};
  document.querySelectorAll("[data-fav]").forEach(b=>b.onclick=(e)=>{
      e.preventDefault(); e.stopPropagation();
      let info={}; try{ info=JSON.parse(b.dataset.info||"{}"); }catch(_){}
      toggleFav(b.dataset.fav, info);
    });
  document.querySelectorAll("[data-nope]").forEach(b=>b.onclick=(e)=>{
      e.preventDefault(); e.stopPropagation();
      let info={}; try{ info=JSON.parse(b.dataset.ninfo||"{}"); }catch(_){}
      toggleNope(b.dataset.nope, info);
    });
}
window.addEventListener("scroll",()=>{
  el("#totop").classList.toggle("show", window.scrollY>600);
});
el("#totop").onclick=()=>window.scrollTo({top:0,behavior:"smooth"});
document.addEventListener("keydown",(e)=>{
  if(e.key==="/" && document.activeElement!==el("#q")){ e.preventDefault(); el("#q").focus(); }
  if(e.key==="Escape"){ el("#q").value=""; q=""; shown=PAGE; render(); el("#q").blur(); }
});
