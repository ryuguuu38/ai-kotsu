", "thumb": "https://assets.st-note.com/production/uploads/images/306033268/rectangle_large_type_2_9d64be65c9032d535626bfee84f469c5.png?width=800", "author": "KEITO（note）", "pick": "オーナー指定", "ai": "Claude", "chapters": [], "summary": "「夜の商店街で女性が猫を抱き上げて終わり」くらいの話し言葉を渡すと、Seedance 2.5にそのまま貼れる完成プロンプトが1本出てくるスキル「seedance-2-5-prompt」を販売します。画像・動画・音声・手描きの絵コンテを渡しても動きます。Seedance 2.5のプロンプトには「こう書くと当たる」正解パターンがあって、それを公式ガイドから抜き出して覚えさせたものです。Codexで作ってますが、Claude Codeでもそのまま使えます。続きをみる"}, {"kind": "note", "title": "【スキル配布】サイトの右下に0円で動く「AIに相談」ボタンを3分で付ける「ask-ai-widget」", "url": "https://note.com/keito_12kk2/n/nedf06311148f", "date": "2026-08-21", "thumb": "https://assets.st-note.com/production/uploads/images/305550256/rectangle_large_type_2_f5cfbb230316aba495aa1f63e91f4351.png?width=800", "author": "KEITO（note）", "pick": "オーナー指定", "ai": "Claude", "chapters": [], "summary": "ウェブサイトのフォルダを渡すだけで、全ページの右下に「AIに相談」ボタンが付くClaude Codeスキル「ask-ai-widget」を販売します。訪問者がボタンを押すと、そのページの内容に合わせた質問が3つ並び、ChatGPT・Claude・Gemini・Perplexityから選んだAIが質問入りで開く。サイト側にサーバーもAPIキーも要らないので、月額0円で動きます。続きをみる"}, {"kind": "note", "title": "【WebMCP】スキル共有がURL1本になる。自分専用の配布所キットスキル「webmcp-skill-server」", "url": "https://note.com/keito_12kk2/n/n542e326ffb62", "date": "2026-08-14", "thumb": "https://assets.st-note.com/production/uploads/images/303416045/rectangle_large_type_2_fbfc738358a77c7cd514361333e9010e.png?width=800", "author": "KEITO（note）", "pick": "オーナー指定", "ai": "Claude", "chapters": [], "summary": "自作のAIスキルをURL1本でチームや他社に配れるようになるスターターキット「webmcp-skill-server」を販売します。フォルダをClaude Codeに渡して「セットアップして」と頼むと、Cloudflare上に自分専用のスキル配布所が建ちます。あとはスキルを格納して、相手にURLと接続キーを送るだけです。続きをみる"}, {"kind": "note", "title": "ループ・グラフ・プロンプト...増えすぎた「◯◯エンジニアリング」の違いを整理", "url": "https://note.com/keito_12kk2/n/n918dbc078dfd", "date": "2026-08-10", "thumb": "https://assets.st-note.com/production/uploads/images/302114350/rectangle_large_type_2_1e27ab1fa2cf1a49b52359b6a0e76d5d.png?width=800", "author": "KEITO（note）", "pick": "オーナー指定", "ai": "Claude", "chapters": [], "summary": "AIの精度は設計で決まる。最近「ループエンジニアリング」って言葉をよく見るようになった。Anthropicの中の人が「最近ほとんど指示してない。ループを組んでるだけ」って言って一気に広まったやつ。続きをみる"}, {"kind": "note", "title": "【スキル】AI実写＋図解解説動画が出来上がる「zukai-kaisetsu」スキル", "url": "https://note.com/keito_12kk2/n/n9cc8f92529a6", "date": "2026-08-08", "thumb": "https://assets.st-note.com/production/uploads/images/302115741/rectangle_large_type_2_0675a6c59061a2372f0537800f509f70.png?width=800", "author": "KEITO（note）", "pick": "オーナー指定", "ai": "Claude", "chapters": [], "summary": "資料や議事録を貼るだけで、AI実写ベースの解説動画（MP4）が出来上がるClaude Codeスキル「zukai-kaisetsu」を販売します。※スキルは各々カスタマイズしていく前提だと考えてください。続きをみる"}, {"kind": "note", "title": "【AIスキル】画像生成だけで縦長LPを丸ごと作る自作スキル「image-only-lp」（Claude&Codex）", "url": "https://note.com/keito_12kk2/n/nb6bbb12905de", "date": "2026-08-05", "thumb": "https://assets.st-note.com/production/uploads/images/302115850/rectangle_large_type_2_6a3dd969b5e3cf251a2b34fdb95aaf16.png?width=800", "author": "KEITO（note）", "pick": "オーナー指定", "ai": "Claude", "chapters": [], "summary": "こんにちは。KEITOです。YouTubeとかXとかでAIに関する情報発信してます。 KEITO【AI&amp;WEB ch】AI x WEB YouTuber and Director. In this channel, he introduceyoutube.com 続きをみる"}, {"kind": "note", "title": "エージェントAI開発とは、知識を用意し、経験を言語化し、手段を繋ぐことである", "url": "https://note.com/brave_quince241/n/nf11a13e37ac9", "date": "2026-08-03", "thumb": "https://assets.st-note.com/production/uploads/images/299914544/rectangle_large_type_2_8482d903d0f3dd2aa31e274bba99038e.png?width=800", "author": "伊志嶺｜LLMで業務改善（note）", "pick": "オーナー指定", "ai": "その他", "chapters": [], "summary": "最近のAIエンジニアの基本的な仕事は、突き詰めるとすべて同じ構造をしています。知識を用意し、経験を言語化し、手段をシステム化する。RAG（社内文書などを検索し、回答に反映させる仕組み）を組むのも、プロンプトを書くのも、マルチエージェント構成を設計するのも、ツールを繋ぎ込むのも、すべてこの3つのどれかに分類できます。LLMは「カスタマイズ可能な頭脳」である続きをみる"}, {"kind": "note", "title": "今雇える最低ラインのエンジニアの要件を整理してみたら、レベルが高すぎて絶望した話", "url": "https://note.com/brave_quince241/n/n4bdfac4bdd35", "date": "2026-08-01", "thumb": "https://assets.st-note.com/production/uploads/images/299293928/rectangle_large_type_2_d3661ace2351dc7d79f2374b25546ce2.png?width=800", "author": "伊志嶺｜LLMで業務改善（note）", "pick": "オーナー指定", "ai": "その他", "chapters": [], "summary": "「即戦力」という言葉を、自分はどういう意味で使っているのか。採用の話をするたびに引っかかっていたので、雇う価値があると判断できる最低ラインを一度書き出してみました。出てきたのは 5 項目です。書き終えて最初に思ったのは、これは本当に「最低」なのか、という戸惑いでした。数年前に自分が「一人前」と呼んでいた像と、ほとんど重なっていたからです。しかも中身は、手を動かして作れることよりも、要件と設計のどちらがおかしいのかを判断できることに寄っていました。エンジニアを雇う最低ラインの要件を言語化してみる続きをみる"}, {"kind": "note", "title": "そろそろ LLMO に手を出してみようと思ったわけ。見送った去年との違い", "url": "https://note.com/brave_quince241/n/n1153c9ba1659", "date": "2026-07-24", "thumb": "https://assets.st-note.com/production/uploads/images/297211693/rectangle_large_type_2_0da9d8a714c383319a2ec4d4f0ecb79c.png?width=800", "author": "伊志嶺｜LLMで業務改善（note）", "pick": "オーナー指定", "ai": "Claude", "chapters": [], "summary": "去年、LLMO という言葉は何度も目に入っていました。ChatGPT や Claude のような大規模言語モデルに自分の情報を参照してもらう取り組みを指す言葉として、タイムラインを流れていました。それでも私は何もしませんでした。「llms.txt を置くべきだ」といった攻略法めいた話が、出所も示されないまま並んでいたからです。その私が今年になって、自分の作ったものをどう見つけてもらうかを考え直しています。手を出すかどうかを決める材料が、この一年で変わったからです。去年は、真偽のわからない話ばかりが流れていました続き"}, {"kind": "note", "title": "特化型AIはなぜ今も必要なのか。エージェントAI時代の道具の使い分け", "url": "https://note.com/brave_quince241/n/nb98f2fbd35cf", "date": "2026-07-22", "thumb": "https://assets.st-note.com/production/uploads/images/296465874/rectangle_large_type_2_a108b447db8689c80eb59a1c2bef8a33.png?width=800", "author": "伊志嶺｜LLMで業務改善（note）", "pick": "オーナー指定", "ai": "Claude", "chapters": [], "summary": "ChatGPT や Claude のような、頼めば何でもこなす AI が身近になりました。こうしたエージェント AI が文章も画像も一通り扱えるなら、画像認識や翻訳に特化した従来型の AI はもう役割を終えたのでしょうか。実際にはその逆で、目的をしぼった特化型 AI は今も広く使われています。人間が複雑な計算もできるのに、速さのために電卓を使うのと同じ理屈です。大切なのは、どちらが優れているかを競うことよりも、目的に応じて道具を使い分けることです。その分かれ目が、コストと速度の桁の差にあらわれます。エージェントAI"}, {"kind": "note", "title": "プロンプト・コンテキスト・ハーネス・ループ。AIエージェントを支える四つのエンジニアリングの違い", "url": "https://note.com/brave_quince241/n/n82d3e73663e3", "date": "2026-07-11", "thumb": "https://assets.st-note.com/production/uploads/images/293151756/rectangle_large_type_2_4997437beb7cb7f4017d1a62e84835ff.png?width=800", "author": "伊志嶺｜LLMで業務改善（note）", "pick": "オーナー指定", "ai": "その他", "chapters": [], "summary": "「プロンプトエンジニアリング」に続いて「コンテキストエンジニアリング」、さらに「ハーネス」「ループ」と、似た響きの言葉が次々に現れています。どれを使えばよいのか、これまでの言葉はもう不要になったのか、と戸惑う方も多いのではないでしょうか。けれどこの四つは、互いを置き換え合う流行語ではありません。内側が外側に含まれる入れ子の関係にあり、プロンプトをコンテキストが含み、それをハーネスが含み、さらにループが含みます。この入れ子が分かれば、それぞれの言葉が何を設計するためのものかを、内側から順に置いていけます。四つの言葉が"}, {"kind": "note", "title": "組織の知識管理は分散型へ、社員一人ひとりの「レプリカント」が支える近未来", "url": "https://note.com/brave_quince241/n/n2403bdcba0b5", "date": "2026-07-10", "thumb": "https://assets.st-note.com/production/uploads/images/292958375/rectangle_large_type_2_c03f61e416be08670250b7972b091f67.png?width=800", "author": "伊志嶺｜LLMで業務改善（note）", "pick": "オーナー指定", "ai": "その他", "chapters": [], "summary": "退職する同僚の頭の中にあった判断の理由は、引き継ぎ資料にはほとんど残りません。組織の知識管理は長らく、この抜け落ちを「サイロの問題」ととらえ、情報を一元管理することで埋めようとしてきました。ですが、本人が不在でも本人に代わって問い合わせに答える「レプリカント(記憶の複製)」が現実味を帯びるにつれ、その前提は揺らぎ始めます。集中型から分散型へ。組織の知識管理をめぐる一つの見取り図を、順を追って共有します。以下に書くのは、一つの構想であり思考実験です。続きをみる"}, {"kind": "note", "title": "エンジニアでなくても知っておきたい、AIに丸投げしない5段階の資料づくり", "url": "https://note.com/brave_quince241/n/n84fcc51af64d", "date": "2026-07-09", "thumb": "https://assets.st-note.com/production/uploads/images/292741015/rectangle_large_type_2_9a053beb37bea398707896341deacd80.png?width=800", "author": "伊志嶺｜LLMで業務改善（note）", "pick": "オーナー指定", "ai": "その他", "chapters": [], "summary": "AIに資料づくりを頼んだのに、それらしいけれど芯を外した出来にがっかりした経験はないでしょうか。開発現場で古くから使われてきた「要件定義→設計→レビュー→実行→自己レビュー」という5段階の進め方は、エンジニアでなくても日々の資料づくりにそのまま応用できます。たとえば取引先への提案資料も、いきなり書かせるのではなく目的と骨組みを先に決めてから任せると、出来がはっきり変わります。特別な技術ではなく、作る前に狙いを固め、作った後に見直すという、誰の作業にも効く汎用的な段取りだからです。丸投げをやめてこの段取りで任せるだけ"}, {"kind": "note", "title": "Claude Code のモデル使い分け：役割別割り当てでコストと品質を両立する", "url": "https://note.com/brave_quince241/n/nf057e0190777", "date": "2026-07-08", "thumb": "https://assets.st-note.com/production/uploads/images/292619916/rectangle_large_type_2_52be0882db1abab81dd66a02d71b6e64.png?width=800", "author": "伊志嶺｜LLMで業務改善（note）", "pick": "オーナー指定", "ai": "Claude", "chapters": [], "summary": "サブエージェントを組んでいると、要件定義・実装・テスト・レビューのどの工程にどのモデルを割り当てるべきか、毎回迷う場面が出てきます。ここを役割ごとに整理して割り当てると、コストと品質を無理なく両立できます。基本は、4 つの役割それぞれに、求められる能力とコストの釣り合う 1 モデルを対応づけることです。単価が高く常用しにくい Fable だけは例外で、常時は割り当てず、判断に迷った要所でだけ助言を仰ぐ相談相手として使います。サブエージェントの役割を分解する続きをみる"}, {"kind": "note", "title": "動画を丸投げするだけでnotionマニュアルが完成するAIスキル｜セットアップ解説動画付き", "url": "https://note.com/keito_12kk2/n/nd85494896097", "date": "2026-06-24", "thumb": "https://assets.st-note.com/production/uploads/images/302115973/rectangle_large_type_2_a01f06cf20eb665fab339f06e169862a.png?width=800", "author": "KEITO（note）", "pick": "オーナー指定", "ai": "Claude", "chapters": [], "summary": "今回は、Claude CodeやCodexに動画を丸投げするだけで、画像付きのマニュアルがNotion上に自動で完成するスキルを紹介します。あわせて、この記事ではそのスキルのセットアップ方法も解説していきます。続きをみる"}, {"kind": "note", "title": "【公式から学ぶ】Claude・Claude Codeのプロンプトのコツ", "url": "https://note.com/keito_12kk2/n/n0f340029ed46", "date": "2026-06-02", "thumb": "https://assets.st-note.com/production/uploads/images/288350117/rectangle_large_type_2_9999169b542bf24aa7e49b323fc42198.jpeg?width=800", "author": "KEITO（note）", "pick": "オーナー指定", "ai": "Claude", "chapters": [], "summary": "Anthropic公式ドキュメント『プロンプトのベストプラクティス』を参考にClaude・Claude Codeのプロンプトのコツをまとめていきます。https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices続きをみる"}, {"kind": "note", "title": "OpenAI『Codex』を解説！基本概念から主要機能、スキル作成、自動化の設定方法など", "url": "https://note.com/keito_12kk2/n/nd0c2617b64ea", "date": "2026-06-01", "thumb": "https://assets.st-note.com/production/uploads/images/288349191/rectangle_large_type_2_52cb9216f9473e653a8cb9d6951a558a.png?width=800", "author": "KEITO（note）", "pick": "オーナー指定", "ai": "Claude", "chapters": [], "summary": "OpenAIが開発した最新のAIコーディング・業務実行エージェントであるOpenAI CodexはこれまでのAIチャットツールとは一線を画し、「考える」だけでなく「実行する」パートナーとして、デスクトップ上の様々な作業を自律的にこなします。本記事では、Codexの基本概念から主要機能、スキルの作成、自動化の設定方法、そして具体的な業務自動化ワークフローまでを徹底的に解説します。続きをみる"}, {"kind": "note", "title": "【革命的機能】Claude Opus 4.8の『Dynamic Workflow』を解説", "url": "https://note.com/keito_12kk2/n/n687a7030d9e6", "date": "2026-05 、一度で実行させる。"}, {"who": "zunda", "text": "メモしておくのだ！"}, {"who": "metan", "text": "出どころは、Claude Code生みの親が明かした仕事術──Plan Modeの真実 note・2026-09-18 ね。"}, {"who": "metan", "text": "ここからは、今日出たものを軽く流すわ。"}, {"who": "metan", "text": "1本目は、KEITO AIWEBさんの動画。AnthropicのパーソナルAI Claude Duet デュエット を解説！どう使うべき？。"}, {"who": "metan", "text": "2本目は、Claude Code Lab noteさんの記事。AIを入れたのに使われない会社の共通点。調査4本と20回の実測。"}, {"who": "zunda", "text": "詳しく聞きたいのだ！"}, {"who": "metan", "text": "Claude Code研究所 技術ブログ担当です。 全社にAIを入れたのに、使っているのは一部の人だけ 。この問題を、調査データと手元の実測の両方から調べました。先に結論です。AnthropicのClaude Codeのような生成AIが使われない会社では、AIが 担当者が任意で使う道具 のまま置かれています。詳しい数字と検証の全条件は、サイトに記事として書きました。このnoteでは要点だけをまとめ。"}, {"who": "metan", "text": "3本目は、Claude Code Lab noteさんの記事。Claude Codeのスキルは読むだけでコマンドが動く？新フックを47回実測。"}, {"who": "zunda", "text": "へえ、それで？"}, {"who": "metan", "text": "Claude Code研究所 技術ブログ担当です。人が作ったスキルを入れて使うとき、中に書かれたコマンドが いつ・誰の許可で 動くのか、気になったことはありませんか。AnthropicのClaude Codeでは、スキルに書かれた ! 付きのシェルコマンドが、許可チェックを通ると、スキルを読み込む時点で実行されます。11月25日公開のv2.1.332で、これを止める専用のフック PreSkillS。"}, {"who": "metan", "text": "4本目は、伊志嶺 LLMで業務改善 noteさんの記事。Claude のプラグインで、会社全体に やり方 ではなく 仕組み を配る。"}, {"who": "zunda", "text": "それ、何がすごいのだ？"}, {"who": "metan", "text": "社内でスキルを共有してみたものの、効果は個々の作業が少し楽になる程度にとどまっています。スキルの共有から始めた会社が、最初に突き当たる壁です。スキルだけで配ると、作業が 1 つの会話の中に積み上がり、大きな仕事を任せたときに精度が落ちます。1 つのテーマに関わる作業をまとめて配ることも、配った手順の版を管理することも、スキル単体では難しいのが実情です。プラグインとマーケットプレイスを使えば、スキル。"}, {"who": "metan", "text": "最後に、今日のニュースから気になったものだけ。"}, {"who": "metan", "text": "まず、Claudeの話。Claudeで作ったHTMLをコードを書かずにビジュアル編集する方法。"}, {"who": "metan", "text": "つぎは、Claudeの話。人類が167年解けなかったリーマン予想をAIが解いた。人間はまだ中身を読めていない。"}, {"who": "zunda", "text": "見出しだけでも、流れは分かるのだ。"}, {"who": "metan", "text": "最後は、Claudeの話。Claude Code並列稼働の裏で起きる設計破綻—— 自律エージェントの暴走 を構造で封じる制御プロトコル。"}, {"who": "zunda", "text": "気になったのがあったら、サイトのニュース欄から開けるのだ。"}, {"who": "metan", "text": "以上よ。詳しくはサイトのカードから、元の動画や記事に飛べるわ。"}, {"who": "zunda", "text": "今日もいい一日にするのだ！"}, {"who": "metan", "text": "音声は ボイスボックス。ずんだもんと四国めたんで作っているわ。"}], "credit": "VOICEVOX:  "text": "なんで効くのだ？"}, {"who": "metan", "text": "AIは基本的に肯定してくる。そのまま使うと、自分の思い込みが補強されるだけで終わる。"}, {"who": "zunda", "text": "やり方も教えてほしいのだ！"}, {"who": "metan", "text": "2段階よ。"}, {"who": "metan", "text": "1、依頼の最後に反論を求める一文を足す。"}, {"who": "metan", "text": "2、出てきた反論のうち、納得できるものだけ採用する。"}, {"who": "zunda", "text": "メモしておくのだ！"}, {"who": "metan", "text": "出どころは、ChatGPTに疑問を持たせるプロンプト X ね。"}, {"who": "metan", "text": "ここからは、今日出たものを軽く流すわ。"}, {"who": "metan", "text": "1本目は、あいまる iPhone×AIさんの動画。ChatGPTの新しいAstraとSol、いちばん上を選んでいたら損かも。同じ仕事を4つのモデルに頼んで、使い分けを決めました GPT-6.2。"}, {"who": "metan", "text": "2本目は、あいまる iPhone×AIさんの動画。AIに課金する前に見て！ChatGPT・Geminiの無料版でスマホ料金を比較してみた。"}, {"who": "metan", "text": "3本目は、SHIFT AI ニュースさんの動画。ChatGPTのdotsがPlusでも使える 頼むだけで24時間仕事を進めるAI。"}, {"who": "metan", "text": "4本目は、けい AIと共に noteさんの記事。AI副業完全攻略 ゼロから月10万円を目指す人へ。地味だけど本当に強い案件獲得術と、選ばれる人になるための3つの条件。"}, {"who": "zunda", "text": "詳しく聞きたいのだ！"}, {"who": "metan", "text": "毎日のようにChatGPTを使い、最新のAIニュースをチェックし、便利なツールの使い方も覚えている。それなのに、AIで収入を得るところまでたどり着けていない。続きをみる。"}, {"who": "metan", "text": "最後に、今日のニュースから気になったものだけ。"}, {"who": "metan", "text": "まず、ChatGPTの話。n8n開発元が無料公開したローカルAI秘書 Nod が実用的すぎた。ChatGPT Plus枠のままブラウザ自動操作まで任せられる話。"}, {"who": "metan", "text": "つぎは、ChatGPTの話。LinearのクラウドコーディングエージェントでBYOKを使う方法。"}, {"who": "zunda", "text": "見出しだけでも、流れは分かるのだ。"}, {"who": "metan", "text": "最後は、ChatGPTの話。AI動画の カットごとに顔が変わる・尺が合わない・文字が潰れる を解決する 音声先行クロック＋IDロック 演出術。"}, {"who": "zunda", "text": "気になったのがあったら、サイトのニュース欄から開けるのだ。"}, {"who": "metan", "text": "以上よ。詳しくはサイトのカードから、元の動画や記事に飛べるわ。"}, {"who": "zunda", "text": "今日もいい一日にするのだ！"}, {"who": "metan", "text": "音声は ボイスボックス。ずんだもんと四国めたんで作っているわ。"}], "credit": "VOICEVOX:ずんだもん / 四国めたん", "tip_ids": ["gpt-005", "gpt-006", "gpt-007"], "voice_built": "2026-11-28 03:50"}, "news": {"edition": "news", "label": "ニュース", "date": "2026-11-28", "built": "2026-11-28 03:42", "minutes": 4.0, "chars": 1494, "lines": [{"who": "metan", "text": "今日はニュース編よ。"}, {"who": "zunda", "text": "ニュースだけ知りたい人向けなのだ！"}, {"who": "metan", "text": "今日 }

function exportLikes(){
  const meta=likeMeta(); const ids=favs();
  const rows=ids.map(id=>{
    const m=meta[id]||{};
    return {id:id, kind:m.kind||"", title:m.title||"", ai:m.ai||"", tags:m.tags||[],
            level:m.level||"", use:m.use||"", origin:m.origin||"", author:m.author||"",
            axes:m.axes||{}, at:m.at||""};
  });
  // 傾向がひと目で分かるよう、こちらで集計まで済ませておく
  const tally=(f)=>{const c={}; rows.forEach(r=>{const v=f(r); if(v) c[v]=(c[v]||0)+1;});
    return Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,v])=>k+":"+v).join(" / ");};
  const summary={
    "AI別": tally(r=>r.ai),
    "① 場面": tally(r=>r.axes.scene),
    "② 種類": tally(r=>r.axes.kind),
    "③ 効き方": tally(r=>r.axes.effect),
    "④ 手間": tally(r=>r.axes.effort),
    "⑤ 具体度": tally(r=>r.axes.depth),
    "レベル": tally(r=>r.level),
    "用途": tally(r=>r.use),
    "出どころ": tally(r=>r.origin)
  };
  const nmeta=nopeMeta();
  const nrows=nopes().map(id=>{const m=nmeta[id]||{};
    return {id:id, title:m.title||"", ai:m.ai||"", axes:m.axes||{}, at:m.at||""};});
  const out=JSON.stringify({exported:new Date().toISOString().slice(0,16),
    count:rows.length, 違うと答えた数:nrows.length,
    傾向: summary, likes:rows, nopes:nrows, 外したもの: offList()}, null, 1);
  navigator.clipboard.writeText(out).then(()=>{
    alert("いいね "+rows.length+"件をコピーしました。\nClaudeのチャットに貼り付けてください。");
  }).catch(()=>{
    const b=new Blob([out],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(b);
    a.download="私のいいね.json"; a.click();
  });
}

function match(it){
  if(hideNope && nopes().includes(it.id||it.url)) return false;
  if(onlyLiked){
    const key = it.id || it.url;
    if(!favs().includes(key)) return false;
  }
  if(ai!=="すべて" && it.ai!==ai) return false;
  if(view==="tips"){
    if(level!=="すべて" && it.level!==level) return false;
    if(onlyPrompt && !it.prompt) return false;
    if(useFor!=="すべて" && it.use!==useFor && it.use!=="両方") return false;
    for(const [k] of AXIS){ if(ax[k]!=="すべて" && (it.axes||{})[k]!==ax[k]) return false; }
  }
  if(view==="tips" && tag!=="すべて"){
    if(tag==="★お気に入り"){ if(!favs().includes(it.id)) return false; }
    else if(tag.indexOf("出どころ:")===0){ if((it.origin||"Claude")!==tag.slice(5)) return false; }
    else if(!(it.tags||[]).includes(tag)) return false;
  }
  if(view==="feed"){
    if(author!=="すべて" && it.author!==author) return false;
    if(onlyNew && daysAgo(it.date)>2) return false;
    if(onlyChap && !(it.chapters||[]).length) return false;
  }
  if(!q) return true;
  return JSON.stringify(it).toLowerCase().indexOf(q)>=0;
}

  const w=whenLabel(n.date);
  return `<div class="newsrow">${thumbHtml(n,true)}<span class="d ${daysAgo(n.date)===0?"when today":"when"}">${esc(w)}</span>
    <span class="ai ${aiClass(n.ai)}" style="font-size:10px">${esc(n.ai)}</span>
    <a href="${esc(n.url)}" target="_blank" rel="noopener">${hl(esc(n.title))}</a>
    <span class="s">${esc(n.source)}</span>
    ${n.lang==="en"?`<span class="lang">英語</span>`:""}
    <button class="fav ${favs().includes(n.url)?"on":""}" data-fav="${esc(n.url)}" style="margin-left:auto;padding:1px 7px;font-size:11px"
      data-info='${esc(JSON.stringify({kind:"news",title:n.title,ai:n.ai,author:n.source,date:n.date}))}'
      >${favs().includes(n.url)?"👍":"👍"}</button
      ><button class="nope ${nopes().includes(n.url)?"on":""}" data-nope="${esc(n.url)}"
      style="padding:1px 7px;font-size:11px" title="これは自分には合わない、と伝えます"
      data-ninfo='${esc(JSON.stringify({kind:"news",title:n.title,ai:n.ai,author:n.source,date:n.date}))}'
      >👎</button></div>`;
}

function daysAgo(d){
  if(!d) return 999;
  const p=String(d).split("-");
  if(p.length<3) return 999;
  const t=new Date();
  const today=Date.UTC(t.getFullYear(), t.getMonth(), t.getDate());
  const x=Date.UTC(+p[0], +p[1]-1, +p[2]);
  const n=Math.round((today-x)/86400000);
  return n<0 ? 0 : n;   // 時差で未来日付になった分は「今日」扱い
}

function homeView(){
  const fresh = DATA.feed.filter(f=>daysAgo(f.date)<=2).slice(0,5);
  const news  = DATA.news.filter(n=>daysAgo(n.date)<=1).slice(0,6);
  const recentTips = [...DATA.tips].reverse().slice(0,3);
  const box = (f)=>`<div class="big"><div class="frow">${thumbHtml(f,false)}<div class="fbody">
      <div class="fhead"><span class="who">${f.pick==="オーナー指定"?"★ ":""}${esc(f.author)}</span>
        <span class="kind">${f.kind==="youtube"?"YouTube":"note"}</span>
        <span class="ai ${aiClass(f.ai)}" style="font-size:10px">${esc(f.ai)}</span>
        <span class="${daysAgo(f.date)<=1?"when today":"when"}">${esc(whenLabel(f.date))}</span></div>
      <h3><a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.title)}</a></h3>
      ${f.summary?`<p class="fsum">${esc(f.summary)}</p>`:""}
      ${(f.chapters||[]).length?`<details class="chap"><summary>この回の内容（目次 ${f.chapters.length}項目）</summary><ul>`
        +f.chapters.map(c=>`<li><span class="t">${esc(c.t)}</span>${esc(c.label)}</li>`).join("")+`</ul></details>`:""}
    </div></div></div>`;
  return `
  <div class="sec"><h2>追いかけている人の新着 <em>${fresh.length}</em>
     <a href="#" data-goto="feed">すべて見る →</a></h2>
    ${fresh.length?fresh.map(box).join(""):`<p class="zero">直近2日の新着はありません。「動画・note」タブに過去の分があります。</p>`}</div>

  <div class="sec"><h2>今日のニュース <em>${news.length}</em>
     <a href="#" data-goto="news">すべて見る →</a></h2>
    ${news.length?news.map(newsRow).join(""):`<p class="zero">今日のニュースはまだありません。</p>`}</div>

  <div class="sec"><h2>最近ふえたコツ <a href="#" data-goto="tips">すべて見る →</a></h2>
    <div class="grid">${recentTips.map(tipCard).join("")}</div></div>`;
}

let filterOpen=false;
function activeFilters(){
  const a=[];
  if(onlyLiked) a.push("👍いいね");
  if(view==="tips"){
    if(ai!=="すべて") a.push(ai);
    if(useFor!=="すべて") a.push(useFor);
    AXIS.forEach(([k])=>{ if(ax[k]!=="すべて") a.push(ax[k]); });
    if(level!=="すべて") a.push(level);
    if(onlyPrompt) a.push("コピーできる");
    if(tag!=="すべて") a.push(tag);
  }
  if(view==="feed"){
    if(ai!=="すべて") a.push(ai);
    if(author!=="すべて") a.push(author);
    if(onlyNew) a.push("直近2日");
    if(onlyChap) a.push("目次あり");
  }
  if(view==="news" && ai!=="すべて") a.push(ai);
  return a;
}
function renderFilterHead(n){
  const act=activeFilters();
  el("#filterhead").innerHTML = `<div class="fhead">
    <button class="fbtn ${act.length?"act":""}" id="fToggle">⚙ 絞り込み${act.length?"（"+act.length+"）":""} ${filterOpen?"▲":"▼"}</button>
    ${act.length?`<span class="fsum2">${act.map(esc).join(" / ")}</span><button class="fbtn" id="fReset">✕ 解除</button>`:""}
    <span class="fsum2" style="margin-left:auto">${n}件</span></div>`;
  el("#filterwrap").classList.toggle("open", filterOpen);
  el("#fToggle").onclick=()=>{filterOpen=!filterOpen;render();};
  const fr=el("#fReset");
  if(fr) fr.onclick=()=>{ ai="すべて"; tag="すべて"; author="すべて"; level="すべて";
    useFor="すべて"; onlyPrompt=false; onlyNew=false; onlyChap=false; onlyLiked=false;
    axReset(); shown=PAGE; render(); };
}
function render(){
  let list=items().filter(match);
  renderFilterHead(list.length);
  if(view==="tips"){
    if(sortBy==="新着順") list=[...list].reverse();
    else list=[...list].sort((a,b)=>(a.ai+a.level).localeCompare(b.ai+b.level));
  }
  pills();
  if(view==="cast"){
    el("#filterhead").innerHTML=""; el("#filterwrap").classList.remove("open");
    el("#aipills").innerHTML=""; el("#tagpills").innerHTML=""; el("#authorpills").innerHTML="";
    el("#hint").textContent="上の🔊がずんだもん＆四国めたんの音声です。下は同じ内容の台本なので、読み物としてどうぞ。";
    el("#body").innerHTML=castView();
    const edrow=el("#edrow");
    if(edrow){ edrow.querySelectorAll(".edpill").forEach(b=>{ b.onclick=()=>{
      castEd=b.dataset.ed;
      try{ localStorage.setItem(ED_KEY,castEd); }catch(e){}
      render();
    };}); }
    document.querySelectorAll(".line").forEach(p=>p.onclick=()=>{
      document.querySelectorAll(".line").forEach(x=>x.classList.remove("now"));
      p.classList.add("now");
    });
    return;
  }
  if(view==="home"){
    el("#filterhead").innerHTML=""; el("#filterwrap").classList.remove("open");
    el("#aipills").innerHTML=""; el("#tagpills").innerHTML=""; el("#authorpills").innerHTML="";
    el("#hint").textContent="毎朝ここだけ見れば足ります。★はあなたが指定した発信者です。";
    el("#body").innerHTML=homeView();
    document.querySelectorAll(".copy").forEach(b=>b.onclick=()=>{
      const txt=b.parentElement.textContent.replace(/^コピー/,"");
      navigator.clipboard.writeText(txt).then(()=>{b.textContent="コピーしました";b.classList.add("done");
        setTimeout(()=>{b.textContent="コピー";b.classList.remove("done")},1400);});
    });
    const lb=el("#fLiked"); if(lb) lb.onclick=()=>{onlyLiked=!onlyLiked;shown=PAGE;render();};
  document.querySelectorAll("[data-fav]").forEach(b=>b.onclick=(e)=>{
      e.preventDefault(); e.stopPropagation();
      let info={}; try{ info=JSON.parse(b.dataset.info||"{}"); }catch(_){}
      toggleFav(b.dataset.fav, info);
    });
  document.querySelectorAll("[data-nope]").forEach(b=>b.onclick=(e)=>{
      e.preventDefault(); e.stopPropagation();
      let info={}; try{ info=JSON.parse(b.dataset.ninfo||"{}"); }catch(_){}
      toggleNope(b.dataset.nope, info);
    });
    document.querySelectorAll("[data-goto]").forEach(a=>a.onclick=(e)=>{
      e.preventDefault();
      const v=a.dataset.goto;
      document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.dataset.view===v));
      view=v; ai="すべて"; tag="すべて"; author="すべて"; render();
      window.scrollTo(0,0);
    });
    return;
  }
  const hints={tips:"プロンプトはそのままコピーできます。黒い X バッジ＝Xで話題の投稿、オレンジ＝Claude独自の知見です。",
    feed:"★はあなたが指定した発信者。「この回の内容」を開くと、動画のどこで何を話しているかが分かります。",
    news:"自動収集（1日1回）。見出しと出典だけの速報です。"};
  el("#hint").textContent = hints[view];
  const page=list.slice(0,shown);
  const moreBtn = list.length>shown
    ? `<button class="more" id="more">もっと見る（残り ${list.length-shown} 件）</button>` : "";
  el("#body").innerHTML = list.length===0 ? `<p class="empty">該当なし</p>`
    : (view==="tips" ? `<div class="grid">${page.map(tipCard).join("")}</div>${moreBtn}`
       : view==="feed" ? `<div>${page.map(feedCard).join("")}</div>${moreBtn}`
                     : `<div>${page.map(newsRow).join("")}</div>${moreBtn}`);
  const mb=el("#more"); if(mb) mb.onclick=()=>{ shown+=PAGE; render(); };
  document.querySelectorAll(".copy").forEach(b=>b.onclick=()=>{
    const txt=b.parentElement.textContent.replace(/^コピー/,"");
    navigator.clipboard.writeText(txt).then(()=>{b.textContent="コピーしました";b.classList.add("done");
      setTimeout(()=>{b.textContent="コピー";b.classList.remove("done")},1400);});
  });
    const lb=el("#fLiked"); if(lb) lb.onclick=()=>{onlyLiked=!onlyLiked;shown=PAGE;render();};
  document.querySelectorAll("[data-fav]").forEach(b=>b.onclick=(e)=>{
      e.preventDefault(); e.stopPropagation();
      let info={}; try{ info=JSON.parse(b.dataset.info||"{}"); }catch(_){}
      toggleFav(b.dataset.fav, info);
    });
  document.querySelectorAll("[data-nope]").forEach(b=>b.onclick=(e)=>{
      e.preventDefault(); e.stopPropagation();
      let info={}; try{ info=JSON.parse(b.dataset.ninfo||"{}"); }catch(_){}
      toggleNope(b.dataset.nope, info);
    });
}
window.addEventListener("scroll",()=>{
  el("#totop").classList.toggle("show", window.scrollY>600);
});
el("#totop").onclick=()=>window.scrollTo({top:0,behavior:"smooth"});
document.addEventListener("keydown",(e)=>{
  if(e.key==="/" && document.activeElement!==el("#q")){ e.preventDefault(); el("#q").focus(); }
  if(e.key==="Escape"){ el("#q").value=""; q=""; shown=PAGE; render(); el("#q").blur(); }
});

render();

  b.id="syncnote";
  b.textContent="👍 他の端末で押した "+mergedCount+" 件を取り込みました";
  document.body.appendChild(b);
  setTimeout(()=>{ b.style.opacity="0"; setTimeout(()=>b.remove(), 600); }, 5000);
