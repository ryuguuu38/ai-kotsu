"掲載実績・議事録・調査・社史などを構造化して1か所に集める。効率化より先にアーカイブを作る。", "why": "**「完成したものだけでなく、試行錯誤の過程も残る」**ことで、組織の意思決定が透明になる。広報チームの実例だが、提案や研修の資産づくりにそのまま応用できる。", "steps": ["まず集める：掲載実績・プレスリリース・議事録・文字起こし・調査結果", "保存形式はマークダウンやCSV（あとで検索・加工できる形）", "日本語で頼むだけでファイル整理・更新までやらせる", "整ってから、分析・半自動化に進む（順番を逆にしない）", "目標は「必要なときに出し入れできる状態」"], "prompt": null, "tags": ["社内資料", "自動化", "リサーチ"], "level": "中級", "source": {"title": "発信より先に、記録する。Claude Code×GitHubで広報の仕事を博物館みたいに整えてみた話（note・2026-08-12）", "url": "https://note.com/kurashi_com/n/n83c86699c659"}, "added": "2026-09-23", "verified": "出典あり", "axes": {"kind": "考え方", "effect": "発想が広がる", "effort": "仕組みを作る", "depth": "考え方だけ", "scene": "調べもの"}}, {"id": "other-032", "ai": "その他", "origin": "note", "use": "自分用", "title": "過去1年分の自分の文書を読ませて「自分の文体」を覚えさせる", "summary": "月次報告書が3〜4時間→1時間未満、PDCAシートが2〜3時間→30分。月5時間以上の削減。", "why": "**毎月書くものは、過去の自分が最高の教材。**新しいプロンプトを考えるより、過去1年分を読ませるほうが早い。今月の情報は箇条書きで渡すだけでよくなる。", "steps": ["過去1年分の報告書・会議資料を1か所に集める", "NotebookLMなどに読み込ませ、自分の文体を学習させる", "毎月は「当月の情報を箇条書き」で渡すだけにする", "指示は「毎月の私の文体に合わせて作成して」の一言", "※定例で書くもの（月報・週報・議事録・PDCA）ほど効果が大きい"], "prompt": "添付は過去1年分の私が書いた{月次報告書}です。\n私の文体・構成の癖・よく使う言い回しを学習してください。\n\nそのうえで、今月の情報（下記の箇条書き）から、\n**いつもの私の文体で**同じ形式の報告書を作ってください。\n\n【今月の情報】\n- \n- ", "tags": ["資料作成", "時短", "社内資料"], "level": "初級", "source": {"title": "AIに「過去の自分」を学習させたら、報告書作成は「全自動洗濯機」になり、プレゼン評価は3ヶ月で1位になった話（note・2026-09-01）", "url": "https://note.com/kitanoshinji/n/n7f00e25d10a5"}, "added": "2026-09-23", "verified": "出典あり", "axes": {"kind": "設定・仕組み", "effect": "時間が減る", "effort": "少し準備", "depth": "手順つき", "scene": "メール"}}, {"id": "other-033", "ai": "その他", "origin": "note", "use": "自分用", "title": "会議の録音をAIに採点させて話し方を直す", "summary": "声のトーン・間・聞きやすさ・構成で採点させ、指摘を潰していく。3ヶ月で社内評価1位になった実例。", "why": "**自分の話し方は自分では分からない。**採点基準を可視化すると、直すべき点が具体的になる。研修講師をするあなたには特に効く。", "steps": ["会議や登壇の音声を録音する", "AIに『声のトーン・間・聞きやすさ・構成』で採点させる", "具体的な改善点を出させる（例：「えー」「まあ」を言わない／話の頭にタイトルを付ける）", "次回で1つずつ潰す", "繰り返すと評価が変わる"], "prompt": "この会議（または登壇）の録音を聞いて、次の4項目で100点満点の採点をしてください。\n\n1. 声のトーン\n2. 間（ま）の取り方\n3. 聞きやすさ（口癖・言い淀み）\n4. 構成（話の順序・分かりやすさ）\n\n各項目について、**具体的にどこが悪かったか**を時間つきで指摘し、\n次回に直すべきことを**3つだけ**に絞ってください。", "tags": ["会議", "品質アップ", "社内資料"], "level": "初級", "source": {"title": "AIに「過去の自分」を学習させたら（note・2026-09-01）", "url": "https://note.com/kitanoshinji/n/n7f00e25d10a5"}, "added": "2026-09-23", "verified": "出典あり", "axes": {"kind": "頼み方", "effect": "質が上がる", "effort": "すぐ試せる", "depth": "手順つき", "scene": "研修・登壇"}}, {"id": "claude-038", "ai": "Claude", "origin": "note", "use": "自分用", "title": "「質問する」以外の4つの使い方を、この順で覚える", "summary": "Web検索 → コネクタ → プロジェクト → Cowork。段階を追うと「聞く道具」から「働く相棒」になる。", "why": "**大事なのは『いい回答』を求めることでなく、AIが仕事できる環境を整えること。**背景情報が充実するほど、結果の再現性が上がる。", "steps": ["① Web検索：最新情報や事実確認（学習済みデータで足りない場面）", "② コネクタ：ドライブやSlackとつなぐ。**探してコピペする作業が消える**", "③ プロジェクト：テーマごとの作業場。プロフィール・読者像・過去資料・ルールを置く", "④ Cowork：ゴールを渡すと複数ステップを自動処理し、確認できる成果物を出す", "この順で進めると、毎回の長い説明が要らなくなる"], "prompt": null, "tags": ["設定", "時短", "全AI共通"], "level": "初級", "source": {"title": "Claudeの使い方は「質問する」だけじゃない。初心者が覚えるべきWeb検索・コネクタ・プロジェクト・Cowork（note・2026-09-14）", "url": "https://note.com/ak_hikiyose/n/n36ad0ba421a7"}, "added": "2026-09-23", "verified": "出典あり", "axes": {"kind": "考え方", "effect": "発想が広がる", "effort": "すぐ試せる", "depth": "考え方だけ", "scene": "全般"}}, {"id": "other-034", "ai": "その他", "origin": "その他", "use": "両方", "title": "作る前に「決めるべき論点」を洗い出させる（決めるのは人）", "summary": "AIに仕様を決めさせない。まだ決まっていないことを質問の形で出させ、選ぶのは自分。", "why": "途中で作り直す回数が減る。提案書・研修カリキュラム・ツール導入、どれでも同じことが起きる。", "steps": ["作ろうとしているものを説明し、**まだ作らないでと明示する**", "決める必要があることを質問形式で洗い出させる", "出てきた論点を「今決めること」と「後回しでよいこと」に分類させる", "★AIに決めさせず、論点だけ出させて人が選ぶ"], "prompt": "これから{作るもの}を進めます。**まだ作り始めないでください。**\n\n着手前に決めておくべきことを、質問の形で洗い出してください。\n特に次の観点を必ず含めてください：\n- 対象は誰か／例外になるのは誰か\n- どこまでやるか（範囲の境界）\n- 期限と優先順位\n- やらないことは何か\n\n最後に「今決めるべきこと」と「後回しにできること」に分類してください。\n決めるのは私です。あなたは論点を出すだけにしてください。", "tags": ["資料作成", "営業", "品質アップ"], "level": "初級", "source": {"title": "AIコーディング実践活用46選（Xで配布されていた購入特典教材・全60ページ）", "url": null}, "added": "2026-09-23", "verified": "出典あり（教材の考え方を要約。プロンプトは転載せず書き直し。配布元URLは未取得）", "axes": {"kind": "頼み方", "effect": "事故を防ぐ", "effort": "すぐ試せる", "depth": "手順つき", "scene": "提案書"}}, {"id": "other-035", "ai": "その他", "origin": "その他", "use": "両方", "title": "「〜と〜と〜をする」になっていたら、そのタスクは大きすぎる", "summary": "大きな仕事を、1つずつ確認できる単位に割る。目的が2つ以上入っていたら割り直す。", "why": "**失敗しても戻れる大きさにするのが目的。**研修で「タスク分解」を教えるときの判定基準としてそのまま使える。", "steps": ["タスクを書き出し、「〜と〜をする」になっていないか確認する", "なっていたら、目的1つずつに割る", "各タスクに「目的・対象・完了条件」を書く", "前のタスクとの関係（順番）を明示する"], "prompt": "この仕事を、1つずつ確認できる小さな単位に分けてください。\n\n各タスクについて次を書いてください：\n- 目的（1つだけ）\n- 対象（何を触るか）\n- 完了条件（どうなったら終わりか）\n- 前のタスクとの関係\n\n「〜と〜をする」という書き方になったタスクは、大きすぎるので割り直してください。", "tags": ["資料作成", "社内資料"], "level": "初級", "source": {"title": "AIコーディング実践活用46選（Xで配布されていた購入特典教材・全60ページ）", "url": null}, "added": "2026-09-23", "verified": "出典あり（教材の考え方を要約。プロンプトは転載せず書き直し。配布元URLは未取得）", "axes": {"kind": "考え方", "effect": "事故を防ぐ", "effort": "すぐ試せる", "depth": "考え方だけ", "scene": "全般"}}, {"id": "other-036", "ai": "その他", "origin": "その他", "use": "両方", "title": "選択肢を比べるときは、比較基準を先に決める", "summary": "候補を挙げさせる前に「何で比べるか」を指定する。表にして、最後に推奨と理由を言わせる。", "why": "**ツール選定・外注先選び・研修プランの比較**に使える。基準を後出しにすると、都合のいい比較表になる。", "steps": ["先に比較基準を決める（難易度・運用負担・費用・相性・将来性 など）", "候補は2〜3案に絞らせる", "表で比較させる", "最後に「この状況ならどれを選ぶか」を理由つきで言わせる", "★断定できない前提条件は明記させる"], "prompt": "{選ぶもの}について、実現方法を2〜3案比較してください。\n\n比較基準：\n- 導入の手間\n- 運用の負担\n- 費用\n- いまの体制との相性\n- 将来の拡張性\n\n表で比較し、最後に「この状況ならどれを選ぶか」を理由つきで提案してください。\n**断定できない前提条件があれば必ず明記**してください。", "tags": ["営業", "資料作成", "リサーチ"], "level": "中級", "source": {"title": "AIコーディング実践活用46選（Xで配布されていた購入特典教材・全60ページ）", "url": null}, "added": "2026-09-23", "verified": "出典あり（教材の考え方を要約。プロンプトは転載せず書き直し。配布元URLは未取得）", "axes": {"kind": "頼み方", "effect": "質が上がる", "effort": "すぐ試せる", "depth": "手順つき", "scene": "提案書"}}, {"id": "other-037", "ai": "その他", "origin": "その他", "use": "両方", "title": "AIは「同意する人」でなく「反対意見も出すレビュー役」にする", "summary": "「この案どう？」だけでなく「反対意見も出して」と頼む。思い込みに気づける。", "why": "一人で考えていると、賛成してくれる相手が欲しくなる。そこで同意されると、穴に気づけないまま進んでしまう。", "steps": ["相談するときは、最初から「反対意見も出して」と添える", "賛成意見は求めない", "出てきた反論のうち、納得したものだけ採用する"], "prompt": null, "tags": ["品質アップ", "営業"], "level": "初級", "source": {"title": "AIコーディング実践活用46選（Xで配布されていた購入特典教材・全60ページ）", "url": null}, "added": "2026-09-23", "verified": "出典あり（教材の考え方を要約。プロンプトは転載せず書き直し。配布元URLは未取得）", "axes": {"kind": "頼み方", "effect": "質が上がる", "effort": "すぐ試せる", "depth": "手順つき", "scene": "全般"}}, {"id": "other-038", "ai": "その他", "origin": "その他", "use": "両方", "title": "AIは「比較材料づくり」が得意。優先順位を決めるのは人", "summary": "調査・ひな形・比較表は任せ、人は「何を作るべきか」「どれを選ぶか」に時間を使う。", "why": "**重要な判断そのものを丸投げしないことがポイント。**事業やお客様の事情を知っているのは人間だけ。", "steps": ["調査・たたき台・比較表はAIに任せる", "「何を作るべきか」「どれを選ぶか」は人が決める", "AIの出力は判断材料であって、結論ではないと扱う"], "prompt": null, "tags": ["営業", "社内資料"], "level": "初級", "source": {"title": "AIコーディング実践活用46選（Xで配布されていた購入特典教材・全60ページ）", "url": null}, "added": "2026-09-23", "verified": "出典あり（教材の考え方を要約。プロンプトは転載せず書き直し。配布元URLは未取得）", "axes": {"kind": "考え方", "effect": "質が上がる", "effort": "すぐ試せる", "depth": "考え方だけ", "scene": "全般"}}, {"id": "other-039", "ai": "その他", "origin": "その他", "use": "両方", "title": "変更は「何が効いたか分かる単位」で試す", "summary": "AIで手が速くなるほど、一度に変えすぎる。元に戻しやすい小さな案から試す。", "why": "**速くなることの副作用。**まとめて変えると、良くなっても悪くなっても原因が分からず、学びが残らない。", "steps": ["改善案は複数出させる", "元に戻しやすいものから試す", "一度に1つだけ変える", "何が効いたかを記録する"], "prompt": null, "tags": ["品質アップ", "つまずき対策"], "level": "初級", "source": {"title": "AIコーディング実践活用46選（Xで配布されていた購入特典教材・全60ページ）", "url": null}, "added": "2026-09-23", "verified": "出典あり（教材の考え方を要約。プロンプトは転載せず書き直し。配布元URLは未取得）", "axes": {"kind": "考え方", "effect": "事故を防ぐ", "effort": "すぐ試せる", "depth": "考え方だけ", "scene": "全般"}}, {"id": "other-040", "ai": "その他", "origin": "その他", "use": "自分用", "title": "エラーが出たら、全文とあわせて「直前に何をしたか」を伝える", "summary": "英語の長いエラーも、意味・原因候補・確認場所に分けて説明させられる。省略しないのがコツ。", "why": "**非エンジニアが一番詰まる場面。**エラーを省略して貼ると精度が落ちる。直前の操作を添えると一気に当たる。", "steps": ["エラー文は省略せず全部貼る", "**直前に何をしたか**を必ず添える", "「意味・原因の候補・どこを見ればいいか」に分けて説明させる", "※ログを貼る前に、個人情報や社外秘が混ざっていないか確認する"], "prompt": "次のエラーが出ました。\n\n【直前にやったこと】\n{何をしたか}\n\n【エラー全文】\n{省略せず全部貼る}\n\nこれを次の3つに分けて、専門用語を使わずに説明してください。\n1. どういう意味か\n2. 原因として考えられること（可能性の高い順に3つ）\n3. まずどこを見ればいいか", "tags": ["つまずき対策", "時短"], "level": "初級", "source": {"title": "AIコーディング実践活用46選（Xで配布されていた購入特典教材・全60ページ）", "url": null}, "added": "2026-09-23", "verified": "出典あり（教材の考え方を要約。プロンプトは転載せず書き直し。配布元URLは未取得）", "axes": {"kind": "失敗回避", "effect": "事故を防ぐ", "effort": "すぐ試せる", "depth": "手順つき", "scene": "環境づくり"}}, {"id": "other-041", "ai": "その他", "origin": "その他", "use": "両方", "title": "完全自動化の前に「1回だけ実行する形」で安定させる", "summary": "毎回やっている同じ作業は自動化できる。ただし最初から全自動にしない。", "why": "**いきなり全自動にすると、問題が起きたときどこが悪いか分からない。**まず手動で1回走らせる形にして、安定してから自動にする。", "steps": ["毎回やっている同じ作業を1つ選ぶ", "まず「手で1回実行する」形にする", "何回か使って安定を確認する", "そのあとで自動実行にする"], "prompt": null, "tags": ["自動化", "時短"], "level": "中級", "source": {"title": "AIコーディング実践活用46選（Xで配布されていた購入特典教材・全60ページ）", "url": null}, "added": "2026-09-23", "verified": "出典あり（教材の考え方を要約。プロンプトは転載せず書き直し。配布元URLは未取得）", "axes": {"kind": "考え方", "effect": "事故を防ぐ", "effort": "少し準備", "depth": "考え方だけ", "scene": "環境づくり"}}, {"id": "other-042", "ai": "その他", "title": "画像は「主役・背景・光・構図」を分けて書く。おしゃれと書いても伝わらない", "summary": "「おしゃれな画像」ではAIが平均的な形で埋めてしまう。主役／背景／光／構図の4つを別々に指定すると、狙った絵に近づく。", "why": "AIは条件が少ないほど「よくある形」で埋める。逆に言えば、条件を足した数だけ結果の範囲が絞られる。うまくいかないときは呪文を増やすのではなく、足りていない条件を1つ具体的にするのが正解。", "steps": ["主役：何が写るか（商品名・素材・大きさ）", "背景：どこに置くか（机・屋外・無地）", "光：どの向きからどんな光か（斜め上から柔らかい自然光 など）", "構図：どこから見るか＋どこを空けるか（真上から／上1/3は文字を入れるので空ける）", "崩れたら、足りない条件を1つだけ足して作り直す"], "prompt": "次の条件で画像を作ってください。\n\n主役：{何が写るか・素材・大きさ}\n背景：{どこに置くか}\n光：{向きと硬さ。例：斜め上から柔らかい自然光}\n構図：{どこから見るか}\n余白：{上1/3は告知文を入れるので空ける}\n\n※指定していない要素は自然に補ってかまいません。", "tags": ["資料作成", "品質アップ"], "level": "初級", "source": {"title": "AIのしくみ研究所｜AI活用の実践ガイド（note・2026-09-17）", "url": "https://note.com/aishikumi/n/n51365c4e14e9"}, "added": "2026-09-23", "verified": "出典あり（無料公開の全文を読んで要約）", "origin": "note", "use": "両方", "axes": {"kind": "頼み方", "effect": "質が上がる", "effort": "すぐ試せる", "depth": "手順つき", "scene": "画像・動画"}}, {"id": "other-043", "ai": "その他", "title": "画像を直すときは「変えるところ」と「残すところ」を両方書く", "summary": "背景だけ変えたいのに全部変わってしまうのは、残してほしい部分を書いていないから。両方書くと事故が減る。", "why": "「背景を変えて」だけだと、AIは画像全体を作り直してよいと解釈する。残す側を明示することが、実質的な制約になる。", "steps": ["元の画像を添付する（文章だけで説明し直さない）", "「変えるところ」を書く（例：背景を白い机に）", "「残すところ」を書く（例：商品の形・色・ロゴの位置はそのまま）", "出てきたら、残すと書いた部分が本当に変わっていないか見る"], "prompt": "添付した画像を編集してください。\n\n変えるところ：{例：背景を白い机の上に}\n残すところ：{例：商品の形・色・ラベルの文字とロゴの位置はそのまま}\n\n残すところが変わってしまった場合は、変えずにやり直してください。", "tags": ["資料作成", "つまずき対策"], "level": "初級", "source": {"title": "AIのしくみ研究所｜AI活用の実践ガイド（note・2026-09-17）", "url": "https://note.com/aishikumi/n/n51365c4e14e9"}, "added": "2026-09-23", "verified": "出典あり（無料公開の全文を読んで要約）", "origin": "note", "use": "両方", "axes": {"kind": "頼み方", "effect": "事故を防ぐ", "effort": "すぐ試せる", "depth": "手順つき", "scene": "画像・動画"}}, {"id": "claude-039", "ai": "Claude", "title": "表を作らせるときは「作ったあとの使い方」まで書く", "summary": "「表を作って」だけだと数字が直接打ち込まれる。「料金を変えたら合計も変わるように」と書くと、計算式で組んでくれる。", "why": "AIは見た目が合っていれば完成と判断する。あとで数字を差し替える前提は、言わないと伝わらない。ここを書くかどうかで、使い捨ての表か、使い続けられる表かが決まる。", "steps": ["何の表かを書く（項目・行数・単位）", "「計算式で組む」と明記する（合計・小計・税）", "「◯◯を変えたら△△も自動で変わるように」と、あとの使い方を書く", "できたら自分で確かめる：数字を1つ変えて、合計が追随するか"], "prompt": "{何の表か}を作ってください。\n\n項目：{列名を並べる}\n条件：\n- 合計・小計は直接入力せず、計算式で組む\n- {単価}を変えたら{合計}も自動で変わるようにする\n- 数字の単位と桁区切りを揃える\n\n作り終えたら、{単価}を1つ変えて合計が正しく変わるか自分で確認し、その結果も報告してください。", "tags": ["Excel", "時短"], "level": "初級", "source": {"title": "AIのしくみ研究所｜AI活用の実践ガイド（note・2026-09-17）", "url": "https://note.com/aishikumi/n/n51365c4e14e9"}, "added": "2026-09-23", "verified": "出典あり（無料公開の全文を読んで要約）", "origin": "note", "use": "両方", "axes": {"kind": "頼み方", "effect": "質が上がる", "effort": "すぐ試せる", "depth": "手順つき", "scene": "表・データ"}}, {"id": "claude-040", "ai": "Claude", "title": "小さな道具を作らせるときは「3機能だけ」に絞って1つずつ確かめる", "summary": "最初から全部入りを頼むと、動かない場所が特定できなくなる。書く・見返す・直すの3つに絞り、1つずつ確認してから足す。", "why": "機能をまとめて頼むほど、どこが壊れているか分からなくなる。1つずつ確かめれば、直す場所が常に1か所で済む。", "steps": ["機能を3つだけ挙げる（例：書く／見返す／直す）", "1つのファイル（index.html）にまとめてもらう", "保存先を必ず指定する（指定しないと、画面を開き直すと消える）", "1つ動いたら次を足す。まとめて頼まない", "大事な記録は、書き出して手元に残せるようにしておく"], "prompt": "{何をする道具か}を作ってください。\n\n機能は次の3つだけにしてください：\n1. {書く}\n2. {見返す}\n3. {直す}\n\n条件：\n- HTML・CSS・JavaScript を index.html 1つにまとめる\n- 入力した内容は、画面を開き直しても残るようにする（保存先を明記すること）\n- 外部への通信・ログイン・課金は無し\n- 空欄のまま保存できない／消す前に確認を出す\n- 記録をファイルに書き出して手元に残せるようにする\n\nまず1の機能だけ作って、動くのを確認してから次に進んでください。", "tags": ["自動化", "つまずき対策"], "level": "中級", "source": {"title": "AIのしくみ研究所｜AI活用の実践ガイド（note・2026-09-17）", "url": "https://note.com/aishikumi/n/n51365c4e14e9"}, "added": "2026-09-23", "verified": "出典あり（無料公開の全文を読んで要約）", "origin": "note", "use": "自分用", "axes": {"kind": "考え方", "effect": "事故を防ぐ", "effort": "少し準備", "depth": "手順つき", "scene": "環境づくり"}}, {"id": "claude-041", "ai": "Claude", "title": "CLAUDE.mdは自己紹介ではなく「毎回言わなくて済む契約書」", "summary": "「私は誰か」を書く場所と思われがちだが、本当の使いどころは「Claudeの振る舞いを変える宣言」。毎回言い直している注意は、1回書けば二度と言わなくてよくなる。", "why": "会話のたびに「ここは触らないで」「勝手に送らないで」と言い直しているなら、それは毎回コストを払っている状態。1回書けばそのフォルダの中ではずっと効く。", "steps": ["直近1週間で、Claudeに2回以上言い直した注意を思い出す", "それを「してほしくないこと」の形で1行にする", "CLAUDE.mdに足す。長文の説明はいらない", "次にまた言い直しそうになったら、それも1行足す"], "prompt": "（CLAUDE.md に貼る例）\n- 返事は「いい質問ですね」などの前置きなしで、答えから始める\n- 大きく書き換える前に必ず止まり、何をどう変えるかを説明して確認を取る\n- 頼んだ箇所だけ直す。頼んでいない箇所は、良くなると思っても触らない\n- 作業の最後に「変えた箇所／触っていない箇所／確認してほしい箇所」を短くまとめる", "tags": ["MDファイル", "設定"], "level": "初級", "source": {"title": "【完全版】Claude Codeの性能を10倍引き上げるCLAUDE.mdの作り方｜東大ClaudeCode研究所（X・2026-05-13）", "url": "https://x.com/ClaudeCode_UT/article/2054691480728674326"}, "added": "2026-09-23", "verified": "出典あり（Xの記事本文を読んで要約）／※2026年5月の記事（約4ヶ月前）。記事中の「正答率65%→94%」「性能10倍」は記事の主張で、こちらでは裏取りしていません", "origin": "X", "use": "自分用", "axes": {"kind": "考え方", "effect": "時間が減る", "effort": "すぐ試せる", "depth": "手順つき", "scene": "環境づくり"}}, {"id": "claude-042", "ai": "Claude", "title": "CLAUDE.mdは長いほど悪い。700行まで膨らむと逆に言うことを聞かなくなる", "summary": "良かれと思って書き足すと、Claudeが「指示を守ること」に気を取られて目の前の作業への集中が落ちる。書く量を増やすのではなく、選ぶ方に頭を使う。", "why": "記事の筆者は、自分で書いたわけでもないのにCLAUDE.mdが700行まで膨らんでいた。Claudeが作業中に勝手に足していった結果。増えるほど効きが悪くなるので、定期的に減らす必要がある。", "steps": ["CLAUDE.mdの行数を数える（100行を大きく超えていたら要注意）", "★目安は50行前後。最悪でも200行以内（記事の筆者の実践値）。超えたら詳細を別ファイルへ", "「この行を消しても、たぶん困らない」ものに印を付ける", "特定の作業でしか効かないルールは、そのフォルダ専用のCLAUDE.mdに移す", "全部の作業に効くものだけを、共通のCLAUDE.mdに残す"], "prompt": "CLAUDE.md を見直したいです。次の観点で棚卸しして、表にしてください。\n\n1. 同じことが2か所に違う書き方で書かれていないか\n2. この行を消してもミスが増えないと思われるもの\n3. 全業務に効くものと、特定の作業でしか効かないものの仕分け\n\n※提案だけしてください。私が選ぶまで、実際には書き換えないでください。", "tags": ["MDファイル", "設定", "つまずき対策"], "level": "中級", "source": {"title": "【完全版】Claude Codeの性能を10倍引き上げるCLAUDE.mdの作り方｜東大ClaudeCode研究所（X・2026-05-13）", "url": "https://x.com/ClaudeCode_UT/article/2054691480728674326"}, "added": "2026-09-23", "verified": "出典あり（Xの記事本文を読んで要約）／※2026年5月の記事（約4ヶ月前）。記事中の「正答率65%→94%」「性能10倍」は記事の主張で、こちらでは裏取りしていません／参考：行数の目安（50行前後・最悪200行）は 「プロが実践するClaude Code節約術」（東大ClaudeCode研究所・2026-05-30） https://x.com/ClaudeCode_UT/article/2060592264154419711 から", "origin": "X", "use": "自分用", "axes": {"kind": "考え方", "effect": "質が上がる", "effort": "少し準備", "depth": "手順つき", "scene": "環境づくり"}}, {"id": "claude-043", "ai": "Claude", "title": "同じ失敗を3ヶ月後に繰り返さないための ERRORS.md", "summary": "2回試してもうまくいかなかったやり方を、失敗ログのファイルに書かせておく。次に同じ場面が来たとき、Claudeが自分でそれを読んで避ける。", "why": "Claudeは毎回ゼロから始まるので、前に踏んだ地雷を覚えていない。だが「ファイルに書け・毎回読め」と決めておけば、記憶の代わりになる。", "steps": ["ERRORS.md というファイルを1つ決める", "CLAUDE.mdに「2回試して駄目だったら、何が駄目で何が効いたかをERRORS.mdに書く」と足す", "あわせて「作業を始める前にERRORS.mdを読む」も足す", "たまったら読み返して、恒久ルールに昇格させるものを選ぶ"], "prompt": "（CLAUDE.md に貼る例）\n- ERRORS.md を保守すること。あるやり方が2回試してもうまくいかなかったら、\n  「試したこと」「駄目だった理由」「代わりに効いたこと」「次に思い出すこと」を追記する。\n- 作業を始める前に ERRORS.md を読むこと。", "tags": ["MDファイル", "つまずき対策"], "level": "中級", "source": {"title": "【完全版】Claude Codeの性能を10倍引き上げるCLAUDE.mdの作り方｜東大ClaudeCode研究所（X・2026-05-13）", "url": "https://x.com/ClaudeCode_UT/article/2054691480728674326"}, "added": "2026-09-23", "verified": "出典あり（Xの記事本文を読んで要約）／※2026年5月の記事（約4ヶ月前）。記事中の「正答率65%→94%」「性能10倍」は記事の主張で、こちらでは裏取りしていません", "origin": "X", "use": "自分用", "axes": {"kind": "設定・仕組み", "effect": "事故を防ぐ", "effort": "少し準備", "depth": "手順つき", "scene": "環境づくり"}}, {"id": "claude-044", "ai": "Claude", "title": "迷ったらこの3つだけ書く。1日3つずつ足していけば1週間で揃う", "summary": "21個の宣言を一度に書こうとすると挫折する。記事のおすすめは「前置き禁止・範囲厳守・記憶ファイル」の3つから始めること。", "why": "全部書こうとすると手が止まるうえ、長すぎるCLAUDE.mdは逆効果。一番ストレスを感じているものから3つだけ選ぶほうが、実際に効く。", "steps": ["1つ目：前置きなしで答えから始めさせる", "2つ目：頼んだ範囲しか触らせない", "3つ目：決めたことを記憶ファイルに残させ、毎回読ませる", "明日また3つ、明後日また3つ、と足していく"], "prompt": "（まずこの3つだけ CLAUDE.md に貼る）\n- 前置きや相づちから始めず、答えから書き始めること。\n- 私が指定した箇所だけを変更すること。指定していない箇所は、良くなると思っても変えないこと。\n- 重要な決定をしたら MEMORY.md に「決めたこと・理由・見送った案」を追記し、\n  毎回の作業開始時に MEMORY.md を読んでから動くこと。", "tags": ["MDファイル", "設定"], "level": "初級", "source": {"title": "【完全版】Claude Codeの性能を10倍引き上げるCLAUDE.mdの作り方｜東大ClaudeCode研究所（X・2026-05-13）", "url": "https://x.com/ClaudeCode_UT/article/2054691480728674326"}, "added": "2026-09-23", "verified": "出典あり（Xの記事本文を読んで要約）／※2026年5月の記事（約4ヶ月前）。記事中の「正答率65%→94%」「性能10倍」は記事の主張で、こちらでは裏取りしていません", "origin": "X", "use": "自分用", "axes": {"kind": "設定・仕組み", "effect": "時間が減る", "effort": "すぐ試せる", "depth": "手順つき", "scene": "環境づくり"}}, {"id": "other-044", "ai": "その他", "title": "前に頼んで駄目だった仕事を、もう一度AIに渡してみる", "summary": "「これはAIには無理だった」という判断は、そのとき使ったAI・アプリ・指示の条件込みの判断。半年経てば前提が変わっている。", "why": "一度失敗すると「この仕事は不得意」と記憶に固定されがち。でも固定されているのは能力ではなく、評価した時点の条件のほう。過去に失敗した仕事ほど、比べるための記録が残っているので再評価しやすい。", "steps": ["前に諦めた仕事を1つ思い出す（小さいものから）", "そのとき何を使ったかを書き出す：どのAI／どのアプリ／どんな指示", "変える条件を1つだけ決めて、もう一度頼む（全部変えると何が効いたか分からなくなる）", "結果と、残った問題を記録する", "駄目なら、次は別の条件を1つ変える"], "prompt": "以前この作業をお願いしてうまくいきませんでした。もう一度試したいです。\n\nやりたいこと：{作業内容}\n前回うまくいかなかったこと：{どこで詰まったか}\n\nまず、前回と今回で条件が変わっている可能性があるところを挙げてください。\nそのうえで、今回変えるべき点を1つだけ提案してください。一度に全部変えないでください。", "tags": ["つまずき対策", "時短"], "level": "初級", "source": {"title": "過去に諦めた仕事をCodexへもう一度渡す｜東大Codex研究所（X・2026-09-07）", "url": "https://x.com/UT_Codex/article/2096881323344335345"}, "added": "2026-09-23", "verified": "出典あり（Xの記事本文を読んで要約）／※元は海外の開発者1人の体験談を日本語で再構成したもの。記事自身が「試行回数や比較条件はそろっていない」と断っています", "origin": "X", "use": "両方", "axes": {"kind": "考え方", "effect": "発想が広がる", "effort": "すぐ試せる", "depth": "手順つき", "scene": "全般"}}, {"id": "other-045", "ai": "その他", "title": "昔うまくいった「呪文」が、今のAIの足を引っ張ることがある", "summary": "前のAIの苦手を補うために足した細かい手順が、賢くなったAIの判断を縛る。外した場合と比べてみないと分からない。", "why": "失敗しやすい操作を細かく書き、形式を固定し、確認手順を増やす。それは当時は正しかったが、AIが自分で進められるようになった部分まで縛ってしまう。記事では、旧モデル向けに作った手順を外したほうが結果が良くなった例が報告されている。", "steps": ["よく使っている長い指示文・定型プロンプトを1つ選ぶ", "それを付けた場合と、外した場合の両方で同じ依頼をする", "比べるのは3つ：完成物／途中で止まった箇所／確認で見つかった問題", "本数ではなく結果で、残すか外すかを決める"], "prompt": "同じ依頼を2通りでやってください。\n\nA：私がいつも使っているこの指示文を付けた場合\n{いつもの指示文}\n\nB：その指示文を外し、目的と参照例だけ渡した場合\n\n両方の結果を並べて、違いを3点（完成物／途中で止まった箇所／問題点）で比べてください。", "tags": ["プロンプト", "品質アップ"], "level": "中級", "source": {"title": "過去に諦めた仕事をCodexへもう一度渡す｜東大Codex研究所（X・2026-09-07）", "url": "https://x.com/UT_Codex/article/2096881323344335345"}, "added": "2026-09-23", "verified": "出典あり（Xの記事本文を読んで要約）／※元は海外の開発者1人の体験談を日本語で再構成したもの。記事自身が「試行回数や比較条件はそろっていない」と断っています", "origin": "X", "use": "両方", "axes": {"kind": "考え方", "effect": "質が上がる", "effort": "少し準備", "depth": "手順つき", "scene": "環境づくり"}}, {"id": "other-046", "ai": "その他", "title": "手順を全部書くより、「完成像」と「良い例」を渡すほうが早い", "summary": "細かいクリック手順を並べなくても、目的と「こういうのが欲しい」という見本があれば、AIが必要な要素を補ってくる。", "why": "依頼前に操作を全部洗い出すのは、そもそも重労働。記事の例では、まとまり切っていないアイデアと会話を渡しただけで、取り消し操作やショートカットなど必要な機能まで補われている。人が握るべきは目的・見本・制約・採否の4つ。", "steps": ["目的を1行で書く（何のために使うのか）", "見本を添える（過去の完成物・気に入っている資料・参考画像）", "ずらしたくない条件だけ固定する（見た目・形式・使ってはいけないもの）", "出てきたものを見て、採用するか直すかを決める"], "prompt": "{作りたいもの}を作ってください。\n\n目的：{何のために使うか}\n見本：{添付／過去の完成物／参考にしたいもの}\n絶対に守ること：{形式・見た目・入れてはいけないもの}\n\n細かい手順は指定しません。目的と見本から必要なものを補って、まず1案出してください。\nそのあと、私が選んだ方向で詰めます。", "tags": ["プロンプト", "資料作成"], "level": "初級", "source": {"title": "過去に諦めた仕事をCodexへもう一度渡す｜東大Codex研究所（X・2026-09-07）", "url": "https://x.com/UT_Codex/article/2096881323344335345"}, "added": "2026-09-23", "verified": "出典あり（Xの記事本文を読んで要約）／※元は海外の開発者1人の体験談を日本語で再構成したもの。記事自身が「試行回数や比較条件はそろっていない」と断っています", "origin": "X", "use": "両方", "axes": {"kind": "頼み方", "effect": "時間が減る", "effort": "すぐ試せる", "depth": "手順つき", "scene": "提案書"}}, {"id": "other-047", "ai": "その他", "title": "頼むときに「どこまで確認して、いつ戻すか」を決めておく", "summary": "AIに任せたまま走らせると、確認が甘いまま完成と言われるか、逆に延々と直し続ける。返してもらう時点を先に指定する。", "why": "「できました」を疑うための仕組み。何を確認すべきかを依頼時に渡しておかないと、AIは自分の基準で確認を打ち切る。逆に上限を決めないと、無制限に試行が走る。", "steps": ["完了時に確認してほしい項目を挙げる（数字が合うか・表示が崩れていないか等）", "直していい範囲を決める（ここまでは自分で直してよい／ここからは聞く）", "戻してもらう時点を選ぶ：①ざっくり形になったら ②1回確認したら ③直し切ってから", "残った問題の報告のしかたを指定する"], "prompt": "{依頼内容}\n\n完了時に、次を自分で確認してから出してください：\n- {確認項目1}\n- {確認項目2}\n\n直してよい範囲：{ここまで}。それを超える変更が必要なら、直さずに報告してください。\n私に戻すタイミング：{1回確認したら／直し切ってから}\n\n最後に「確認した範囲」「確認していない範囲」「残っている問題」を3行で書いてください。", "tags": ["品質アップ", "つまずき対策"], "level": "中級", "source": {"title": "過去に諦めた仕事をCodexへもう一度渡す｜東大Codex研究所（X・2026-09-07）", "url": "https://x.com/UT_Codex/article/2096881323344335345"}, "added": "2026-09-23", "verified": "出典あり（Xの記事本文を読んで要約）／※元は海外の開発者1人の体験談を日本語で再構成したもの。記事自身が「試行回数や比較条件はそろっていない」と断っています", "origin": "X", "use": "両方", "axes": {"kind": "頼み方", "effect": "事故を防ぐ", "effort": "すぐ試せる", "depth": "手順つき", "scene": "全般"}}, {"id": "other-048", "ai": "その他", "title": "資料づくりをAIに丸投げしない。5段階に切ると狙いがぼやけない", "summary": "開発の進め方（要件定義→設計→レビュー→実行→自己レビュー）を資料づくりに当てる。3段階目のレビューだけは人が主役。", "why": "丸投げすると「体裁は整っているのに、何を伝えたいのか分からない資料」が出てくる。骨組みができた時点で一度止めて人が見るだけで、そこから先が全部変わる。", "steps": ["① 目的と読み手を決める。AIには「何を誰に伝える資料か。不明点は聞いて」と言う", "② 本文はまだ書かせない。「章立てと各章の狙いだけ先に」と指示する", "③ ここが山場。骨組みが目的に合っているかを人が見て直す", "④ 固めた骨子どおりに中身を書かせる", "⑤ 「目的の観点で自分で見直して、改善版を出して」と言う"], "prompt": "資料を作りたいです。いきなり本文は書かないでください。\n\n【第1段階】まず、何を誰に伝える資料かを整理したいです。不明点は私に質問してください。\n\n（整理できたら）\n【第2段階】本文はまだ書かず、章立てと「各章で何を言いたいか」だけを先に出してください。\n\n（私が直したら）\n【第4段階】固めた骨子のとおりに、各章の中身を書いてください。\n\n【第5段階】書き終えたら、最初に決めた目的の観点で自分で見直し、改善版を出してください。", "tags": ["資料作成", "品質アップ"], "level": "初級", "source": {"title": "エンジニアでなくても知っておきたい、AIに丸投げしない5段階の資料づくり｜伊志嶺（LLMで業務改善する人）（note・2026-07-09）", "url": "https://note.com/brave_quince241/n/n84fcc51af64d"}, "added": "2026-09-23", "verified": "出典あり（全文無料の記事を読んで要約）／※2026年7月の記事（約2.5ヶ月前）", "origin": "note", "use": "両方", "axes": {"kind": "考え方", "effect": "質が上がる", "effort": "すぐ試せる", "depth": "手順つき", "scene": "提案書"}}, {"id": "claude-045", "ai": "Claude", "title": "作業の種類でモデルを使い分けると、枠の減りが変わる", "summary": "考える場面は賢いモデル、量をこなす場面は軽いモデル。全部を最上位でやると枠がすぐ尽きる。", "why": "要件定義やレビューは回数が少なく、深く考えるほど成果が変わる。一方で実装や下書きはやり取りが多く生成量も多いので、ここを最上位でやると消費が跳ね上がる。", "steps": ["要件を決める・設計する → 賢いモデル（回数が少ないので高くても効く）", "実際に書かせる・直させる → 標準のモデル（回数が多いのでここを軽く）", "大量にこなす・速さ優先 → 一番軽いモデル", "最後のレビュー → 賢いモデル（見落としが品質を決めるので）", "一番高いモデルは常駐させず、迷ったときの「相談相手」として呼ぶ"], "prompt": "（会話の冒頭で）\nこれから{作業内容}をします。まず要件と進め方だけ一緒に固めたいので、\n本文や実装にはまだ入らないでください。\n\n（固まったら、軽いモデルに切り替えて）\n先ほど固めた方針どおりに進めてください。方針から外れる判断が必要になったら、\n自分で決めず、私に聞いてください。", "tags": ["節約", "設定"], "level": "中級", "source": {"title": "Claude Code のモデル使い分け：役割別割り当てでコストと品質を両立する｜伊志嶺（LLMで業務改善する人）（note・2026-07-08）", "url": "https://note.com/brave_quince241/n/nf057e0190777"}, "added": "2026-09-23", "verified": "出典あり（全文無料の記事を読んで要約）／※2026年7月の記事（約2.5ヶ月前）。記事に具体的な単価の数字はなく、相対的な比較のみ", "origin": "note", "use": "自分用", "axes": {"kind": "設定・仕組み", "effect": "枠を節約", "effort": "少し準備", "depth": "手順つき", "scene": "環境づくり"}}, {"id": "other-049", "ai": "その他", "title": "AI検索対策（LLMO）で「やらなくていいこと」がはっきりした", "summary": "去年よく言われた llms.txt の設置と記事の細切れ化は、Google公式が「不要」と明言。やるべきは基本の再確認に戻っている。", "why": "AI経由の流入が無視できない規模になり、対策の必要は出てきた。だが去年出回っていた施策は出所が曖昧なまま作業だけ増やすものだった。公式が否定したことで、少なくとも「やらなくていいこと」が確定した。", "steps": ["llms.txt を置く、記事を細切れにする ＝ やらなくていい（Google公式が不要と明記）", "まず自社サイトへのAI経由の流入が今どれくらいあるかを測る", "そのうえで、基本（検索意図に答える・情報を整理する）に戻る", "新しい施策は「誰がどう検証したのか」を確かめてから手を出す"], "prompt": "自社サイトのAI検索経由の流入を把握したいです。\n\n1. アクセス解析で、AI（ChatGPT・Perplexity・Gemini等）からの参照流入を切り出す方法を教えてください\n2. 直近3ヶ月の推移を見るときに、どの指標を並べればよいか\n3. 数字を見たあと、打ち手を検討する順番\n\n※出所の怪しい施策は挙げないでください。公式が言っていることと、検証記事があるものだけにしてください。", "tags": ["リサーチ", "営業"], "level": "中級", "source": {"title": "そろそろ LLMO に手を出してみようと思ったわけ。見送った去年との違い｜伊志嶺（LLMで業務改善する人）（note・2026-07-24）", "url": "https://note.com/brave_quince241/n/n1153c9ba1659"}, "added": "2026-09-23", "verified": "出典あり（全文無料の記事を読んで要約）／※2026年7月の記事（約2ヶ月前）。記事が挙げる数字（AI Overviews表示率 日本72.1%・米国60%、ChatGPT経由 前月比36.7%増、参照流入 1年で3倍超）は記事からの引用で、こちらでは一次資料にあたっていません", "origin": "note", "use": "提案用", "axes": {"kind": "考え方", "effect": "事故を防ぐ", "effort": "少し準備", "depth": "考え方だけ", "scene": "調べもの"}}, {"id": "other-050", "ai": "その他", "title": "提案に使える実例：中国の銀行がAIに「5.5万人年」分の仕事をさせている", "summary": "中国工商銀行(ICBC)の2025年実績。派手な話に見えるが、中身は「高頻度・ルールが決まっている・複数システムをまたぐ」業務を一つずつ積み上げた結果。", "why": "AI導入の提案で「どこから手を付けるか」を説明するときに使える。規模の話ではなく、対象を見極める3条件の話として出すと刺さる。", "steps": ["相手の業務のうち「毎日たくさん発生する」ものを挙げる", "そのうち「やり方がだいたい決まっている」ものに絞る", "さらに「複数のシステムを行き来している」ものに絞る", "この3つが重なる領域が、最初の着手先", "規模でなく「見極めと順序づけ」が成果を決めると説明する"], "prompt": "（提案の下準備に）\n次の業務一覧から、AI導入の最初の着手先を選びたいです。\n\n{業務の一覧}\n\n次の3条件で点数を付けて、表にしてください。\n1. 発生頻度が高いか\n2. やり方がルールとして決まっているか\n3. 複数のシステムをまたいでいるか\n\n3つとも高いものを上位に並べ、なぜそこが先かを1行で添えてください。", "tags": ["営業", "社内資料"], "level": "中級", "source": {"title": "中国デジタル従業員はここまで来た：ICBCの約5.5万人年が示す業務改善ROIの実像｜伊志嶺（LLMで業務改善する人）（note・2026-05-27）", "url": "https://note.com/brave_quince241/n/n9c6d6f80c63b"}, "added": "2026-09-23", "verified": "出典あり（全文無料の記事を読んで要約）／※2026年5月の記事（約4ヶ月前）。数字は記事が一次資料（工商銀行2025年度報告）を挙げていますが、こちらでは原典にあたっていません。提案に使うなら原典の確認を", "origin": "note", "use": "提案用", "axes": {"kind": "考え方", "effect": "発想が広がる", "effort": "すぐ試せる", "depth": "手順つき", "scene": "提案書"}}, {"id": "claude-046", "ai": "Claude", "title": "Claude Codeはプログラム専用ではない。事務仕事にこそ効く", "summary": "「コードを書く道具」と思って避けている人が多いが、実際に効くのは資料づくり・議事録・調べもの・ファイル整理といった普通の事務仕事のほう。", "why": "ブラウザ版は「1つの会話の中で話す」道具。Claude Codeは「フォルダの中で働く」道具。だから、複数のファイルをまたぐ仕事（フォルダ内のPDFを全部読む、表と資料を行き来する）で差が出る。", "steps": ["文章：文体のルールをCLAUDE.mdに書いておき、下書きから推敲まで同じ場所でやる", "資料：Word・PDF・PowerPoint・Excel・画像から必要な情報だけ抜いて、決まった型にまとめる", "調べもの：複数の資料をまとめて読ませ、横断して比べる", "議事録：文字起こしから、担当と期限つきのやることリストまで作らせる", "整理：ダウンロードフォルダなどを、中身を見て自動で仕分けさせる"], "prompt": "このフォルダの中にある資料を全部読んで、次の形でまとめてください。\n\n- 何のための資料か（1行）\n- 押さえるべき数字（出どころのファイル名つき）\n- 判断が必要な論点（3つまで）\n- 読まなくてよかったもの\n\n※推測で埋めないでください。資料に書かれていないことは「書かれていない」と言ってください。", "tags": ["時短", "資料作成"], "level": "初級", "source": {"title": "Claude Codeはコーディング専用ツールではない -- 実例で見る12の活用法｜伊志嶺（LLMで業務改善する人）（note・2026-02-05）", "url": "https://note.com/brave_quince241/n/n3f57ef80b65a"}, "added": "2026-09-23", "verified": "出典あり（全文無料の記事を読んで要約）／⚠️2026年2月 の記事です。Claude Codeは動きが速いので、画面や機能名は今と違う可能性があります。記事にある効果の数字（30分→30秒 等）は記事の主張で、裏取りしていません", "origin": "note", "use": "両方", "axes": {"kind": "考え方", "effect": "発想が広がる", "effort": "すぐ試せる", "depth": "手順つき", "scene": "全般"}}, {"id": "claude-047", "ai": "Claude", "title": "CLAUDE.mdは薄く保つ。情報は「置き場所」で3つに仕分ける", "summary": "全部CLAUDE.mdに書くと太って効かなくなる。全員に必要か／一部だけかで置き場所を分ける。", "why": "判断基準がはっきりしている：全役割に共通して要る情報だけがCLAUDE.md。特定の役割だけが要る情報は、その役割のほうに置く。両方にまたがるなら、CLAUDE.mdには概要だけ書いて、詳細は向こうに置く。", "steps": ["CLAUDE.mdに書くのは5つだけ：目的／方針／全体の決まりごとの概要／フォルダ構成（2階層まで）／他の資料の置き場所", "特定の作業でしか使わない知識 → その作業の担当（サブエージェント）側へ", "「いつもの手順」そのもの → スキル（SKILL.md）へ", "★同じことを2か所に書かない。1か所に書いて、他からは参照する", "★必要なときに必要な分だけ。関係ない情報はただの雑音になる"], "prompt": "CLAUDE.md を薄くしたいです。今の中身を次の3つに仕分けてください。\n\nA. 全部の作業に共通して必要 → CLAUDE.md に残す\nB. 特定の作業でしか使わない → 別ファイルに出す（どこに出すかも提案して）\nC. 手順そのもの → スキルに切り出す\n\nあわせて、同じことが2か所に書かれている箇所を指摘してください。\n※提案だけしてください。私が選ぶまで書き換えないでください。", "tags": ["MDファイル", "設定", "品質アップ"], "level": "中級", "source": {"title": "Claude Codeのコンテキストエンジニアリング設計｜伊志嶺（LLMで業務改善する人）（note・2026-02-25）", "url": "https://note.com/brave_quince241/n/nac11408dd292"}, "added": "2026-09-23", "verified": "出典あり（全文無料の記事を読んで要約）／⚠️2026年2月 の記事です。Claude Codeは動きが速いので、画面や機能名は今と違う可能性があります", "origin": "note", "use": "自分用", "axes": {"kind": "考え方", "effect": "質が上がる", "effort": "少し準備", "depth": "手順つき", "scene": "環境づくり"}}, {"id": "claude-048", "ai": "Claude", "title": "「いつもの手順」は2種類に分けて登録すると使い回せる", "summary": "手順書を作るとき、「観点（何を見るか）」と「段取り（どう進めるか）」を別のファイルにする。観点は複数の段取りから呼べる。", "why": "混ぜて書くと、似た手順を作るたびに同じ観点を書き写すことになり、直すときに全部直す羽目になる。分けておけば、直すのは1か所で済む。", "steps": ["観点ファイル：「資料をレビューするとき見る項目」「文章を書くとき守ること」など、判断のものさし", "段取りファイル：「提案書を作る流れ」「検品する流れ」など、順番そのもの", "段取りの中から観点を呼ぶ形にする（観点を段取りにコピペしない）", "新しい段取りを作るときは、既にある観点を使い回す"], "prompt": "今ある手順書を2種類に分けたいです。\n\n1. 観点（何を見るか・何を守るか）＝ 複数の場面で使い回せる判断のものさし\n2. 段取り（どういう順番で進めるか）＝ その作業に固有の流れ\n\n今の手順書のどこが1でどこが2かを仕分けて、分けたあとのファイル構成を提案してください。", "tags": ["MDファイル", "自動化"], "level": "上級", "source": {"title": "Claude Code/Codex のスキルは2種類に分けて設計する — ナレッジとオペレーションを分けて使い回す｜伊志嶺（LLMで業務改善する人）（note・2026-05-31）", "url": "https://note.com/brave_quince241/n/n2c2bf3d433c3"}, "added": "2026-09-23", "verified": "出典あり（全文無料の記事を読んで要約）／⚠️2026年5月 の記事です。Claude Codeは動きが速いので、画面や機能名は今と違う可能性があります", "origin": "note", "use": "自分用", "axes": {"kind": "設定・仕組み", "effect": "質が上がる", "effort": "仕組みを作る", "depth": "手順つき", "scene": "環境づくり"}}, {"id": "other-051", "ai": "その他", "title": "担当役は1体ずつ増やす。いきなり5体作ると、使われないまま残る", "summary": "役割分担したAIチームを一度に作ると、どれも呼ばれないまま放置される。1体作って自分の仕事を1つ渡すところから。", "why": "元記事も「2体で足りることも7体欲しいこともある。いきなり5体より、1体から始めて増やすほうが現実的」と認めている。さらに「チャットで1体に指示を出してきた癖」が残るので、任せ方に慣れるのに時間がかかる。", "steps": ["まず1体だけ作る。自分が一番面倒だと思っている作業を1つ渡す", "2週間ほど実際に使う。使わなかったら、その役割は要らなかったということ", "足りないと感じたら、そこで2体目を足す", "★週に一度、役割の説明が「実際にやっていること」と合っているか見直す", "使っていないものは消す（残っていると、毎回の会話に説明文だけが載り続ける）"], "prompt": "（役割の棚卸し用）\n今ある担当役（サブエージェント）の一覧を見せてください。\n\nそれぞれについて、次を表にしてください。\n1. 直近で実際に呼ばれた形跡があるか\n2. 説明文と、実際にやっている（やれる）ことが合っているか\n3. 他の担当役と役割がかぶっていないか\n\n使われていないものは正直に指摘してください。※消すかどうかは私が決めます。", "tags": ["設定", "つまずき対策"], "level": "中級", "source": {"title": "【完全版】エージェントに全部賭けろ！｜Swarm 東大AIエージェントラボ（X・2026-07-25）", "url": "https://x.com/swarm_japan/article/2080920923541295500"}, "added": "2026-09-23", "verified": "出典あり（Xの記事本文を読んで要約）／※2026年7月の記事（約2ヶ月前）。元記事は特定の有料サービス(Raft)の紹介を兼ねています。ここではサービスに依存しない考え方だけを抜き出しました", "origin": "X", "use": "自分用", "axes": {"kind": "考え方", "effect": "事故を防ぐ", "effort": "少し準備", "depth": "手順つき", "scene": "環境づくり"}}, {"id": "other-052", "ai": "その他", "title": "役割の説明が曖昧だと、出てくるものも曖昧になる", "summary": "「文章を書く担当」では毎回ばらつく。長さ・使う言葉・禁止事項まで書くと、毎回同じ水準で返ってくる。", "why": "役割の説明文は、そのまま出力の品質基準になる。誰が読んでも同じように動ける水準まで書けているかが分かれ目。肩書きだけ決めても意味がない。", "steps": ["✗「コンテンツを書く」 → 何も決まっていない", "○「15語以内・つなぎ言葉なし・強い動詞だけ」 → 毎回同じ水準になる", "書くべきは4つ：担当する範囲／守ること／やってはいけないこと／完成の条件", "実際に動かして、ばらつく箇所が見つかったら説明文に足していく"], "prompt": "この担当役の説明文を、出力がばらつかない水準まで具体化してください。\n\n今の説明：{現在の説明文}\n\n次の4点を必ず含めてください。\n1. 担当する範囲（どこからどこまで）\n2. 守ること（分量・形式・トーンを数字や具体語で）\n3. やってはいけないこと\n4. 完成の条件（何が満たされたら終わりか）\n\n※抽象的な形容詞（丁寧に・わかりやすく）は使わず、判定できる形で書いてください。", "tags": ["プロンプト", "品質アップ"], "level": "中級", "source": {"title": "【完全版】エージェントに全部賭けろ！｜Swarm 東大AIエージェントラボ（X・2026-07-25）", "url": "https://x.com/swarm_japan/article/2080920923541295500"}, "added": "2026-09-23", "verified": "出典あり（Xの記事本文を読んで要約）／※2026年7月の記事（約2ヶ月前）。元記事は特定の有料サービス(Raft)の紹介を兼ねています。ここではサービスに依存しない考え方だけを抜き出しました", "origin": "X", "use": "両方", "axes": {"kind": "頼み方", "effect": "質が上がる", "effort": "すぐ試せる", "depth": "手順つき", "scene": "環境づくり"}}, {"id": "gpt-014", "ai": "ChatGPT", "title": "会社のテンプレを1枚渡すだけで、型を崩さず中身だけ差し替わる", "summary": "0から作らせるとAIが自分の趣味でデザインを決めるので会社の様式とずれる。お手本のPPTXを渡すと、型はそのまま中身だけ入れ替えてくれる。", "why": "ずれる原因はAIの性能ではなく、渡したお題が「0から資料を作って」だったこと。デザインをこちらから1つも指定せず、お手本に任せて「何を載せるか」だけ伝えるのが、会社の型を崩さない鍵。", "steps": ["★ChatGPTアプリで「チャット」でなく「ワーク」モードに切り替える（資料を仕上げるのはワーク側）", "会社のテンプレPPTXを添付する（表紙・中扉・本文・グラフページが入ったもの）", "★中身をまとめたテキストも一緒に添付する。型だけ渡すとAIが中身を想像で作ってしまう", "指示ではデザインを一切指定しない。「お手本の型はそのまま、中身は添付に差し替えて」と頼む", "追加注文：画像はその場で描いて／グラフは編集できる形で／お手本のアニメーションは残して"], "prompt": "添付した2つのファイルでスライドを作ってください。\n\n1つ目：お手本のテンプレート（{ファイル名}）\n2つ目：載せる中身（{ファイル名}）\n\nお願い：\n- お手本の型（レイアウト・配色・書体・ロゴ位置・余白）はそのままにしてください\n- 中身だけを、添付の情報に差し替えてください\n- 各ページに合う画像は、その場で作って配置してください\n- 数字のページは、画像ではなく編集できるグラフで作ってください\n- お手本に入っているアニメーションは、そのまま残してください\n\n※デザインは指定しません。お手本に従ってください。", "tags": ["PowerPoint", "資料作成", "時短"], "level": "初級", "source": {"title": "【作成法2選】GPT-6 Astraで自社スライドをテンプレのまま一発生成｜SHIFT AI ニュース（YouTube・2026-09-22）", "url": "https://www.youtube.com/watch?v=L7Ig4XlWjzk"}, "added": "2026-09-23", "verified": "出典あり（★動画の字幕を全文読んで要約。概要欄だけでなく話している中身を確認）／※自動文字起こしのため聞き取り誤りの可能性あり", "origin": "YouTube", "use": "両方", "axes": {"kind": "操作手順", "effect": "時間が減る", "effort": "すぐ試せる", "depth": "手順つき", "scene": "提案書"}}, {"id": "gpt-015", "ai": "ChatGPT", "title": "AIが作った資料は、この4点を必ず自分で確かめる", "summary": "できあがった瞬間に「できた」と思わない。型・画像・グラフ・アニメーションの4つを開いて確認する。", "why": "見た目が整っていても、グラフが画像として貼られていたり、アニメーションが消えていたりする。あとから数字を差し替えられない資料は、その場しのぎにしかならない。", "steps": ["① 型どおりか：表紙のタイトル位置・ロゴ位置・見出しの大きさ・余白がお手本と同じか", "② 画像が入っているか：抜けているページがないか", "③ ★グラフが編集できる状態か：画像として貼られていたらNG。数字を差し替えられるか触って確かめる", "④ アニメーションが残っているか：スライドショーで再生して確認する", "1つでも欠けていたら、その項目だけを指定して直させる"], "prompt": "できあがったスライドを、私が次の4点で確認します。先に自分で確認して、結果を報告してください。\n\n1. お手本の型どおりか（タイトル位置・ロゴ位置・見出しの大きさ・余白）\n2. 全ページに画像が入っているか\n3. グラフが「画像」でなく「編集できるグラフ」になっているか\n4. お手本のアニメーションが残っているか\n\n満たしていない項目があれば、直してから出してください。\n直せなかった項目は、正直に「できませんでした」と書いてください。", "tags": ["PowerPoint", "品質アップ", "つまずき対策"], "level": "初級", "source": {"title": "【作成法2選】GPT-6 Astraで自社スライドをテンプレのまま一発生成｜SHIFT AI ニュース（YouTube・2026-09-22）", "url": "https://www.youtube.com/watch?v=L7Ig4XlWjzk"}, "added": "2026-09-23", "verified": "出典あり（★動画の字幕を全文読んで要約。概要欄だけでなく話している中身を確認）／※自動文字起こしのため聞き取り誤りの可能性あり", "origin": "YouTube", "use": "両方", "axes": {"kind": "失敗回避", "effect": "事故を防ぐ", "effort": "すぐ試せる", "depth": "手順つき", "scene": "提案書"}}, {"id": "gpt-016", "ai": "ChatGPT", "title": "AIに画面を操作させるときは、最後の1クリックだけ自分に残す", "summary": "AIがCanvaなどを自分で開いて操作してくれる（コンピューターユース）。ただし保存・ダウンロードだけは人が押す形にしておく。", "why": "AIがカーソルを動かしてテンプレ選び・文字入力・素材配置・見直しまでやってくれるが、取り消しの利かない操作まで任せると事故になる。指示に「ダウンロードは自分で押します」と書いておけば、そこで止まって待ってくれる。", "steps": ["ChatGPTアプリのプラグイン一覧から「コンピューターユース」をオンにする", "流し込む中身をテキストで用意して添付する", "人が普通にやる作業の順番を、そのまま並べて指示する", "★指示に「ダウンロード（保存）はAIに任せず、私が最後に自分で押します」と明記する", "最後に通しで再生させて、文字のはみ出しや崩れを自分で見直させる"], "prompt": "添付の内容で、{Canva等のアプリ}を操作してスライドを作ってください。\n\n手順：\n1. ビジネス向けのテンプレートを1つ選ぶ\n2. 1ページ目から順に、見出しと本文を入れる（ページに合う分量に調整して）\n3. 空いているところに、内容に合う素材を探して置く\n4. 全体に控えめなフェードのアニメーションを付ける\n5. 最初から最後まで通しで再生して、はみ出しや崩れがないか自分で確認する\n\n※ダウンロード（保存）はしないでください。最後は私が自分で押します。", "tags": ["自動化", "資料作成"], "level": "中級", "source": {"title": "【作成法2選】GPT-6 Astraで自社スライドをテンプレのまま一発生成｜SHIFT AI ニュース（YouTube・2026-09-22）", "url": "https://www.youtube.com/watch?v=L7Ig4XlWjzk"}, "added": "2026-09-23", "verified": "出典あり（★動画の字幕を全文読んで要約。概要欄だけでなく話している中身を確認）／※自動文字起こしのため聞き取り誤りの可能性あり", "origin": "YouTube", "use": "両方", "axes": {"kind": "操作手順", "effect": "事故を防ぐ", "effort": "少し準備", "depth": "手順つき", "scene": "提案書"}}, {"id": "claude-049", "ai": "Claude", "title": "最初は「専用フォルダ」を1つ作って、その中だけで動かす", "summary": "デスクトップ全体を渡すと、触らなくていいファイルまで見られる。専用フォルダを1つ作り、そこだけ開くのが安全。", "why": "Claude Codeは「開いたフォルダの中に入ってくる」道具。渡す範囲がそのまま権限になる。最初に範囲を絞っておけば、慣れるまでの事故を防げる。", "steps": ["「Claude用」のフォルダを1つ作る", "使いたい資料だけをそこにコピーして入れる（元ファイルは動かさない）", "そのフォルダだけを開いて作業する", "★編集や削除のたびに許可を聞いてくる設定は、そのまま残しておく", "慣れてきたら、扱うフォルダを少しずつ広げる"], "prompt": "（最初の1回目に打つ指示の例）\nこのフォルダの中のPDFを全部読んで、それぞれの主張を1つのファイルにまとめてください。\n\n- このフォルダの外にあるファイルは見ないでください\n- 元のファイルは編集も削除もしないでください\n- 新しく作るファイルは、このフォルダの中に置いてください", "tags": ["設定", "つまずき対策"], "level": "初級", "source": {"title": "Re:ゼロから始めるClaude Code入門｜東大ClaudeCode研究所（X・2026-05-10）", "url": "https://x.com/ClaudeCode_UT/article/2053598503541387375"}, "added": "2026-09-23", "verified": "出典あり（Xの記事本文を読んで要約）／※2026年5月の記事（約4.5ヶ月前）。元は海外の研究者の入門記事を日本のビジネス向けに再構成したもの。料金や画面は変わっている可能性があります", "origin": "X", "use": "自分用", "axes": {"kind": "設定・仕組み", "effect": "事故を防ぐ", "effort": "すぐ試せる", "depth": "手順つき", "scene": "環境づくり"}}, {"id": "claude-050", "ai": "Claude", "title": "資料は1本ずつ貼らない。フォルダごと渡す", "summary": "ブラウザのAIに1本ずつ貼り付けていた作業を、「このフォルダを全部読んで」の1行に置き換える。ファイル名がバラバラでも形式が混ざっていても読む。", "why": "ブラウザのAIは「ファイルをAIのところへ運ぶ」形。Claude Codeは「AIがフォルダに入ってくる」形。この差が、扱える量と手間を大きく変える。事前にフォルダを整理する必要もない。", "steps": ["使う資料を1つのフォルダに入れる（PDF・Word・Excel・CSVが混ざっていてよい）", "「このフォルダの◯◯を全部読んで」と1行で頼む", "★出力の形式も指定する（Word・Excel・Markdown など）。そのまま配れる形で受け取れる", "★数字を扱うときは「出典のページ番号も付けて」と足す", "⚠️「最終版(修正後)v3」のような、人が見ても分からないファイル名だけは直しておく"], "prompt": "【資料の横断】\nこのフォルダの資料を全部読んで、{知りたいこと}を表にまとめてください。\n各数字には出典のファイル名とページ番号を付けてください。Excelファイルで保存してください。\n\n【記録のパターン化】\nこのフォルダの{商談記録／問い合わせ}を全部読んで、{断られた理由}を頻度の高い順にパターン化してください。\n各パターンに実際の発言例を2つずつ付けてください。\n\n【ファイル整理】\nこのフォルダのPDFを全部開いて、中身に合わせて [年]_[組織名]_[タイトル].pdf の形に名前を付け直してください。", "tags": ["時短", "リサーチ", "Excel"], "level": "初級", "source": {"title": "Re:ゼロから始めるClaude Code入門｜東大ClaudeCode研究所（X・2026-05-10）", "url": "https://x.com/ClaudeCode_UT/article/2053598503541387375"}, "added": "2026-09-23", "verified": "出典あり（Xの記事本文を読んで要約）／※2026年5月の記事（約4.5ヶ月前）。元は海外の研究者の入門記事を日本のビジネス向けに再構成したもの。料金や画面は変わっている可能性があります", "origin": "X", "use": "両方", "axes": {"kind": "操作手順", "effect": "時間が減る", "effort": "すぐ試せる", "depth": "手順つき", "scene": "調べもの"}}, {"id": "claude-051", "ai": "Claude", "title": "上司の赤入れは、返答案をまとめて作らせてから考える", "summary": "指摘を1つずつ相手にすると消耗するうえ、返答のトーンが揃わない。全部まとめて論点整理させてから、自分は判断だけする。", "why": "1つずつ順に考えると、最初と最後で文体も姿勢もバラバラになる。同じ論点の指摘をまとめて構造化しておけば、返すべきことが半分くらいに減ることも多い。", "steps": ["提案書のドラフトと、もらった指摘を同じフォルダに入れる", "「各指摘への応答案と修正方針をまとめて」と頼む", "★「論点が同じ指摘はまとめて」と足す（数が減る）", "★文体を指定する（例：丁寧だが媚びない）", "出てきた素材を見て、最終的にどう返すかは自分で決める"], "prompt": "このフォルダの提案書ドラフトと、受けた指摘（{n}点）を読み込んでください。\n\n- 各指摘への応答案と、修正方針をまとめてください\n- 論点が同じ指摘は、まとめて構造化してください\n- 応答は「丁寧だが媚びない」文体で\n- 受け入れるべき指摘と、説明して押し返すべき指摘を分けて示してください\n\n※最終的にどう返すかは私が決めます。案を出すところまでで止めてください。", "tags": ["社内資料", "メール"], "level": "初級", "source": {"title": "Re:ゼロから始めるClaude Code入門｜東大ClaudeCode研究所（X・2026-05-10）", "url": "https://x.com/ClaudeCode_UT/article/2053598503541387375"}, "added": "2026-09-23", "verified": "出典あり（Xの記事本文を読んで要約）／※2026年5月の記事（約4.5ヶ月前）。元は海外の研究者の入門記事を日本のビジネス向けに再構成したもの。料金や画面は変わっている可能性があります", "origin": "X", "use": "自分用", "axes": {"kind": "頼み方", "effect": "時間が減る", "effort": "すぐ試せる", "depth": "手順つき", "scene": "提案書"}}, {"id": "claude-052", "ai": "Claude", "title": "手順書は「薄いコア＋別ファイル」に分ける。全部1枚に書かない", "summary": "1つの手順書に全部詰め込むと、毎回それを読み込むぶん本題への集中が落ちる。本体は薄く、細かい仕様は別ファイルに逃がす。", "why": "厚すぎる業務マニュアルを現場の誰も読まないのと同じ構造。必要なときに必要な情報だけ読める形にしておくほうが、精度が上がる。", "steps": ["本体に書くのは4つだけ：何のための手順か／何を受け取るか／何を出すか／大まかな流れ", "細かい出力形式や判定基準は、別ファイルに分けて「参照」として書く", "★最初からたくさん作らない。「これ毎週3回やってる」と気づいてから作る", "早すぎると、必要な指示の形が固まる前にパッケージにしてしまう"], "prompt": "いつもやっている{作業名}を手順書にしたいです。\n\nまず私に質問してください（フォーマット・含めたい項目・出力先など）。\nそのうえで、次の形で作ってください。\n\n- 本体：何のための手順か／何を受け取るか／何を出すか／流れ（各3〜5行）\n- 細かい仕様（出力の形・判定の基準）は、別ファイルに分けて本体からは参照だけする\n- 推測で埋めず、決まっていないことは私に聞いてください", "tags": ["MDファイル", "自動化"], "level": "中級", "source": {"title": "Re:ゼロから始めるClaude Code入門｜東大ClaudeCode研究所（X・2026-05-10）", "url": "https://x.com/ClaudeCode_UT/article/2053598503541387375"}, "added": "2026-09-23", "verified": "出典あり（Xの記事本文を読んで要約）／※2026年5月の記事（約4.5ヶ月前）。元は海外の研究者の入門記事を日本のビジネス向けに再構成したもの。料金や画面は変わっている可能性があります", "origin": "X", "use": "自分用", "axes": {"kind": "設定・仕組み", "effect": "質が上がる", "effort": "仕組みを作る", "depth": "手順つき", "scene": "環境づくり"}}, {"id": "other-053", "ai": "その他", "title": "AIに渡すのは「作業」。自分が握るのは3つだけ", "summary": "繰り返し・整理・要約・分類は渡す。主張／新規性／誰に届けるかの判断は、人が握り続ける。", "why": "研修や提案で「どこまで任せるか」を説明するときにそのまま使える線引き。素材はAIが並べてくれるが、その上にどんな線を引くかは人の仕事。丸投げする人が失敗する、という整理。", "steps": ["渡してよい：大量の資料の横断、決まったルールでの分類、要約、リネーム、転記", "★握るもの①「主張」— 何を言うか、どの立場を取るか", "★握るもの②「新規性」— まだ誰も言っていない切り口を作る", "★握るもの③「誰に届けるか」— 経営層か現場か社外かで、出す形は変わる", "自分のカレンダーで「作業の時間」と「判断の時間」の比率を見比べてみる"], "prompt": "（研修・提案の整理に）\n次の業務一覧を、3つに仕分けてください。\n\n{業務の一覧}\n\n1. AIに渡してよい作業（繰り返し・整理・要約・分類）\n2. 人が最終判断すべきもの（何を主張するか）\n3. 人にしかできないもの（新しい切り口を作る・誰に届けるかを決める）\n\n仕分けの理由を1行ずつ添えてください。判断に迷うものは「迷う」と正直に書いてください。", "tags": ["社内資料", "営業"], "level": "初級", "source": {"title": "Re:ゼロから始めるClaude Code入門｜東大ClaudeCode研究所（X・2026-05-10）", "url": "https://x.com/ClaudeCode_UT/article/2053598503541387375"}, "added": "2026-09-23", "verified": "出典あり（Xの記事本文を読んで要約）／※2026年5月の記事（約4.5ヶ月前）。元は海外の研究者の入門記事を日本のビジネス向けに再構成したもの。料金や画面は変わっている可能性があります", "origin": "X", "use": "提案用", "axes": {"kind": "考え方", "effect": "質が上がる", "effort": "すぐ試せる", "depth": "手順つき", "scene": "研修・登壇"}}, {"id": "claude-053", "ai": "Claude", "title": "枠を長持ちさせる3つのコマンド（区切る・まっさらにする・中身を見る）", "summary": "AIは返事のたびに会話を最初から読み直している。だらだら続けず区切るだけで、枠の減りが変わる。", "why": "消費されるのは「やり取りの回数」ではなく「読み直す文字の量」。会話が伸びるほど1往復が高くつく（記事の試算では30往復目は1往復目のおよそ31倍）。", "steps": ["★作業の区切りで `/compact` … それまでの会話を要約して軽くする。重くなる前にこまめに", "★別の用件に移るときは `/clear` … 会話をまっさらに戻す。前の用件を引きずらない", "★`/context` … いま何が容量を食っているかを一覧で見る。読み込んだファイルが膨らんでいないか確認", "依頼は範囲を絞る。「全体をいい感じに直して」より「この部分をこう直して」", "同じ資料を何度も使う場合は、2回目以降は安く読み直せる仕組みが働く（記事では約1割）"], "prompt": "（会話を区切る前に）\nここまでの作業内容を、次に引き継ぐ形で3行にまとめてください。\n- 何をしたか\n- 決めたこと\n- 次にやること\n\nそのあと、私が /compact で会話を軽くします。", "tags": ["節約", "時短"], "level": "初級", "source": {"title": "【保存版】プロが実践するClaude Code節約術｜東大ClaudeCode研究所（X・2026-05-30）", "url": "https://x.com/ClaudeCode_UT/article/2060592264154419711"}, "added": "2026-09-23", "verified": "出典あり（Xの記事本文を読んで要約）／⚠️2026年5月の記事（約4ヶ月前）。記事にあるモデル名・料金・上限の数字は当時のもので、今は変わっています。ここには変わりにくい「操作と考え方」だけを書きました", "origin": "X", "use": "自分用", "axes": {"kind": "操作手順", "effect": "枠を節約", "effort": "すぐ試せる", "depth": "手順つき", "scene": "環境づくり"}}, {"id": "other-054", "ai": "その他", "title": "人の見方を「何ができるか」から「どんな責任が取れるか」へ", "summary": "AIが使えると、専門外の作業まで形になってしまう。だから「できるか」で人を配置すると中身が担保されない。見るべきは判断の質を保証できる範囲。", "why": "研修や提案で「AIを入れたあと、人の評価をどう変えるか」を聞かれたときに使える整理。一番重要なのは、自分の理解度と限界を客観視できるかどうか（メタ認知）。", "steps": ["★見る順番①：自分がどこまで分かっていて、どこから分かっていないかを言えるか", "見る順番②：AIの出力に対してどんな質問を投げるか／どこで立ち止まって確かめるか", "見る順番③：もともとの専門性の深さ", "配置の原則：**重なりは許す**（相互チェックになる）／**空白は許さない**（判断領域を必ず誰かが持つ）", "判断領域の例：品質／情報の扱い／法的なリスク／お客様への見え方"], "prompt": "（研修・提案の設計に）\nこのプロジェクトで「誰かが必ず判断を持つべき領域」を洗い出してください。\n\n{プロジェクトの概要}\n\n- 判断領域ごとに「もし誰も持っていないと何が起きるか」を1行で\n- 重なってよい領域と、絶対に空白にできない領域を分けて\n- 各領域を任せる人を見極めるとき、何を観察すればよいかも添えて", "tags": ["社内資料", "営業"], "level": "中級", "source": {"title": "AIエージェント時代のチームビルディング — 「できること」から「取れる責任」へ｜伊志嶺（LLMで業務改善する人）（note・2026-04-11）", "url": "https://note.com/brave_quince241/n/n7d094484cf01"}, "added": "2026-09-23", "verified": "出典あり（全文無料の記事を読んで要約）／※2026年4月の記事（約5ヶ月前）。実証データではなく著者の考え方の整理です", "origin": "note", "use": "提案用", "axes": {"kind": "考え方", "effect": "質が上がる", "effort": "少し準備", "depth": "手順つき", "scene": "採用・人事"}}, {"id": "other-055", "ai": "その他", "title": "何でも万能AIに頼まない。専用のAIのほうが桁違いに安く速い場面がある", "summary": "画像や音声を大量に処理するような仕事は、専用のAIのほうが圧倒的に向いている。判断が要る仕事だけを万能AIに回す。", "why": "「AIといえばChatGPT」で全部やろうとすると、コストも時間も跳ね上がる。電卓と同じで、「できること」と「速く確実にできること」は別。", "steps": ["判断や文脈の読み取りが要る仕事（資料作成・調べもの・要約）→ 万能AI", "★同じ処理を大量に繰り返す仕事（画像の判定・音声の書き起こし・仕分け）→ 専用AI", "記事の例：万能AIに1回聞く費用で、専用の画像認識AIは数百〜数千回ぶんこなせる", "提案では「全部AIで」と言わず、どこに何を使うかの絵を描く"], "prompt": "次の業務を、2つに仕分けてください。\n\n{業務の一覧}\n\nA. 判断や文脈の読み取りが必要 → 汎用の生成AI向き\nB. 同じ処理を大量に繰り返す → 専用のAI・既存の仕組み向き\n\n仕分けの理由を1行ずつ。Bに入れたものは、具体的にどんな道具が候補になるかも挙げてください。", "tags": ["営業", "社内資料"], "level": "初級", "source": {"title": "特化型AIはなぜ今も必要なのか。エージェントAI時代の道具の使い分け｜伊志嶺（LLMで業務改善する人）（note・2026-07-22）", "url": "https://note.com/brave_quince241/n/nb98f2fbd35cf"}, "added": "2026-09-23", "verified": "出典あり（全文無料の記事を読んで要約）／※2026年7月の記事（約2ヶ月前）。「数百〜数千回ぶん」は記事の記述で、こちらでは検証していません", "origin": "note", "use": "提案用", "axes": {"kind": "考え方", "effect": "発想が広がる", "effort": "すぐ試せる", "depth": "手順つき", "scene": "提案書"}}, {"id": "other-056", "ai": "その他", "title": "知識を1か所に集めるのをやめる。矛盾は潰さず「割れたまま」残す", "summary": "横断して探すコストが下がると、あらかじめ全部集めておく必要が薄れる。集めるより、各自が外に出しておくほうが続く。", "why": "社内の情報整理で必ず起きるのが「意見が食い違ったときにどちらかを消してしまう」問題。消すと、なぜそうなったかが分からなくなる。割れたまま残して、判断は使うときにする。", "steps": ["各自が自分の知識を文書にして外に出す（1か所に集約させない）", "★食い違う意見は、どちらかを消さずに両方残す。出どころも一緒に", "古くなった情報は消さず、優先度を下げる", "辞めた人の知識も、消さずに参照できる形で残す"], "prompt": "この資料群を整理してください。ただし次を守ってください。\n\n- 内容が食い違う箇所を見つけたら、**どちらかを消さず両方残して**、食い違っていることを明記する\n- それぞれの出どころ（ファイル名・日付）を必ず添える\n- 古い情報も消さず、「古い」と印を付けて残す\n- あなたの判断でどちらが正しいかを決めないでください。判断は私がします。", "tags": ["社内資料", "リサーチ"], "level": "中級", "source": {"title": "組織の知識管理は分散型へ、社員一人ひとりの「レプリカント」が支える近未来｜伊志嶺（LLMで業務改善する人）（note・2026-07-10）", "url": "https://note.com/brave_quince241/n/n2403bdcba0b5"}, "added": "2026-09-23", "verified": "出典あり（全文無料の記事を読んで要約）／※2026年7月の記事（約2ヶ月前）。実証データはなく、著者の将来予測を含む考え方の整理です", "origin": "note", "use": "両方", "axes": {"kind": "考え方", "effect": "事故を防ぐ", "effort": "少し準備", "depth": "手順つき", "scene": "調べもの"}}, {"id": "claude-054", "ai": "Claude", "title": "「長さ」と「前置き禁止」を先に決めるだけで、出てくる量が4〜6割減る", "summary": "何も言わないとAIは必要以上に長く書く。読む時間も待ち時間も枠も、全部余分にかかっている。", "why": "長さを指定するだけで消費が大きく減る（元記事では40〜60%）。さらに「ご質問ありがとうございます」「以上をまとめると」のような、読まなくていい部分も毎回消費している。", "steps": ["質問を書く前に、出力の上限を1行足す（「3行で」「500字以内で」「箇条書き5つで」）", "★前置き・言い換え・末尾の要約を禁止するルールを、設定に1回書いておく", "1回書けばその場所では永続する。毎回言わなくてよくなる"], "prompt": "（設定（CLAUDE.md や プロジェクトの指示）に1回だけ貼る）\n\n応答ルール:\n1. 前置きを入れない（「いい質問ですね」「もちろんです」「ご質問ありがとうございます」等はすべて禁止）\n2. 質問の言い換え（「つまり〜というご質問ですね」）は禁止\n3. 末尾の要約（「以上をまとめると」「ご検討のほどよろしくお願いいたします」）は禁止\n4. 本題から始めて、本題で終わる\n5. 最初の1文で結論を出し、残りで根拠と補足を書く\n\n（毎回の依頼に1行足す）\n出力は{3行／500字以内／箇条書き5つ}に収めてください。", "tags": ["節約", "プロンプト"], "level": "初級", "source": {"title": "【保存版】Claudeの可能性を解放するための完全マニュアル｜東大ClaudeCode研究所（X・2026-05-16）", "url": "https://x.com/ClaudeCode_UT/article/2055760601000153343"}, "added": "2026-09-23", "verified": "出典あり（Xの記事本文を読んで要約）／※2026年5月の記事（約4ヶ月前）。料金や画面の名称は変わっている可能性があります。「40〜60%削減」は元記事の数字で、こちらでは検証していません", "origin": "X", "use": "両方", "axes": {"kind": "頼み方", "effect": "枠を節約", "effort": "すぐ試せる", "depth": "手順つき", "scene": "全般"}}, {"id": "claude-055", "ai": "Claude", "title": "毎月・毎週やる仕事は、プロンプト自体をAIに書かせてストックする", "summary": "良いプロンプトの書き方が分からないときは、AI自身に設計させるのが早い。自分より自分の使い方を知っている。", "why": "定型業務のたびにゼロから頼み方を考えるのが、実は一番のコスト。一度作ってしまえば、空欄を埋めるだけになり、AIを呼ぶ心理的なハードルが下がる。", "steps": ["「毎月やっている仕事」を1つ選ぶ（月次報告・競合チェック・振り返り など）", "AIに「この目標を達成するための、あなたから最高の出力を引き出すプロンプトを設計して」と頼む", "★毎回変わる部分を [角括弧] にしてもらう", "できたものをメモに保存して、次からはコピペで使う", "使ってみてズレたら、その場でプロンプト側を直す"], "prompt": "私が毎{月／週}やっている業務のための、定型プロンプトを設計してください。\n\n業務の目標：{何を達成したいか}\n頻度：{月次／週次／案件ごと}\n求める出力の形：{表／箇条書き／1ページ資料 など}\n\n条件：\n- 私が毎回コピペで使える完成形にしてください\n- 毎回変わる部分は [角括弧] で示してください\n- 抽象的な形容詞ではなく、判定できる条件で書いてください", "tags": ["プロンプト", "時短", "自動化"], "level": "初級", "source": {"title": "【保存版】Claudeの可能性を解放するための完全マニュアル｜東大ClaudeCode研究所（X・2026-05-16）", "url": "https://x.com/ClaudeCode_UT/article/2055760601000153343"}, "added": "2026-09-23", "verified": "出典あり（Xの記事本文を読んで要約）／※2026年5月の記事（約4ヶ月前）。料金や画面の名称は変わっている可能性があります。「40〜60%削減」は元記事の数字で、こちらでは検証していません", "origin": "X", "use": "両方", "axes": {"kind": "頼み方", "effect": "時間が減る", "effort": "少し準備", "depth": "手順つき", "scene": "全般"}}, {"id": "claude-056", "ai": "Claude", "title": "作らせる前に「計画だけ」出させる。違ったら完成を待たずに止める", "summary": "大きな変更の前に、何をどの順で変えるつもりかだけ先に出させる。おかしければその場で止める。完成してから直すより安い。", "why": "生成が進むほど、直すコストは上がる。「完成してから直せばいい」は間違い。計画の段階なら1行の指摘で済むものが、全部できてからだと作り直しになる。", "steps": ["★大きな変更の前は Shift+Tab で「計画モード」に切り替える（実行せず計画だけ出る）", "計画を読んで、違っていたらその場で指摘する", "★走り出してからおかしいと思ったら、Escapeキーで即停止。迷わず止めてよい", "長い作業を任せるときは「まず最初の1つだけ見せて。判断してから続けて」と挟む", "見当違いに10分かけさせるより、最初の1出力で確認するほうが速い"], "prompt": "（長い作業を頼むとき、最初に足す1行）\nこの作業はまとめてやらず、次の順で進めてください。\n\n1. まず「何を、どの順番で変えるつもりか」の計画だけ出してください。実行はしないでください\n2. 私がOKを出したら、最初の1つだけ作って見せてください\n3. それも私が確認したら、残りを続けてください\n\n途中で判断に迷ったら、勝手に決めず私に聞いてください。", "tags": ["つまずき対策", "品質アップ", "節約"], "level": "初級", "source": {"title": "【保存版】Claude Code を『主語を渡すシステム』に変える27個の設定｜Swarm 東大AIエージェントラボ（X・2026-06-30）", "url": "https://x.com/swarm_japan/article/2072044819778806204"}, "added": "2026-09-23", "verified": "出典あり（Xの記事本文を読んで要約）／※2026年6月の記事（約3ヶ月前）。キー操作やコマンド名は変わっている可能性があるので、効かなければ最新の案内を確認してください", "origin": "X", "use": "自分用", "axes": {"kind": "操作手順", "effect": "事故を防ぐ", "effort": "すぐ試せる", "depth": "手順つき", "scene": "環境づくり"}}, {"id": "claude-057", "ai": "Claude", "title": "画面のことは言葉で説明せず、スクリーンショットを渡す", "summary": "「左上に赤い字が出てボタンが押せなくて…」と説明するより、画面を撮って渡すほうが速いし正確。", "why": "見た目の問題を言葉にするのは意外と難しく、伝え間違いも起きる。画像を渡せば、何が起きているか・原因・直し方までそのまま返ってくる。", "steps": ["困っている画面をスクリーンショットで撮る（Macは ⌘+Shift+4）", "そのまま貼り付けて「この画面を見て」と頼む", "直前に何をしたかも1行添える（原因の特定が速くなる）", "資料の見た目の相談にも使える（「この配置、読みにくくない？」）"], "prompt": "添付の画面を見てください。\n\n直前にやったこと：{何をしたか}\n期待していたこと：{どうなってほしかったか}\n実際に起きたこと：{何が起きたか}\n\n原因として考えられるものを、可能性の高い順に3つ挙げてください。\n推測の場合は「推測」と明記してください。", "tags": ["つまずき対策", "時短"], "level": "初級", "source": {"title": "【保存版】Claude Code を『主語を渡すシステム』に変える27個の設定｜Swarm 東大AIエージェントラボ（X・2026-06-30）", "url": "https://x.com/swarm_japan/article/2072044819778806204"}, "added": "2026-09-23", "verified": "出典あり（Xの記事本文を読んで要約）／※2026年6月の記事（約3ヶ月前）。キー操作やコマンド名は変わっている可能性があるので、効かなければ最新の案内を確認してください", "origin": "X", "use": "両方", "axes": {"kind": "操作手順", "effect": "時間が減る", "effort": "すぐ試せる", "depth": "手順つき", "scene": "全般"}}, {"id": "claude-058", "ai": "Claude", "title": "「終わる前に自分で確かめる」を設定に1回書いておく", "summary": "毎回「ちゃんと確認して」と言うのをやめて、設定側に1回書く。以降すべての作業の最後に自動で走る。", "why": "作業のたびに言い忘れると、そのときだけ検証が抜ける。設定に置けば、言い忘れようがない。「変更してみたら動かなかった」でAIが止まるのではなく、確かめるところまでが1つの作業になる。", "steps": ["設定ファイル（CLAUDE.md など）に、作業の締めのルールを書く", "★何を確かめるかを具体的に書く（数字が合うか・画面が崩れていないか・ファイルが開けるか）", "★「確認した範囲」と「確認していない範囲」を必ず言わせる", "ついでに「今回学んだことを追記して」と頼むと、設定自体が育っていく"], "prompt": "（設定ファイルに1回だけ貼る）\n\n作業を終える前に、必ず次を行うこと。\n1. 実物（ファイル・画面・出力）で動作を確かめる。頭の中の確認で済ませない\n2. 報告に必ず3つを書く：確認した範囲／確認していない範囲／確認方法\n3. 1つでも確かめられていないものがあれば、「完了」と言わず「ここまでできた。残りは未確認」と書く\n4. 今回つまずいたことがあれば、失敗ログに1行追記する", "tags": ["設定", "品質アップ", "MDファイル"], "level": "初級", "source": {"title": "【保存版】Claude Code を『主語を渡すシステム』に変える27個の設定｜Swarm 東大AIエージェントラボ（X・2026-06-30）", "url": "https://x.com/swarm_japan/article/2072044819778806204"}, "added": "2026-09-23", "verified": "出典あり（Xの記事本文を読んで要約）／※2026年6月の記事（約3ヶ月前）。キー操作やコマンド名は変わっている可能性があるので、効かなければ最新の案内を確認してください", "origin": "X", "use": "自分用", "axes": {"kind": "設定・仕組み", "effect": "事故を防ぐ", "effort": "すぐ試せる", "depth": "手順つき", "scene": "環境づくり"}}, {"id": "claude-059", "ai": "Claude", "title": "1つの会話で全部やらせると、3〜5往復目から質が落ちる（しかも気づきにくい）", "summary": "調べる・書く・削る・整えるを同じ会話で続けると、前の役割の癖が次に染み出す。腕の問題ではなく、構造の問題。", "why": "具体的に3つのことが起きる。①調べたときの硬い書き方が本文にそのまま残る ②自分で書いた文章は冷静に削れず、長いまま仕上がる ③最初に決めた切り口が事実と食い違っても、もう書き始めたからと後戻りできなくなる。", "steps": ["工程を分ける：①切り口を決める ②調べる ③書く ④削る ⑤整える", "★工程ごとに会話を分ける（`/clear` で切るか、別の会話を立てる）", "次の工程には「前の工程の成果物だけ」を渡す。途中のやり取りは持ち込まない", "特に④削るは、書いた会話とは別に立てる。自分の文章は自分では削れない", "③で集めた事実が①の切り口と食い違ったら、戻って切り口を変えてよい"], "prompt": "（④「削る」を別の会話で始めるときの例）\n以下の文章を、読者の目線で3割削ってください。\n\n{文章を貼る}\n\n条件：\n- あなたはこの文章を書いていません。思い入れを持たずに削ってください\n- 同じことを2回言っている箇所、前置き、なくても意味が通る修飾を先に切る\n- 削ったあと「何を削ったか」を箇条書きで報告してください\n- 内容そのものは足さないでください", "tags": ["品質アップ", "資料作成", "プロンプト"], "level": "中級", "source": {"title": "【保存版】1人社長で5,000万円を稼ぐエージェントチームの構築方法｜Swarm 東大AIエージェントラボ（X・2026-05-17）", "url": "https://x.com/swarm_japan/article/2056130980717703222"}, "added": "2026-09-23", "verified": "出典あり（Xの記事本文を読んで要約）／※2026年5月の記事（約4ヶ月前）。元記事は海外記事の再構成で、「年5,000万円のチームを置き換える」は元記事の主張。時間や金額はこちらでは検証していません", "origin": "X", "use": "両方", "axes": {"kind": "考え方", "effect": "質が上がる", "effort": "少し準備", "depth": "手順つき", "scene": "提案書"}}, {"id": "other-057", "ai": "その他", "title": "「人が足りない」の正体を、知識不足かスキル不足かで切り分ける", "summary": "調べれば分かることが足りないのか、経験がないとできないことが足りないのか。どちらかで打ち手が正反対になる。", "why": "研修や提案で一番効く切り口。知識不足にスキル研修を当てても効かないし、逆も同じ。現場の症状で見分けられる。", "steps": ["★知識不足のサイン：ベテランへの質問攻めで業務が止まる／情報が散らばって属人化している", "★スキル不足のサイン：マニュアルはあるのに新人が商談をまとめられない／実行の質が低い", "知識不足なら → AIに「答え」を持たせる（社内資料を読ませる仕組み。頭に詰め込むのを諦める）", "スキル不足なら → AIに「練習相手」をさせる（代行させるのではなく、人を訓練する道具として使う）", "⚠️実際は両方が混ざっていることが多い。どちらが主かを見極めて、段階的に出す"], "prompt": "（研修・提案の設計に）\nこの会社の課題を、2つに切り分けてください。\n\n{現場で起きていること}\n\nA. 知識不足＝調べれば分かることが、探せない・散らばっている\nB. スキル不足＝マニュアルはあるのに、実行の質が上がらない\n\n- それぞれの根拠を、聞き取った症状から挙げてください\n- 両方が混ざっている場合は、どちらが主かと、その理由を書いてください\n- AとBで打ち手が変わることを、一言で説明できる形にしてください", "tags": ["営業", "社内資料"], "level": "中級", "source": {"title": "生成AIで「人材不足」は解消できるか？ 成功の鍵は「知識」と「スキル」の明確な切り分けにある｜伊志嶺（LLMで業務改善する人）（note・2025-11-23）", "url": "https://note.com/brave_quince241/n/n068af351906c"}, "added": "2026-09-23", "verified": "出典あり（全文無料の記事を読んで要約）／⚠️2025年11月の記事（約10ヶ月前）。考え方の整理で、数字や実証データはありません", "origin": "note", "use": "提案用", "axes": {"kind": "考え方", "effect": "発想が広がる", "effort": "少し準備", "depth": "手順つき", "scene": "研修・登壇"}}, {"id": "other-058", "ai": "その他", "title": "AIに任せても残る4つの力（研修の締めに使える）", "summary": "リスクを伴う意思決定と、その責任を引き受ける役割は人に残る。そこに必要な力は4つに分解できる。", "why": "「AIに仕事を奪われるのでは」という質問に、抽象論でなく分解して答えられる。しかも「才能ではなく習慣で身につく」と言えるのが大事。", "steps": ["① 学び続ける姿勢 — 暗記ではなく、新しいことに触れ続けること（土台）", "② 理解力 — AIの提案と、その背景にある理屈を正確に読み取る", "③ 応用的思考力 — それを自社の状況に当てはめたらどうなるかを考える", "④ リスク分析力 — 良い面と悪い面を冷静に見て、許容できるリスクかを判断する", "★「生まれつきの才能ではなく、日々の習慣で磨かれる」と伝える"], "prompt": "（研修の演習に）\nAIが出したこの提案について、4つの観点で検討してください。\n\n{AIの提案}\n\n1. 理解：この提案の背景にある理屈は何か\n2. 応用：うちの会社に当てはめると、具体的に何が起きるか\n3. リスク：うまくいかない場合、何が起きるか\n4. 判断：それは許容できるリスクか。誰が責任を持つか\n\n※答えを出すのはあなたではなく、私（受講者）です。考える材料を並べてください。", "tags": ["社内資料", "営業"], "level": "初級", "source": {"title": "「AIに仕事を奪われない人」の条件 -- エージェント時代に必要な\"責任を取る力\"とは｜伊志嶺（LLMで業務改善する人）（note・2026-03-09）", "url": "https://note.com/brave_quince241/n/n564b35c7c9b4"}, "added": "2026-09-23", "verified": "出典あり（全文無料の記事を読んで要約）／※2026年3月の記事（約6ヶ月前）。実証データではなく著者の整理です", "origin": "note", "use": "提案用", "axes": {"kind": "考え方", "effect": "発想が広がる", "effort": "すぐ試せる", "depth": "手順つき", "scene": "研修・登壇"}}, {"id": "other-059", "ai": "その他", "title": "AIにパソコンを触らせるとき、最低限おさえる3つの守り", "summary": "外に送らせない・作業フォルダの外を書き換えさせない・設定ファイルを変えさせない。この3つが最低ライン。", "why": "悪意ある指示が資料やコードに紛れていても、①盗んだ情報を外に送れない ②仕掛けを残せない ③守り自体を壊せない、なら被害が成立しない。被害には「秘密の情報」「信用できない入力」「持ち出す経路」の3つが揃う必要があり、どれか1つを断てばよい。", "steps": ["★① 外への通信を絞る — 必要な先だけ許可し、それ以外はつながせない", "★② 書き換えてよい場所を作業フォルダの中だけにする — 設定やホームフォルダは触らせない", "★③ 設定ファイル（自動実行の仕掛け・手順書・外部接続の設定）を読み取り専用にする", "③が土台。ここが書き換えられると①②も意味がなくなる", "会社のパソコンで使う場合は、まず③から確認する"], "prompt": "（作業を始める前に伝える）\n次を守って作業してください。\n\n- このフォルダの外にあるファイルは、読むのも書くのもしないでください\n- 設定ファイル（自動で実行される仕掛け・接続設定）は変更しないでください。\n  変更が必要だと思ったら、実行せず私に提案してください\n- 外部への送信・アップロード・公開は、私の許可なく行わないでください\n\nこれらに触れる必要が出たら、その時点で止まって報告してください。", "tags": ["設定", "つまずき対策"], "level": "中級", "source": {"title": "コーディングエージェントを安全に使う必須3制御 ―― NVIDIA AI Red Teamが示す最低ライン｜伊志嶺（LLMで業務改善する人）（note・2026-06-04）", "url": "https://note.com/brave_quince241/n/na93e14dff198"}, "added": "2026-09-23", "verified": "出典あり（記事を読んで要約）／※2026年6月の記事（約3.5ヶ月前）。元記事はNVIDIAの技術ブログを参照した整理で、引用そのものではありません", "origin": "note", "use": "両方", "axes": {"kind": "設定・仕組み", "effect": "事故を防ぐ", "effort": "少し準備", "depth": "手順つき", "scene": "環境づくり"}}, {"id": "claude-060", "ai": "Claude", "title": "経理のような「数字が合わない」仕事にも効く（解析はAI・入力は自分）", "summary": "会計ソフトからCSVを出して読ませると、二重計上や不明な支払いを見つけてくれる。入力まで自動化しないのがコツ。", "why": "実例として、1年分の経理の不整合を4時間ほどで解消している。完全自動化を見送り「解析と提案はAI、入力は自分」にしたのが、かえって速かったという判断。", "steps": ["まずプロジェクト（専用の会話）を作り、事業内容・状況を1回書いておく", "会計ソフトから仕訳データ・入出金履歴をCSVで書き出して渡す", "「不整合を見つけて修正案を出して」と頼む（二重計上などが出てくる）", "不明な支払いは、同時期のメールを検索させて特定する", "★入力・確定はAIにやらせず自分でやる。完全自動化は信頼性が読めない"], "prompt": "あなたは優秀な経理担当者です。\n\n事業内容：{事業内容}\n状況：{個人事業／法人／副業 など}\n\n添付したCSV（仕訳データ・入出金履歴）を読んで、次を出してください。\n\n1. 二重計上の疑いがある箇所（日付・金額・理由）\n2. 内容が特定できない支払い（一覧にして、調べる手がかりも）\n3. 取引先ごとの集計\n\n※修正の実行はしないでください。提案までで止めて、入力は私がやります。\n※推測で埋めず、判断できないものは「不明」と書いてください。", "tags": ["Excel", "時短"], "level": "中級", "source": {"title": "Claudeに確定申告を助けてもらった話｜伊志嶺（LLMで業務改善する人）（note・2026-03-02）", "url": "https://note.com/brave_quince241/n/n3200c7708534"}, "added": "2026-09-23", "verified": "出典あり（全文無料の記事を読んで要約）／※2026年3月の記事（約6ヶ月前）。「4時間」は著者1人の体験です", "origin": "note", "use": "自分用", "axes": {"kind": "操作手順", "effect": "時間が減る", "effort": "少し準備", "depth": "手順つき", "scene": "経理・数字"}}, {"id": "other-060", "ai": "その他", "title": "うまくいかないとき、どこが原因かを4つに切り分ける", "summary": "言い方が悪いのか、渡した情報が足りないのか、道具の権限の問題か、走らせ方の問題か。症状で見分けられる。", "why": "「AIがうまく動かない」と一括りにすると、プロンプトばかり直して直らない。4つは入れ子（内側から 言い方→渡す情報→道具の環境→走らせ方）になっていて、症状ごとに見るところが違う。", "steps": ["★一度の指示で出力が安定しない → **言い方**（プロンプト）を見直す", "★必要な情報が反映されていない → **渡した情報**を見直す（資料を渡したか／会話が長すぎないか）", "★道具が動かない・権限で止まる → **環境**を見直す（何を許可しているか）", "★長く走らせたら枠を食った・何をしたか分からない → **走らせ方**を見直す（どこで止めるか決めたか）", "内側から順に確認する。いきなり外側を疑わない"], "prompt": "うまくいかないので、原因の切り分けを手伝ってください。\n\n起きていること：{症状}\n私がやったこと：{指示の内容}\n\n次の4つのどこに原因がありそうか、判断して理由を書いてください。\n1. 指示の言い方\n2. 渡した情報（足りない／多すぎる）\n3. 道具や権限の設定\n4. 走らせ方（止めどころ・確認のしかた）\n\n一番可能性が高いものから順に、直し方も1つずつ添えてください。", "tags": ["つまずき対策", "品質アップ"], "level": "中級", "source": {"title": "プロンプト・コンテキスト・ハーネス・ループ。AIエージェントを支える四つのエンジニアリングの違い｜伊志嶺（LLMで業務改善する人）（note・2026-07-11）", "url": "https://note.com/brave_quince241/n/n82d3e73663e3"}, "added": "2026-09-23", "verified": "出典あり（全文無料の記事を読んで要約）／※2026年7月の記事（約2ヶ月前）。専門用語を日常語に置き換えています", "origin": "note", "use": "両方", "axes": {"kind": "失敗回避", "effect": "事故を防ぐ", "effort": "すぐ試せる", "depth": "手順つき", "scene": "全般"}}, {"id": "other-061", "ai": "その他", "title": "PoC（お試し導入）は「不確実さ×影響の大きさ」で絞る", "summary": "全部検証しようとすると終わらない。分からなくて、かつ外すと痛いものだけを先に確かめる。", "why": "PoCが失敗する理由は技術ではなく段取り。よくある失敗は4つ：目的が曖昧／項目を詰め込む／関係者と期待値を合わせない／結果が次に繋がらない。", "steps": ["確認したいことを、3つの視点で洗い出す：事業として成り立つか／使ってもらえるか／技術的にできるか", "★それぞれを「どれだけ分からないか」×「外すとどれだけ痛いか」で並べる", "★両方が高いものだけを最優先で検証する。両方低いものは検証しない", "始める前に「何をもって成功とするか」を文書にして、関係者と合意する", "終わったら報告会を開き、次に何をするかをその場で決める"], "prompt": "PoCの計画を作ります。\n\nやりたいこと：{内容}\n\n1. 確認すべきことを3つの視点で洗い出してください\n   - 事業として成り立つか／使ってもらえるか／技術的にできるか\n2. それぞれを「不確実さ（高・低）」×「外したときの影響（大・小）」で表にしてください\n3. 両方が高いものを最優先、両方低いものは「検証しない」と明記してください\n4. 各項目について「何をもって成功とするか」を、判定できる形で書いてください", "tags": ["営業", "社内資料"], "level": "中級", "source": {"title": "PoCを成功に導く「確認項目」の明確化と優先順位付け｜伊志嶺（LLMで業務改善する人）（note・2026-02-02）", "url": "https://note.com/brave_quince241/n/ne3cb7eecb2af"}, "added": "2026-09-23", "verified": "出典あり（全文無料の記事を読んで要約）／※2026年2月の記事（約7ヶ月前）。考え方の整理で、数字はありません", "origin": "note", "use": "提案用", "axes": {"kind": "考え方", "effect": "事故を防ぐ", "effort": "少し準備", "depth": "手順つき", "scene": "提案書"}}, {"id": "gemini-015", "ai": "Gemini", "title": "チラシは5分で作れる。ただし「思考モード」を選ばないと崩れる", "summary": "Geminiの画像生成でチラシが作れる。設定を1つ選び忘れると、文章が返ってきたりデザインが崩れる。", "why": "必要な情報を箇条書きで全部渡し、モードを正しく選ぶだけ。あとは「縦長にして」「色を変えて」と言えば直せる。イベント告知やセミナー案内の下書きが一気に速くなる。", "steps": ["Geminiを開き、ツールから「画像を作成」を選ぶ", "★右下のモード選択から「思考モード」を選ぶ（これを忘れると文章が返ってきたりデザインが崩れる）", "チラシに載せる情報を、箇条書きで全部書いて渡す（日時・場所・料金・対象・申込先）", "出てきたら「縦長にして」「この色を変えて」と段階的に直す", "⚠️日本語が文字化けすることがある。出てきた文字は必ず目で確かめる"], "prompt": "チラシの画像を作ってください。\n\n【載せる情報】\n- イベント名：{}\n- 日時：{}\n- 場所：{}\n- 対象：{}\n- 料金：{}\n- 申込方法：{}\n\n【デザイン】\n- 向き：{縦長／横長}\n- 雰囲気：{落ち着いた／明るい}\n- 上部{1/4}は見出し用に空ける\n\n※上の文字はそのまま正確に入れてください。文字の誤りがないか、作ったあと自分で確認してください。", "tags": ["資料作成", "時短"], "level": "初級", "source": {"title": "5分で完成! AIチラシ生成のやり方｜伊志嶺（LLMで業務改善する人）（note・2025-12-07）", "url": "https://note.com/brave_quince241/n/n396c6b77dba7"}, "added": "2026-09-23", "verified": "出典あり（記事を読んで要約）／⚠️2025年12月の記事（約9ヶ月前）。画面やモードの名称は変わっている可能性があります。記事は有料プラン（月2,900円）を推奨していますが、無料でも可能とのこと", "origin": "note", "use": "両方", "axes": {"kind": "操作手順", "effect": "時間が減る", "effort": "すぐ試せる", "depth": "手順つき", "scene": "画像・動画"}}, {"id": "other-062", "ai": "その他", "title": "AI人材は3層に分けて考える（全員が同じにならなくていい）", "summary": "使う人・作る人・方針を決める人。全員を同じレベルまで引き上げようとすると研修が破綻する。", "why": "「AI人材育成」を一括りにすると、対象も内容も決まらない。3層に分けると、誰に何をどこまで教えるかが決まる。競争軸が「知っている」から「活用できる」に変わったという整理も、経営層への説明に効く。", "steps": ["★第1層 使う人 — 効果的に頼める／出てきたものを検証・手直しできる。**全員がここは必要**", "★第2層 作る人 — 自社向けの仕組みを組める。業務の流れを設計できる", "★第3層 決める人 — 新しい技術を評価し、お試し導入や社内ルールを設計できる", "採用で見るのは：新しい道具を覚える速さ／何を聞くべきか判断できるか／出てきたものを疑えるか", "育成は第1層から全員。そこから希望者を第2層・第3層へ"], "prompt": "（研修設計・提案に）\nこの会社のAI人材育成を、3層に分けて設計してください。\n\n{会社の状況・人数・部門}\n\n1. 使う人（全員）— 何ができれば合格か、判定できる形で\n2. 作る人 — 何人くらい必要か、どの部門から出すか\n3. 決める人 — 誰が担うか、何を任せるか\n\n各層について「そこまで到達したと言える条件」を、観察できる行動で書いてください。\n※全員を第2層まで引き上げる前提にはしないでください。", "tags": ["社内資料", "営業"], "level": "中級", "source": {"title": "AIエージェント時代の人材定義｜伊志嶺（LLMで業務改善する人）（note・2025-08-12）", "url": "https://note.com/brave_quince241/n/n3ff7850146d9"}, "added": "2026-09-23", "verified": "出典あり（全文無料の記事を読んで要約）／⚠️2025年8月の記事（約1年前）。考え方の整理で、数字はありません", "origin": "note", "use": "提案用", "axes": {"kind": "考え方", "effect": "発想が広がる", "effort": "少し準備", "depth": "手順つき", "scene": "研修・登壇"}}, {"id": "other-063", "ai": "その他", "title": "AIに仕事を任せるとは「知識・経験・手段」の3つの不足を埋めること", "summary": "うまく任せられないのは、この3つのどれかが欠けているから。一番難しいのは「経験の言語化」。", "why": "「AIを入れる」を分解すると3つになる。①参照する情報がない ②ベテランの判断基準が言葉になっていない ③システムがつながっていない。どれが欠けているかで打ち手が変わる。", "steps": ["★① 知識 — 社内の文書や過去の事例を集めて、探せる状態にする", "★② 経験 — ベテランの判断基準や勘所を言葉にする（**ここが一番難しい**）", "　→ 聞き取りだけでは出ない。試作→失敗→指摘 を繰り返して引き出す", "　→ 複数人の知見を突き合わせる。言葉にできない部分は人に残すと割り切る", "★③ 手段 — 実際のシステムとつなぐ"], "prompt": "この業務をAIに任せられるか検討したいです。\n\n{業務の内容}\n\n次の3つについて、今どれが足りていないか整理してください。\n1. 知識：AIが参照できる資料や過去事例が、探せる形で揃っているか\n2. 経験：判断の基準が言葉になっているか。ベテランの頭の中だけになっていないか\n3. 手段：実際のシステムとつなげる見込みがあるか\n\n一番のボトルネックを1つ挙げ、そこから手を付ける順番を提案してください。", "tags": ["営業", "社内資料"], "level": "中級", "source": {"title": "エージェントAI開発とは、知識を用意し、経験を言語化し、手段を繋ぐことである｜伊志嶺（LLMで業務改善する人）（note・2026-08-03）", "url": "https://note.com/brave_quince241/n/nf11a13e37ac9"}, "added": "2026-09-23", "verified": "出典あり（全文無料の記事を読んで要約）／※2026年8月の記事（約1.5ヶ月前）", "origin": "note", "use": "提案用", "axes": {"kind": "考え方", "effect": "発想が広がる", "effort": "少し準備", "depth": "手順つき", "scene": "提案書"}}, {"id": "other-064", "ai": "その他", "title": "業務分析は「専門家に頼んで待つもの」でなくなりつつある", "summary": "これまで分析はアナリストに依頼して順番待ちだった。自然言語で聞けばその場で答えが返る形に変わってきている。", "why": "提案で「何が変わるのか」を説明するときの切り口。変わるのは速さだけでなく「誰が分析できるか」。現場の疑問がそのまま改善につながる。ただし実装はまだ実験段階で、期待先行の宣伝も多いと元記事自身が注意している。", "steps": ["従来：専門家に依頼 → 順番待ち → レポート受領（属人化しやすい）", "これから：現場が自然言語で質問 → その場で回答（分析の民主化）", "★仕組みの要点：計算はアルゴリズムに任せ、解釈だけAIが担当する（数字の間違いを避けるため）", "例：「特定部署で承認待ち3日」という滞留が見え、原因が「承認権限が1人に集中」まで自動で出る", "⚠️提案で使うときは「まだ実験段階」と正直に添える"], "prompt": "（提案の下準備に）\n現在この会社では、業務データの分析を誰がどうやっていますか、という整理をしたいです。\n\n{現状のヒアリング内容}\n\n1. いま分析を依頼してから結果が出るまでの流れと、かかる日数\n2. そのせいで止まっている改善があるか\n3. 現場が自分で聞けるようになったら、何が変わるか\n\n※誇張せず、今の技術でできることと、まだ難しいことを分けて書いてください。", "tags": ["営業", "リサーチ"], "level": "上級", "source": {"title": "エージェント型プロセスマイニングとは｜AIが業務分析を自律化し「誰が分析できるか」を変える｜伊志嶺（LLMで業務改善する人）（note・2026-05-26）", "url": "https://note.com/brave_quince241/n/n4d0b409719a9"}, "added": "2026-09-23", "verified": "出典あり（全文無料の記事を読んで要約）／※2026年5月の記事（約4ヶ月前）。元記事は論文（PMAx, arXiv）を参照していますが、こちらでは原典未確認。記事自身が「実装は実験段階」と注意しています", "origin": "note", "use": "提案用", "axes": {"kind": "考え方", "effect": "発想が広がる", "effort": "仕組みを作る", "depth": "考え方だけ", "scene": "提案書"}}, {"id": "other-065", "ai": "その他", "title": "ふわっと頼み続けると3〜4週目で破綻する（資料づくりも同じ）", "summary": "「いい感じに作って」で回すと、1週目は順調でも2週目から違和感が出て、3〜4週目には直すコストが跳ね上がる。", "why": "表面的には動いている／整っているので気づかない。中身がツギハギになっていて、あとから手を入れるたびに全体が崩れる。**短期のお試しには有効だが、長く使うものには向かない。**", "steps": ["★長く使うものは、先に「仕様」を決めてから頼む（何を・どんな形式で・どこは変えないか）", "★人が骨組みを作り、AIには「お手本」を渡す。ゼロから任せない", "要件を決めるところまでは人がやる。ここは渡さない", "★「全部を人が見直す」は解決策にならない（見る人が詰まってボトルネックになる）", "定期的に整え直す時間を最初から取っておく（作業時間の1〜2割）"], "prompt": "これから{作るもの}を長く使う前提で作ります。いきなり作り始めないでください。\n\nまず仕様を決めます。次を質問して、私に答えさせてください。\n1. 何を作るのか（目的・使う人）\n2. どんな形式にするか（決まりごと・守る体裁）\n3. あとから変える可能性が高いのはどこか\n4. 絶対に変えない土台はどこか\n\n仕様が固まったら、それをファイルに書き出してください。作るのはそのあとです。", "tags": ["つまずき対策", "品質アップ"], "level": "中級", "source": {"title": "なぜ「Vibeコーディング」はプロジェクトを破綻させるのか？｜伊志嶺（LLMで業務改善する人）（note・2025-10-21）", "url": "https://note.com/brave_quince241/n/n64d5620be3be"}, "added": "2026-09-23", "verified": "出典あり（記事を読んで要約）／⚠️2025年10月の記事（約11ヶ月前）。元記事はプログラミングの話ですが、資料づくりにも当てはまる部分を抜き出しました", "origin": "note", "use": "両方", "axes": {"kind": "考え方", "effect": "事故を防ぐ", "effort": "少し準備", "depth": "手順つき", "scene": "全般"}}, {"id": "other-066", "ai": "その他", "title": "アイデアを大量に出すときは「種を先に、肉付けは後」", "summary": "いきなり100個作らせると似たものばかりになる。まず短いキーワードを10個出させ、それぞれを別々に展開させる。", "why": "一度に完成品を並べさせると、AIは前に出したものに引きずられて似通う。種の段階では短いので発想が広がり、展開の段階では1つに集中できる。", "steps": ["① 「〇〇に関するキーワードを10個、重複なく」と頼む（短い言葉だけ）", "② 出てきた種を見て、使えそうなものを選ぶ", "③ 選んだ1つずつについて「これを基に〇〇を1つ作って」と個別に頼む", "★1つずつ頼むのがコツ。まとめて展開させると、また似てくる"], "prompt": "【1回目：種を出す】\n{テーマ}に関するキーワードを10個、重複しないように挙げてください。\n説明はいりません。短い言葉だけを並べてください。\n\n【2回目以降：1つずつ展開する】\nこのキーワード「{選んだ種}」を基に、{キャッチコピー／企画案}を1つ作ってください。\n他の候補は出さず、これ1本に集中してください。", "tags": ["プロンプト", "資料作成"], "level": "初級", "source": {"title": "LLMの性能を劇的に上げるデザインパターン4選｜伊志嶺（LLMで業務改善する人）（note・2025-09-14）", "url": "https://note.com/brave_quince241/n/n5bc496dcd8b3"}, "added": "2026-09-23", "verified": "出典あり（全文無料の記事を読んで要約）／⚠️2025年9月の記事（約1年前）。考え方は今も使えます", "origin": "note", "use": "両方", "axes": {"kind": "頼み方", "effect": "発想が広がる", "effort": "すぐ試せる", "depth": "手順つき", "scene": "全般"}}, {"id": "other-067", "ai": "その他", "title": "条件が複数あるときは、1回で完璧を狙わず「直させる」", "summary": "「100文字以内かつ特定の言葉を必ず入れる」のような複合条件は、出させてから足りない点を指摘して直させるほうが早い。", "why": "複数の条件を一発で満たすのは苦手。でも「今◯字です。△字以内にして。『□』が入っていません」と具体的に指摘すると直せる。指摘の内容を数えられる形にするのがコツ。", "steps": ["まず普通に頼む", "★出てきたものを、条件ごとに「満たしている／いない」で判定する", "★足りない点を、数字と言葉で具体的に指摘する（「短く」ではなく「今120字。100字以内に」）", "満たすまで繰り返す。2〜3回で収まることが多い", "同じ条件を何度も使うなら、最初から自己チェックさせる文を入れておく"], "prompt": "次の条件で文章を作ってください。\n\n条件：\n- {100}字以内\n- 「{必須の言葉1}」「{必須の言葉2}」を必ず含める\n- {ですます調／専門用語を使わない}\n\n★出す前に、自分で条件を1つずつ確認してください。\n条件ごとに「満たしている／いない」と、本文の文字数を明記してから本文を出してください。\n満たしていない項目があれば、直してから出してください。", "tags": ["プロンプト", "品質アップ"], "level": "初級", "source": {"title": "LLMの性能を劇的に上げるデザインパターン4選｜伊志嶺（LLMで業務改善する人）（note・2025-09-14）", "url": "https://note.com/brave_quince241/n/n5bc496dcd8b3"}, "added": "2026-09-23", "verified": "出典あり（全文無料の記事を読んで要約）／⚠️2025年9月の記事（約1年前）", "origin": "note", "use": "両方", "axes": {"kind": "頼み方", "effect": "質が上がる", "effort": "すぐ試せる", "depth": "手順つき", "scene": "全般"}}, {"id": "other-068", "ai": "その他", "title": "点数を付けさせるときは1回で決めない。複数回やって平均を取る", "summary": "同じ文章でも聞くたびに点数が揺れる。何回か聞いて平均を取ると安定する。選ばせるときは順番も入れ替える。", "why": "AIの評価には「揺れ」がある。1回だけの点数を根拠にすると危ない。また、選択肢を並べると「最初のものが有利になる」偏りがあるので、順番を変えて複数回やる。", "steps": ["★点数を付けさせるときは「数値のみ出力」と指定して、5回くらい実行する", "出た数字の平均か真ん中の値を採用する", "★選ばせるときは、選択肢の順番を毎回入れ替えて複数回聞く", "毎回同じものが選ばれたら信用してよい。バラけたら差が無いということ"], "prompt": "【点数を付けさせる】\nこの文章を1（{低い}）〜5（{高い}）で評価してください。\n理由は書かず、数値のみを出力してください。\n※私はこれを5回実行して平均を取ります。\n\n【選ばせる】\n以下の選択肢から「{費用対効果が高い}」ものを1つ選び、番号だけ答えてください。\n{選択肢を並べる}\n※私は順番を入れ替えて複数回聞きます。毎回同じものが選ばれるかを見ています。", "tags": ["リサーチ", "品質アップ"], "level": "中級", "source": {"title": "LLMの性能を劇的に上げるデザインパターン4選｜伊志嶺（LLMで業務改善する人）（note・2025-09-14）", "url": "https://note.com/brave_quince241/n/n5bc496dcd8b3"}, "added": "2026-09-23", "verified": "出典あり（全文無料の記事を読んで要約）／⚠️2025年9月の記事（約1年前）", "origin": "note", "use": "両方", "axes": {"kind": "頼み方", "effect": "質が上がる", "effort": "少し準備", "depth": "手順つき", "scene": "調べもの"}}, {"id": "other-069", "ai": "その他", "title": "人が確認するのは「後戻りできない一点」だけにする", "summary": "全部を人が見ようとすると確認待ちで詰まる。取り消しがきく作業は全部渡し、取り消しがきかない決定の直前だけ関所を置く。", "why": "「全部レビューする」は一見安全だが、見る人がボトルネックになって形だけになる。逆に、後戻りできる作業まで止める意味はない。**判断の分かれ目は「やり直せるかどうか」。**", "steps": ["★取り消しがきく作業（下書き・試作・調べもの・整形）→ 全部渡す。途中確認もしない", "★取り消しがきかない決定 → ここだけ人が関所になる", "　例：送信／公開／本番反映／上書き保存／削除／契約に関わる約束", "職種を問わず同じ：営業なら資料作成は渡し、交渉と提案は握る", "人に残る仕事は「技術の判断」から「人・組織に対する判断」へ移る"], "prompt": "（作業を頼むときの定型）\nこの作業を進めてください。途中の確認は不要です。\n\nただし、次に当たったら**必ず止まって私に聞いてください**。\n- 取り消しがきかないこと（送信・公開・本番反映・上書き・削除）\n- 外部の人に見える形になること\n- お金や契約に関わること\n\nそれ以外は、自分で判断して進めてかまいません。\n終わったら「やったこと」「止まって聞くべきだったか迷った点」を報告してください。", "tags": ["自動化", "つまずき対策"], "level": "中級", "source": {"title": "コーディングエージェントで私の開発はどう変わったか——作業と判断が分離していく｜伊志嶺（LLMで業務改善する人）（note・2026-05-28）", "url": "https://note.com/brave_quince241/n/nec60e10afab1"}, "added": "2026-09-23", "verified": "出典あり（全文無料の記事を読んで要約）／※2026年5月の記事（約4ヶ月前）。元記事は開発現場の話ですが、他職種への当てはめは元記事自身も示しています", "origin": "note", "use": "両方", "axes": {"kind": "考え方", "effect": "事故を防ぐ", "effort": "すぐ試せる", "depth": "手順つき", "scene": "環境づくり"}}, {"id": "other-070", "ai": "その他", "title": "「賢さ・速さ・安さ」は同時に取れない。どれを捨てるか先に決める", "summary": "3つとも欲しいと言うと、たいてい全部が中途半端になる。お試し段階は精度優先、本番は使う人の体験から逆算する。", "why": "導入検討で失敗する型は3つ。精度が足りない／待たされる／費用が見合わず承認が下りない。どれを優先するかを先に決めていないから、全部で不満が出る。", "steps": ["★お試し段階（PoC）→ **精度を優先**。速さと費用は後から改善できる", "★本番化の段階 → 使う人の体験から逆算してバランスを決める", "先に確認すること：どれくらい待てるか／どれくらいの正確さが要るか／どんな画面で使うか", "★チャットボット以外も検討する（フォームで受けて後からメールで返す等）。待たせてよいなら選択肢が広がる"], "prompt": "（導入検討の整理に）\nこの用途で、次の3つのどれを優先すべきか決めたいです。\n\n{用途・使う人・場面}\n\n1. 賢さ（精度・判断の質）\n2. 速さ（どれくらいで返ってくるか）\n3. 安さ（運用の費用）\n\n- まず「使う人はどれくらい待てるか」「どれくらいの正確さが必要か」を質問してください\n- そのうえで、優先順位と、犠牲にしてよいものを提案してください\n- チャット形式以外の選択肢（フォーム＋後日回答など）も検討してください", "tags": ["営業", "社内資料"], "level": "中級", "source": {"title": "AIエージェント開発で失敗しないための設計思考 ── 「賢さ・速さ・コスパ」のトレードオフを理解する｜伊志嶺（LLMで業務改善する人）（note・2026-02-09）", "url": "https://note.com/brave_quince241/n/nc1479deb8d69"}, "added": "2026-09-23", "verified": "出典あり（全文無料の記事を読んで要約）／※2026年2月の記事（約7ヶ月前）", "origin": "note", "use": "提案用", "axes": {"kind": "考え方", "effect": "事故を防ぐ", "effort": "少し準備", "depth": "手順つき", "scene": "提案書"}}, {"id": "claude-061", "ai": "Claude", "title": "自動モードの設定をいじるなら「$defaults」を必ず残す", "summary": "自動モードは「確認を飛ばす危ないモード」ではなく、裏で安全判定が働く仕組み。ただし設定を書き換えるとき、ある一語を消すと安全網が丸ごと消える。", "why": "自動モードは、無制限に実行するモード（--dangerously-skip-permissions）と混同されがちだが別物。裏で危険度を判定する仕組みが動いている。ただしその判定は設定に書かれた内容を見ているので、書き方を誤ると効かなくなる。", "steps": ["まず今の設定を確認する（何も書いていなければ、初期の安全網がそのまま効いている＝安全）", "★書き換えるときは、各項目の一覧に **`$defaults` を必ず含める**", "★これを書き忘れると、はじめから用意されている安全網が**全部消える**。最大の落とし穴", "効き方の強さ：絶対禁止 ＞ 要確認 ＞ 許可 ＞ こちらの指示（上が下を上書きする）", "設定をいじる必要がないなら、触らないのが一番安全"], "prompt": "（設定を変える前に必ず確認）\n今の自動モードの設定を確認したいです。\n\n1. 設定ファイルに autoMode の記述があるか\n2. あるなら、各項目に `$defaults` が含まれているか\n3. 含まれていない項目があれば、それがどう危ないかを説明してください\n\n※確認だけしてください。私が判断するまで、設定は書き換えないでください。", "tags": ["設定", "つまずき対策"], "level": "上級", "source": {"title": "Claude Code Auto Mode を安全に使いこなす設定ガイド｜伊志嶺（LLMで業務改善する人）（note・2026-05-20）", "url": "https://note.com/brave_quince241/n/n25a48bc4263f"}, "added": "2026-09-23", "verified": "出典あり（全文無料の記事を読んで要約）／※2026年5月の記事（約4ヶ月前）。設定項目の名称は変わっている可能性があるので、実際に変更する前に最新の案内を確認してください", "origin": "note", "use": "自分用", "axes": {"kind": "設定・仕組み", "effect": "事故を防ぐ", "effort": "少し準備", "depth": "手順つき", "scene": "環境づくり"}}, {"id": "other-071", "ai": "その他", "title": "採用の基準が「その人のスキル」から「AIに任せるより速いか」に変わった", "summary": "比べる相手が他の応募者ではなく、AIになった。だから入口の水準が上がり、数年前の『一人前』が今の『採用の最低ライン』になっている。", "why": "人材育成や採用の提案で、いま何が起きているかを説明する切り口。「AIに仕事を奪われる」という漠然とした話ではなく、**比較の物差しが変わった**という具体的な整理。", "steps": ["★比較の基準：「この人に頼むのと、AIに任せるのと、どちらが速いか」", "元記事が挙げる最低ラインは5つ：", "　① 要件から設計ができる ② 分からないことを自分で調べ、聞ける", "　③ 問題の原因が『依頼側か作り側か』を切り分けられる", "　④ 依頼側の問題なら、適切に上に上げられる ⑤ 作り側の問題なら自分で解決できる", "★育成に翻訳すると：「指示待ちの範囲」を減らし、切り分けと自走の練習をさせる", "⚠️基準を言葉にしていないと、採る側も応募する側も評価がぶれ続ける"], "prompt": "（採用基準・育成計画の整理に）\nこの職種の「今の最低ライン」を言葉にしたいです。\n\n{職種・業務内容}\n\n1. この仕事のうち、AIに任せたほうが速い部分はどこか\n2. 残る部分で、人に求められることは何か（観察できる行動で書く）\n3. それを5つ以内の条件にまとめてください\n4. 今いるメンバーが、そこへ届くために何を練習すべきか\n\n※精神論（主体性がある等）ではなく、判定できる形で書いてください。", "tags": ["社内資料", "営業"], "level": "中級", "source": {"title": "今雇える最低ラインのエンジニアの要件を整理してみたら、レベルが高すぎて絶望した話｜伊志嶺（LLMで業務改善する人）（note・2026-08-01）", "url": "https://note.com/brave_quince241/n/n4bdfac4bdd35"}, "added": "2026-09-23", "verified": "出典あり（全文無料の記事を読んで要約）／※2026年8月の記事（約1.5ヶ月前）。元記事はエンジニア採用の話です。「米国22〜25歳層で16%減」という数字は記事からの引用で、こちらでは一次資料にあたっていません", "origin": "note", "use": "提案用", "axes": {"kind": "考え方", "effect": "発想が広がる", "effort": "少し準備", "depth": "手順つき", "scene": "採用・人事"}}, {"id": "claude-062", "ai": "Claude", "title": "手順書は「小さく分けて組み合わせる」。大きな1個を作らない", "summary": "目的を絞った小さな手順書を複数作って呼び分ける。1個の巨大な手順書より、直すのも使い回すのも楽になる。", "why": "小さく分けると3つ得をする。①おかしくなった箇所をすぐ特定できる ②1つ直せば、それを使う全部の流れが良くなる ③同じものを別の用途に流用できる。", "steps": ["1つの手順書に詰め込まず、目的ごとに分ける", "★**説明文を具体的に書く。**AIは説明文を読んで「今どれを使うか」を自分で選ぶ。曖昧な説明のものは**そもそも呼ばれない**", "構成は3層：説明（いつ使うか）／手順（どう進めるか）／道具（実際に動かすもの）", "★多くの人は「説明と手順」で止まるが、**効くのは道具の層**（毎回同じことをやる部分をプログラムにしておく）", "困ったら「これ、別の場面でも使えるか？」と自問する。使えるなら分ける価値がある"], "prompt": "今ある手順書を見直したいです。\n\n1. 1つに詰め込みすぎて、分けたほうがよいものはどれか\n2. 各手順書の**説明文**を見て、「どんなときに使うか」が具体的に書かれているか判定してください\n   曖昧なものは、あなた自身が選べないはずです。正直に指摘してください\n3. 毎回手でやっている部分のうち、プログラムにできるものはどれか\n\n※提案だけしてください。私が選ぶまで書き換えないでください。", "tags": ["MDファイル", "自動化"], "level": "上級", "source": {"title": "Anthropicエンジニアのスキル設計｜東大ClaudeCode研究所（X・2026-06-04）", "url": "https://x.com/ClaudeCode_UT/status/2062448017987510427"}, "added": "2026-09-23", "verified": "出典あり（Xの投稿を読んで要約）／※2026年6月の投稿（約3.5ヶ月前）。元は海外の調査投稿の紹介で、こちらでは原典未確認", "origin": "X", "use": "自分用", "axes": {"kind": "設定・仕組み", "effect": "質が上がる", "effort": "仕組みを作る", "depth": "手順つき", "scene": "環境づくり"}}, {"id": "claude-063", "ai": "Claude", "title": "長い説明はMDでなくHTMLで出させる（100行超のMDは読まれない）", "summary": "Claude Code本体の開発者が「社内ではHTMLが標準になった」と発信。100行を超えるテキストのメモは、実際には読まれていない。", "why": "MDの最大の利点は「人が手で直せる」ことだったが、今は直すのもAIに任せることが増えた。だから利点が薄れ、表・図・色・リンクを1つにまとめられるHTMLのほうが実用的になっている。**ブラウザで開けるのでそのまま人に見せられる**のも大きい。", "steps": ["調査結果・要件整理・比較検討など、**長くなるもの**はHTMLで出させる", "★表・図・色分け・折りたたみを使わせる（MDではできない）", "できたファイルをダブルクリックすれば、そのまま見られる", "★短いメモや、自分で頻繁に手直しするものは今まで通りMDでよい", "⚠️これは「MDをやめろ」ではなく「長い読み物はHTMLのほうが読まれる」という話"], "prompt": "{調査結果／要件整理／比較検討}を、**1枚のHTMLファイル**にまとめてください。\n\n条件：\n- ブラウザで開くだけで読める1ファイルにする（外部の読み込みなし）\n- 表・色分け・見出しを使って、目で追える形にする\n- 長い部分は折りたたみにして、最初は要点だけ見えるようにする\n- 冒頭に「結論3行」を置く\n- スマホでも読める幅にする\n\n※文章を長く書くのではなく、構造で見せてください。", "tags": ["資料作成", "品質アップ", "時短"], "level": "初級", "source": {"title": "Claude CodeでMarkdownではなくHTMLを使うべき理由（Anthropicの開発者発信を紹介）｜東大ClaudeCode研究所（X・2026-08-11 の関連投稿）", "url": "https://x.com/ClaudeCode_UT/status/2087026239668355273"}, "added": "2026-09-23", "verified": "出典あり（Xの投稿と関連する複数の発信を読んで要約）／※2026年8月ごろの話題。元はAnthropicの開発者(Thariq Shihipar氏)の発信で、こちらでは本人の原文まで確認していません。「生成が2〜4倍速い」という説もありますが未検証のため記載していません", "origin": "X", "use": "両方", "axes": {"kind": "頼み方", "effect": "質が上がる", "effort": "すぐ試せる", "depth": "手順つき", "scene": "提案書"}}, {"id": "claude-064", "ai": "Claude", "title": "引き継ぎのたびに説明し直さない。全体像を1枚にまとめさせておく", "summary": "作ったものの全体構造を「人が見る1枚」と「AIが読むデータ」の2つで出させておくと、次に触るときの説明が要らなくなる。", "why": "新しい会話を始めるたびに、何がどうなっているかを一から説明している。それを1回まとめておけば、次からはそれを渡すだけで前提が揃う。人にも渡せる。", "steps": ["区切りのいいところで「全体の構造をまとめて」と頼む", "★2つ作らせる：人が見る用（HTML）と、次にAIが読む用（データ）", "以後、新しい会話の最初にそれを渡す", "★大きく変えたら作り直す。古いままだと逆に誤解のもとになる", "人に引き継ぐときも、その1枚を渡せば済む"], "prompt": "ここまでで作ったものの全体像をまとめてください。2つ作ってください。\n\n1. **人が見る用（HTMLファイル1枚）**\n   - 何を作ったか／どんな部品でできているか／どこを触ると何に影響するか\n   - 図と表で。文章は最小限に\n\n2. **次に作業するとき用（データファイル）**\n   - ファイルの一覧と、それぞれの役割\n   - 決めたこと・守るべき約束\n   - まだ終わっていないこと\n\n※推測で埋めないでください。分からない部分は「未確認」と書いてください。", "tags": ["MDファイル", "時短"], "level": "中級", "source": {"title": "アプリ全体の構造を1枚のHTMLと1個のJSONにまとめる｜東大ClaudeCode研究所（X・2026-08-11）", "url": "https://x.com/ClaudeCode_UT/status/2087026239668355273"}, "added": "2026-09-23", "verified": "出典あり（Xの投稿を読んで要約）／※2026年8月の投稿（約1.5ヶ月前）。元は海外の投稿の紹介です", "origin": "X", "use": "自分用", "axes": {"kind": "設定・仕組み", "effect": "時間が減る", "effort": "少し準備", "depth": "手順つき", "scene": "環境づくり"}}, {"id": "claude-065", "ai": "Claude", "title": "プランは値段でなく「週あたりどれだけ使えるか」で比べる", "summary": "高いチーム向けプランのほうが、個人の上位プランより使える量が少ないことがある。契約前に週単位で比べる。", "why": "5時間あたりで比べると同じに見えても、**週単位の上限で差がつく**ことがある。記事の時点では、個人の上位プランのほうが週の枠が1.5〜3倍多かった。チーム向けを選ぶ理由は枠ではなく、管理機能・ログイン統合・請求のまとめ。", "steps": ["★比べるのは「5時間あたり」ではなく「週あたり」の上限", "使いたいモデル別に確認する（上位モデルは別枠で少ないことがある）", "チーム向けを選ぶ判断材料は、枠ではなく：メンバー管理／ログイン統合／請求の一本化／セキュリティ要件", "★社内で申請する前に、この比較表を作っておくと説明が早い", "⚠️料金も枠も変わる。契約前に必ず最新の公式情報で確認する"], "prompt": "（社内申請の前に）\n次の観点でプランを比較する表を作ってください。\n\n- 月額\n- **週あたりの使用上限**（モデル別に）\n- 5時間あたりの上限\n- 管理機能（メンバー管理・ログイン統合・請求のまとめ）\n- セキュリティ要件への対応\n\n※数字は必ず公式ページを確認して、確認日を添えてください。\n※分からない項目は「要確認」と書き、推測で埋めないでください。", "tags": ["節約", "設定"], "level": "初級", "source": {"title": "Claude Teamプラン契約前に知っておくべきレートリミットの落とし穴｜伊志嶺（LLMで業務改善する人）（note・2026-01-27）", "url": "https://note.com/brave_quince241/n/n60e3b857526a"}, "added": "2026-09-23", "verified": "出典あり（全文無料の記事を読んで要約）／⚠️2026年1月の記事（約8ヶ月前）。記事にある具体的な金額・モデル名・時間数は当時のもので**今は確実に変わっています**。ここでは「週単位で比べる」という考え方だけを残しました", "origin": "note", "use": "自分用", "axes": {"kind": "考え方", "effect": "枠を節約", "effort": "すぐ試せる", "depth": "手順つき", "scene": "環境づくり"}}, {"id": "other-072", "ai": "その他", "title": "アンケートは「答える人に書かせない」。事前入力URLで手間をなくす", "summary": "Googleフォームは、開いた時点で一部の項目が埋まった状態のURLを作れる。回答者の手間と入力ミスが減る。", "why": "セミナーや研修のアンケートで「どの回についてか」「所属はどこか」を毎回書かせると、回答率が落ちるし表記も揺れる。こちらで埋めた状態のURLを配れば、その手間が消える。", "steps": ["Googleフォームの編集画面を開く", "右上の「…」（縦3点）→「フォームに事前入力する」を選ぶ", "埋めておきたい項目に、こちらで値を入れる（例：研修名、開催日、部署）", "下の「リンクを取得」を押すと、埋まった状態のURLができる", "配布先ごとにURLを作り分ければ、誰からの回答かも自動で分かる", "⚠️URLに値が見える形で入るので、**機密情報は入れない**（書き換えもできてしまう）"], "prompt": "（配布用URLを作るときの整理に）\n{セミナー／研修}のアンケートを作ります。\n\n1. 回答者に書かせる項目と、こちらで先に埋めておける項目を分けてください\n2. 配布先ごとにURLを作り分けるとしたら、何で分けるべきか提案してください\n3. URLに入れてはいけない項目があれば指摘してください", "tags": ["時短", "会議"], "level": "初級", "source": {"title": "Googleフォームの事前入力URL活用術 - UAT/UX調査のフィードバック収集を効率化｜伊志嶺（LLMで業務改善する人）（note・2026-01-26）", "url": "https://note.com/brave_quince241/n/n30fcc55942b6"}, "added": "2026-09-23", "verified": "出典あり（全文無料の記事を読んで要約）／※2026年1月の記事（約8ヶ月前）。Googleフォームの画面は変わっている可能性があります", "origin": "note", "use": "両方", "axes": {"kind": "操作手順", "effect": "時間が減る", "effort": "すぐ試せる", "depth": "手順つき", "scene": "会議・議事録"}}], "feed": [{"kind": "youtube", "title": "GeminiのVMがネットにつながった。clasp・Colab・Notebook APIを入れて、GASのデプロイまで任せる方法【無料キット】", "url": "https://www.youtube.com/watch?v=EYeKZ7zwi0Y", "date": "2026-11-28", "thumb": "https://i.ytimg.com/vi/EYeKZ7zwi0Y/mqdefault.jpg", "author": "まじん", "pick": "オーナー指定", "ai": "Gemini", "chapters": [], "summary": null}, {"kind": "youtube", "title": "【解説】研修会社からAI商社へ｜全社総会で語ったデジライズの戦略 #Shorts", "url": "https://www.youtube.com/watch?v=ilnF5n8lpnM", "date": "2026-11-28", "thumb": "https://i.ytimg.com/vi/ilnF5n8lpnM/mqdefault.jpg", "author": "チャエン【AI研究所】", "pick": "オーナー指定", "ai": "その他", "chapters": [], "summary": null}, {"kind": "note", "title": "Gemini の「タスク」のパソコン（VM）に入れておきたいツール3選｜clasp・Notebook API・Colab【無料配布】", "url": "https://note.com/majin_108/n/n17ba2841cb8a", "date": "2026-11-28", "thumb": "https://assets.st-note.com/production/uploads/images/341663604/rectangle_large_type_2_a2f6f00494e7c894925c3e04639d68b1.png?width=800", "author": "まじん（note）", "pick": "オーナー指定", "ai": "Gemini", "chapters": [], "summary": "こんにちは、まじんです。Gemini アプリの「タスク」の裏では、Gemini 専用の作業用パソコン（VM）が動いています。このパソコンが、最近インターネットにつながるようになりました。続きをみる"}, {"kind": "note", "title": "【12月17日で完全消滅】「スキルへ自動移行されるから安心」と放置していたGeminiのマイGemが、先週から突然編集ロックされ添付ファイルごと消失するカウントダウンが始まった話", "url": "https://note.com/alix78/n/n40110d6c3982", "date": "2026-11-28", "thumb": "https://assets.st-note.com/production/uploads/images/339421869/rectangle_large_type_2_abedfc21b76e9bb65cf4517b103e2610.png?width=800", "author": "アリス｜AI検証ログ（note）", "pick": "Claude推薦", "ai": "Gemini", "chapters": [], "summary": "今、Google Geminiの「カスタムGem（マイGem）」に自分専用の指示文や資料ファイルを保存したまま、何もせずに放置していませんか？もし「新機能の『スキル（Skills）』へ自動で移行されるから大丈夫」と油断しているなら、悪いことは言いません、今すぐ自分のGemini画面を開いて中身を確認してください。18歳以上の個人Googleアカウントでは、すでに2026年11月17日付でマイGemが「読み取り専用」へロックされており、残り約3週間後の2026年12月17日にはアプリ上から完全に削除され、添付ファイル"}, {"kind": "note", "title": "【データ消失ストッパー】削除直前のGemini「マイGem」から移行対象外ファイルを全救出し、新機能「スキル」で暴発させずに再現する移行設計図", "url": "https://note.com/alix78/n/n7c50715e246a", "date": "2026-11-28", "thumb": "https://assets.st-note.com/production/uploads/images/339421972/rectangle_large_type_2_93f1bdbd437d38ede781d20d9342bd0f.png?width=800", "author": "アリス｜AI検証ログ（note）", "pick": "Claude推薦", "ai": "Gemini", "chapters": [], "summary": "無料記事でお伝えした通り、18歳以上の個人Googleアカウントにおいて、2026年11月17日付で従来の「カスタムGem（マイGem）」が読み取り専用へロックされました。画面を開いても「編集」や「新規チャット開始」ができなくなっており、残り約3週間後の2026年12月17日にはアプリ上から完全に削除され、保存していた添付ファイルごと二度と取り出せなくなるカウントダウンが始まっています。もっとも危険なのは、Googleの案内にある「Gemは自動で新しい『スキル（Skills）』へ移行されます」という一文を信じて、何"}, {"kind": "note", "title": "一流の人が「絶対にやらないこと」とは？田中渓×三浦崇宏から学ぶ、人生を劇的に変える6つの習慣とAI時代の生き方", "url": "https://note.com/ak_hikiyose/n/n163b321f84bd", "date": "2026-11-28", "thumb": "https://assets.st-note.com/production/uploads/images/341761939/rectangle_large_type_2_ccdb51655031795f698d77e912fef757.jpg?width=800", "author": "けい｜AIと共に（note）", "pick": "Claude推薦", "ai": "その他", "chapters": [], "summary": "人生を変えたいと思ったとき、あなたは最初に何をしますか？続きをみる"}, {"kind": "youtube", "title": "AnthropicのパーソナルAI『Claude
