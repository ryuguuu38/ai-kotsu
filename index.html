<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<title>AIコツ図鑑</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="shortcut icon" href="favicon.ico?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#c2512a">
<style>
:root{
  --bg:#f7f7f5; --panel:#ffffff; --ink:#1c1c1a; --muted:#6b6b63; --line:#e3e3dd;
  --accent:#c2512a; --accent-soft:#fdf0e9; --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.05);
  --chatgpt:#10a37f; --claude:#c2512a; --gemini:#3d7de8; --copilot:#7a4fd6; --other:#7a7a70;
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16161a; --panel:#1f1f24; --ink:#ecece8; --muted:#9a9a93; --line:#32323a;
    --accent:#e8794a; --accent-soft:#2a1e18; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#16161a; --panel:#1f1f24; --ink:#ecece8; --muted:#9a9a93; --line:#32323a;
  --accent:#e8794a; --accent-soft:#2a1e18; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Meiryo",system-ui,sans-serif;
  line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:14px 0 10px}
h1{font-size:19px;margin:0;letter-spacing:.02em}
h1 span{color:var(--accent)}
.sub{font-size:12px;color:var(--muted)}
.sub-short{display:none}
.themebtn{margin-left:8px;border:1px solid var(--line);background:var(--panel);color:var(--muted);
  border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer}
.tabs{display:flex;gap:4px;padding-bottom:0}
.tab{border:0;background:none;color:var(--muted);font-size:14px;font-weight:600;padding:9px 14px;
  cursor:pointer;border-bottom:2px solid transparent;font-family:inherit}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 0 6px}
input[type=search]{flex:1;min-width:200px;padding:9px 13px;border:1px solid var(--line);border-radius:9px;
  background:var(--panel);color:var(--ink);font-size:14px;font-family:inherit}
.pills{display:flex;gap:6px;flex-wrap:wrap;padding:8px 0 16px}
.pill{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;
  padding:5px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill b{font-weight:600;opacity:.6;margin-left:5px;font-size:11px}
main{padding:0 0 80px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
@media(min-width:1180px){ .grid{grid-template-columns:repeat(3,1fr)} }
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.badges{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11px}
.ai{padding:2px 9px;border-radius:999px;color:#fff;font-weight:700;letter-spacing:.03em}
.ai.ChatGPT{background:var(--chatgpt)} .ai.Claude{background:var(--claude)}
.ai.Gemini{background:var(--gemini)} .ai.Copilot{background:var(--copilot)}
.ai\.その他,.ai.other{background:var(--other)}
.org{border-radius:5px;padding:1px 7px;font-weight:700;letter-spacing:.02em}
.org.X{background:#111;color:#fff} .org.YouTube{background:#e03b2f;color:#fff}
.org.note{background:#2cb696;color:#fff} .org.Claude{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent)}
.lv{color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.card h3{margin:0;font-size:16px;line-height:1.5}
.sum{margin:0;font-size:13.5px;color:var(--ink)}
.why{margin:0;font-size:12.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}
ol.steps{margin:0;padding-left:20px;font-size:13px;color:var(--ink)}
ol.steps li{margin:3px 0}
.promptbox{position:relative;background:var(--accent-soft);border:1px solid var(--line);border-radius:10px;
  padding:12px 12px 10px;font-size:12.5px;white-space:pre-wrap;word-break:break-word;
  font-family:ui-monospace,"SF Mono",Menlo,monospace;max-height:210px;overflow:auto}
.fav{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:7px;
  padding:2px 9px;font-size:12px;cursor:pointer;font-family:inherit;margin-left:auto}
.fav.on{background:#f5b301;color:#2a2200;border-color:#f5b301;font-weight:700}
.copy{position:absolute;top:8px;right:8px;border:1px solid var(--line);background:var(--panel);
  color:var(--muted);border-radius:7px;padding:3px 9px;font-size:11px;cursor:pointer;font-family:inherit}
.copy.done{background:var(--accent);color:#fff;border-color:var(--accent)}
.foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--muted);
  border-top:1px solid var(--line);padding-top:9px;margin-top:auto}
.tag{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.src{margin-left:auto;text-decoration:none;color:var(--accent);font-weight:600}
.unverified{color:#a8783a}
.newsrow{display:flex;gap:10px;align-items:baseline;padding:10px 4px;border-bottom:1px solid var(--line);font-size:14px}
.newsrow .d{color:var(--muted);font-size:11.5px;white-space:nowrap;width:74px;flex:none}
.newsrow a{text-decoration:none}
.newsrow a:hover{color:var(--accent)}
.newsrow .s{color:var(--muted);font-size:11.5px;white-space:nowrap}
.thumb{flex:none;width:120px;height:68px;border-radius:9px;object-fit:cover;background:var(--bg);
  border:1px solid var(--line)}
.thumbx{flex:none;width:120px;height:68px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:19px;color:#fff;letter-spacing:.02em;border:1px solid var(--line)}
.fbody{flex:1;min-width:0}
.frow{display:flex;gap:12px;align-items:flex-start}
.nthumb{flex:none;width:56px;height:38px;border-radius:6px;object-fit:cover;border:1px solid var(--line);background:var(--bg)}
.nthumbx{flex:none;width:56px;height:38px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:12px;color:#fff;border:1px solid var(--line)}
@media(max-width:600px){ .thumb,.thumbx{width:96px;height:56px} .nthumb,.nthumbx{width:44px;height:30px} }
.fcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  margin-bottom:10px;box-shadow:var(--shadow)}
.fhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-bottom:6px}
.who{font-weight:700;color:var(--ink)}
.kind{border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.ftitle{font-size:15px;font-weight:600;text-decoration:none;line-height:1.5;display:block;margin-bottom:5px}
.ftitle:hover{color:var(--accent)}
.fsum{font-size:12.5px;color:var(--muted);margin:0 0 6px}
details.chap{font-size:12.5px}
details.chap summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:12px;outline:none}
details.chap ul{margin:7px 0 0;padding-left:18px;color:var(--ink)}
details.chap li{margin:2px 0}
details.chap .t{color:var(--muted);font-family:ui-monospace,Menlo,monospace;font-size:11px;margin-right:6px}
.sec{margin:6px 0 26px}
.sec h2{font-size:14px;margin:0 0 10px;letter-spacing:.04em;color:var(--muted);
  display:flex;align-items:center;gap:8px}
.sec h2 em{font-style:normal;background:var(--accent);color:#fff;border-radius:999px;
  padding:1px 8px;font-size:11px}
.sec h2 a{margin-left:auto;font-size:11.5px;color:var(--accent);text-decoration:none;font-weight:600}
.big{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;
  box-shadow:var(--shadow);margin-bottom:12px}
.big h3{margin:0 0 6px;font-size:15.5px;line-height:1.5}
.big h3 a{text-decoration:none}
.big h3 a:hover{color:var(--accent)}
.zero{color:var(--muted);font-size:13px;padding:10px 0}
.when{color:var(--muted);font-size:11.5px;white-space:nowrap}
.when.today{color:var(--accent);font-weight:700}
.lang{border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:10px;color:var(--muted)}
.more{display:block;width:100%;margin:18px 0 0;padding:11px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);border-radius:10px;font-size:13.5px;cursor:pointer;font-family:inherit}
.more:hover{border-color:var(--accent);color:var(--accent)}
.totop{position:fixed;right:16px;bottom:16px;z-index:30;border:1px solid var(--line);background:var(--panel);
  color:var(--muted);border-radius:999px;width:42px;height:42px;cursor:pointer;font-size:16px;
  box-shadow:var(--shadow);display:none}
.totop.show{display:block}
mark{background:#ffe58a;color:#231c00;border-radius:3px;padding:0 1px}
:root[data-theme="dark"] mark{background:#6b5a1a;color:#fff}
a:visited .ftitle,.newsrow a:visited{opacity:.62}
.edrow{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;-webkit-overflow-scrolling:touch}
.edpill{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--fg);
  border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.edpill b{font-weight:600;color:var(--muted);margin-left:5px;font-size:11px}
.edpill.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.edpill.on b{color:rgba(255,255,255,.8)}
.audiobox.waiting{border-style:dashed;background:transparent}
.edtag{margin-left:7px;font-size:11px;font-weight:700;background:var(--accent);color:#fff;
  border-radius:999px;padding:2px 8px;vertical-align:middle}
.castbar{position:sticky;top:96px;z-index:15;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;margin-bottom:16px;box-shadow:var(--shadow);
  display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.castmeta{font-size:12px;color:var(--muted);margin-left:auto}
.line{display:flex;gap:10px;margin-bottom:12px;align-items:flex-start}
.line .who{flex:none;width:58px;font-size:11px;font-weight:700;text-align:center;
  border-radius:8px;padding:5px 0;line-height:1.3}
.line.metan .who{background:#f0e2f5;color:#6b2d80}
.line.zunda .who{background:#dff3dc;color:#2a6b28}
:root[data-theme="dark"] .line.metan .who{background:#3a2440;color:#e9c9f5}
:root[data-theme="dark"] .line.zunda .who{background:#25381f;color:#c5edbe}
.line .txt{flex:1;font-size:15px;line-height:1.8;padding:6px 12px;border-radius:12px;
  background:var(--panel);border:1px solid var(--line);transition:background .2s}
.line.now .txt{background:var(--accent-soft);border-color:var(--accent)}
.audiobox{background:var(--accent-soft);border:2px solid var(--accent);border-radius:12px;
  padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.audiobox h3{margin:0 0 4px;font-size:14px}
.audiobox audio{width:100%;margin-top:8px}
.audiobox .note{font-size:11.5px;color:var(--muted);margin:4px 0 0}
.audiobox a{color:var(--accent);font-weight:600;text-decoration:none;font-size:12px}
.credit{font-size:11.5px;color:var(--muted);margin-top:18px;text-align:right}
.empty{color:var(--muted);padding:40px 0;text-align:center;font-size:14px}
.hint{font-size:12px;color:var(--muted);padding:2px 0 14px}
/* 空の絞り込み行が余白を作らないように */
.pills:empty{display:none;padding:0;margin:0}
.fwrap{display:none}
.fwrap.open{display:block}
.fhead{display:flex;gap:8px;align-items:center;padding:6px 0 2px;flex-wrap:wrap}
.fbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;
  padding:6px 13px;font-size:12.5px;cursor:pointer;font-family:inherit;font-weight:600}
.fbtn.act{background:var(--accent);color:#fff;border-color:var(--accent)}
/* 5軸の絞り込み */
#axpills{padding:2px 0 6px}
.axrow{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:3px 0}
.axlabel{font-size:11.5px;color:var(--muted);min-width:64px;font-weight:700}
.pill.sm{padding:3px 9px;font-size:11.5px}
.pill.sm b{font-size:10px}
/* 👎 */
.nope{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;
  padding:3px 9px;font-size:11.5px;cursor:pointer;font-family:inherit;margin-left:5px}
.nope.on{background:#8a8a8a;color:#fff;border-color:#8a8a8a}
/* 動画・noteカードの👍👎は情報行の右端に置く（タイトルを避けさせない） */
.fvote{margin-left:auto;white-space:nowrap;display:inline-flex;gap:2px}
.fvote .fav,.fvote .nope{padding:2px 8px;font-size:12px;margin:0}
/* 別端末から取り込んだときのお知らせ（画面下に出す） */
#syncnote{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:60;
  background:var(--accent);color:#fff;font-size:13px;font-weight:700;
  padding:9px 18px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.22);
  transition:opacity .6s;max-width:92vw;text-align:center}
.fsum2{font-size:12px;color:var(--muted)}
/* 動画・noteの説明文は3行まで（長すぎると一覧が読めない） */
.fsum{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
@media(max-width:600px){
  .grid{grid-template-columns:1fr} .newsrow{flex-wrap:wrap}
  /* スマホの上部バーを薄くする（画面の高さを本文に回す） */
  h1{font-size:16px}
  .sub{display:none}                      /* 長い方は隠す */
  .sub-short{display:block;flex:0 0 100%;font-size:10.5px;line-height:1.4;margin-top:-2px}
  .btxt{display:none}                     /* ボタンは絵文字だけにする */
  .themebtn{margin-left:6px;padding:4px 8px;font-size:12px;line-height:1}
  /* タブは折り返さず横スクロールにする（縦書きになるのを防ぐ） */
  .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap;flex:0 0 auto;font-size:12.5px;padding:7px 9px}
  .top{padding:8px 0 4px;gap:6px;align-items:center}
  .toolbar{padding:10px 0 4px}
  .pills{padding:6px 0 10px}
  .big h3{font-size:14.5px}
  .fsum{-webkit-line-clamp:2}
}
</style>
</head>
<body>
<header>
 <div class="wrap">
  <div class="top">
    <h1>AI<span>コツ</span>図鑑</h1>
    <div class="sub" id="stamp"></div>
    <button class="themebtn" id="likeSend" style="margin-left:auto" title="押した内容をGitHub経由でClaudeに送ります（送信を押すだけ）">📮<span class="btxt"> Claudeに送る</span></button>
    <button class="themebtn" id="likeExport" title="コピーして自分で貼りたいとき">👍<span class="btxt"> コピー</span></button>
    <button class="themebtn" id="theme">◐<span class="btxt"> 表示</span></button>
    <div class="sub sub-short" id="stampShort"></div>
  </div>
  <div class="tabs">
    <button class="tab on" data-view="home">🏠 今日</button>
    <button class="tab" data-view="cast">🎧 今日の10分</button>
    <button class="tab" data-view="tips">💡 コツ</button>
    <button class="tab" data-view="feed">🎥 動画・note</button>
    <button class="tab" data-view="news">📰 ニュース</button>
  </div>
 </div>
</header>
<button class="totop" id="totop" title="上に戻る">↑</button>
<main class="wrap">
  <div class="toolbar">
    <input type="search" id="q" placeholder="キーワードで探す（例：Excel、提案書、要約）">
  </div>
  <div class="pills" id="aipills"></div>
  <div id="filterhead"></div>
  <div id="filterwrap" class="fwrap">
  <div class="pills" id="filterpills"></div>
  <div id="axpills"></div>
  <div class="pills" id="tagpills"></div>
  <div class="pills" id="authorpills"></div>
  </div>
  <div class="hint" id="hint"></div>
  <div id="body"></div>
</main>
<script>

：グラフ作成と傾向の説明を同時に頼む"], "prompt": "このスレッドを要約し、\n(1) 決まったこと (2) まだ決まっていないこと (3) 私がやるべきこと\nの3つに分けて箇条書きにしてください。\nそのうえで、返信の下書きを「丁寧」「簡潔」「断りたい場合」の3パターン作ってください。", "tags": ["メール", "時短", "会議"], "level": "初級", "source": {"title": "Copilotのおすすめ使い方10選【2026年版】", "url": "https://1onepiece.jp/column/copilot-osusume-usage/"}, "added": "2026-09-22", "verified": "出典あり", "origin": "Claude", "use": "提案用", "axes": {"kind": "考え方", "effect": "時間が減る", "effort": "すぐ試せる", "depth": "考え方だけ", "scene": "全般"}}, {"id": "other-001", "ai": "その他", "title": "NotebookLM：社内資料だけを根拠に答えさせる", "summary": "手持ちのPDFや議事録を放り込むと、その中だけを根拠に答える。ハルシネーションが激減する。", "why": "ネット検索を混ぜないぶん、社内向けの正確な回答に向く。音声解説も生成できる。", "steps": ["NotebookLM にPDF・スライド・議事録をアップ", "『この資料の範囲だけで答えて』と指示", "出典としてどのページを見たかが必ず表示される", "⚠️ただし『ゼロ』ではない。特許情報だけを指定したのに本質を見落とし、ミスリードする主張をした実例も報告されている（@IPL_Compass）", "→ 出典ページが必ず表示されるので、**重要な判断に使う箇所は必ず元ページを開いて確認する**"], "prompt": null, "tags": ["社内資料", "リサーチ"], "level": "初級", "source": {"title": "NotebookLMはハルシネーションが少ない／社内情報でRAGを構築（X・複数の報告）", "url": "https://x.com/tetumemo/status/2016089548993003633"}, "added": "2026-09-22", "verified": "出典あり（※ただし下記の注意を参照）", "origin": "Claude", "use": "両方", "axes": {"kind": "操作手順", "effect": "事故を防ぐ", "effort": "すぐ試せる", "depth": "手順つき", "scene": "調べもの"}}, {"id": "other-002", "ai": "その他", "title": "AIに聞く前に「何を判断したいのか」を1行書く", "summary": "道具が何であれ、効果の8割はここで決まる。全AI共通の土台。", "why": "『まとめて』『考えて』は判断基準がないため、AIは平均的な答えを返す。判断したいことが決まれば、答えは自動的に尖る。", "steps": ["依頼文の冒頭に『私はこれから{何}を判断したい』と書く", "そのために必要な情報だけ出すよう指示する", "『判断に不要な情報は書かないで』と足す", "型で覚えるなら RODES：役割(Role)・目的(Objective)・詳細(Details)・例(Examples)・形式(Style)"], "prompt": "私はこれから{発注先を1社に絞る}という判断をします。\nその判断に必要な情報だけを出してください。\n判断に関係しない一般論や前置きは書かないでください。\n最後に「あなたならどちらを選ぶか」と理由を1つに絞って述べてください。", "tags": ["プロンプト", "全AI共通"], "level": "初級", "source": {"title": "AIの回答に不満がある9割は『聞き方』の問題。条件が抜けているだけ（X）", "url": "https://x.com/asahi_ai_x/status/2044157611684319582"}, "added": "2026-09-22", "verified": "出典あり", "origin": "Claude", "use": "両方", "axes": {"kind": "考え方", "effect": "質が上がる", "effort": "すぐ試せる", "depth": "考え方だけ", "scene": "全般"}}, {"id": "claude-004", "ai": "Claude", "origin": "X", "title": "CLAUDE.mdは「自己紹介」でなく「永続契約」を書く場所", "summary": "毎回「これはやらないで」と言う代わりに、契約として1回書く。そのプロジェクトではその癖が二度と出なくなる。", "why": "多くの人がCLAUDE.mdに「このプロジェクトは○○です」という自己紹介しか書いていない。本来は挙動そのものを変える道具。", "steps": ["毎回言っている注意を思い出す（例：勝手に上書きしないで）", "それを禁止事項として書く", "「〜してほしい」でなく「〜する」と言い切りの形で書く"], "prompt": "## やってはいけないこと\n- 既存ファイルを上書き保存しない。必ず新しい版として保存する\n- 指示していない箇所を変更しない。気づいた点は提案だけする\n- 推測で答えない。確認していないことは「未確認」と明記する\n\n## 必ずやること\n- 作業前に「何を・なぜ」を1行で説明する\n- 専門用語は使わない", "tags": ["設定", "MDファイル", "品質アップ"], "level": "中級", "source": {"title": "【完全版】Claude Codeの性能を10倍引き上げるCLAUDE.md（@ClaudeCode_UT）", "url": "https://x.com/ClaudeCode_UT/article/2054691480728674326"}, "added": "2026-09-22", "verified": "出典あり", "use": "自分用", "axes": {"kind": "考え方", "effect": "質が上がる", "effort": "少し準備", "depth": "手順つき", "scene": "環境づくり"}}, {"id": "claude-005", "ai": "Claude", "origin": "X", "title": "CLAUDE.mdは上書きされず「連結」される", "summary": "ルートから起動した場所まで、通り道にあるCLAUDE.mdが全部つながって読み込まれる。最後に読まれるのが起動地点のもの。", "why": "これを知らないと「なぜかルールが効かない／余計なルールが効く」が起きる。階層設計の大前提。", "steps": ["ルートのCLAUDE.mdには全体共通のルールだけ書く", "案件フォルダのCLAUDE.mdにはその案件固有のルールを書く", "矛盾する内容を書かない（後に読まれるほうが強い）"], "prompt": null, "tags": ["設定", "MDファイル", "つまずき対策"], "level": "上級", "source": {"title": "Claude Codeの性能を決めていたのは、プロンプトじゃなくフォルダ階層でした（@masahirochaen）", "url": "https://x.com/masahirochaen/article/2089544100693545408"}, "added": "2026-09-22", "verified": "出典あり", "use": "自分用", "axes": {"kind": "設定・仕組み", "effect": "事故を防ぐ", "effort": "少し準備", "depth": "考え方だけ", "scene": "環境づくり"}}, {"id": "claude-006", "ai": "Claude", "origin": "X", "title": "どのフォルダで開くかで、そのセッションの人格が決まる", "summary": "Claude Codeは起動したフォルダの中が世界のすべて。フォルダ選びが性能を決める。", "why": "プロンプトを工夫するより、正しいフォルダで開くほうが効果が大きい場面が多い。", "steps": ["案件ごとに専用フォルダを作る", "その中にCLAUDE.mdと資料を置く", "作業はそのフォルダで開いて始める"], "prompt": null, "tags": ["設定", "つまずき対策"], "level": "初級", "source": {"title": "Claude Codeを賢くしたのは、プロンプトではなくフォルダでし AIチャンネル）", "url": "https://www.youtube.com/watch?v=BORAq995Ye4"}, "added": "2026-09-22", "verified": "動画の目次から要約（詳細は動画で確認）", "use": "自分用", "axes": {"kind": "設定・仕組み", "effect": "時間が減る", "effort": "仕組みを作る", "depth": "手順つき", "scene": "環境づくり"}}, {"id": "gpt-005", "ai": "ChatGPT", "origin": "X", "title": "「今の回答を60点として、100点に書き直して」", "summary": "一度出させてから、自分で採点し直させる。ひと言足すだけで質が変わる。", "why": "AIは最初の回答で手を抜くことがある。基準点を与えると、自分で足りない部分を探しに行く。", "steps": ["普通に回答させる", "「今の回答を60点として、100点にするには何が足りないか挙げて」", "「ではその通りに書き直して」"], "prompt": "今の回答を60点とします。\n100点にするために足りないものを5つ挙げてください。\nそのうえで、100点の版に書き直してください。", "tags": ["プロンプト", "品質アップ"], "level": "初級", "source": {"title": "ChatGPTの最強プロンプトフレーズが話題、回答の質が激変（X）", "url": "https://x.com/i/trending/2081571225654952434"}, "added": "2026-09-22", "verified": "出典あり", "use": "両方", "axes": {"kind": "頼み方", "effect": "質が上がる", "effort": "すぐ試せる", "depth": "手順つき", "scene": "全般"}}, {"id": "gpt-006", "ai": "ChatGPT", "origin": "X", "title": "人格を固定してから質問する", "summary": "質問の前に「あなたは誰で、どう振る舞うか」を固定する。同じ質問でも回答の深さが変わる。", "why": "人格を決めないと、AIは当たり障りのない平均的な答えを返す。役割を固定すると判断が尖る。", "steps": ["役割・経験年数・立場を指定する", "話し方と禁止事項を決める", "そのうえで質問する"], "prompt": "あなたは{業界}で{15}年の実務経験を持つ{職種}です。\n- 一般論や教科書的な説明はしない。現場で実際に使える話だけをする\n- 私の意見に無条件で賛成しない。危ういと思ったら必ず指摘する\n- 結論を先に言い、理由は3つまでに絞る\n\nこの人格を維持したまま、以下に答えてください。\n{質問}", "tags": ["プロンプト", "品質アップ"], "level": "初級", "source": {"title": "人格固定プロンプト（@ai_jitan）", "url": "https://x.com/ai_jitan/status/2016162566104662138"}, "added": "2026-09-22", "verified": "出典あり", "use": "両方", "axes": {"kind": "頼み方", "effect": "質が上がる", "effort": "すぐ試せる", "depth": "手順つき", "scene": "全般"}}, {"id": "gpt-007", "ai": "ChatGPT", "origin": "X", "title": "イエスマンをやめさせる一文を足す", "summary": "「疑問を持ち、より良い代替案を出して」と指示する。同意しかしないAIが相談相手になる。", "why": "AIは基本的に肯定してくる。そのまま使うと、自分の思い込みが補強されるだけで終わる。", "steps": ["依頼の最後に反論を求める一文を足す", "出てきた反論のうち、納得できるものだけ採用する"], "prompt": "この案について、まず賛成意見は書かないでください。\n\n1. この案が失敗するとしたら、原因は何か（3つ）\n2. 私が見落としている前提は何か\n3. もっと良い代替案があるなら、その案と理由\n\nを先に述べてください。そのうえで、最終的にどうすべ と思われがちだが、関係が書かれていないとAIは推測で埋める＝そこが間違いの発生源になる。", "steps": ["「AはBの一種」「XはYを担当する」のような関係を文章で書き出す", "それをCLAUDE.mdや参照ファイルに置く", "単に資料を追加するのをやめ、関係の記述を優先する"], "prompt": "## 関係の定義\n- {顧客A} は {製造業} に属する\n- {提案書} は {顧客A} に対して作る\n- {見積書} は {提案書} の後に作る\n- {山田さん} は {顧客A} の {決裁者} である\n\n上の関係を前提として作業してください。関係が書かれていない事柄については、推測せず私に質問してください。", "tags": ["設定", "MDファイル", "品質アップ"], "level": "上級", "source": {"title": "オントロジーでClaudeの性能を上げよう(1)（Claude Code Lab note）", "url": "https://note.com/claudecode_lab/n/nab7c1119fb2e"}, "added": "2026-09-22", "verified": "出典あり（本文を読んで要約）", "use": "自分用", "axes": {"kind": "考え方", "effect": "質が上がる", "effort": "少し準備", "depth": "考え方だけ", "scene": "調べもの"}}, {"id": "copilot-006", "ai": "Copilot", "origin": "YouTube", "title": "プロが毎日使っているCopilotの定番プロンプト10種", "summary": "何に使えばいいか分からない人向けの「型」。この10個から始めれば外さない。", "why": "Copilotは用途が広すぎて手が止まる。実務で毎日回っている型を先に知るのが近道。", "steps": ["① プロンプトを書くプロンプト（指示文自体をCopilotに作らせる）", "② タスク整理", "③ 報告資料の続きを書かせる", "④ 写真をExcelの表に変える", "⑤ Excelにカスタム指示を持たせる", "⑥ Excelファイルの引き継ぎ資料を作らせる", "⑦ 確認プロンプト（抜け漏れチェック）", "⑧ 相見積もりの比較", "⑨ パワポのテンプレートを覚えさせる", "⑩ Wordの文書の型を作らせる"], "prompt": "これからあなたに{やってほしいこと}を頼みます。\nまず、その依頼を最も良い結果にするための「指示文」をあなたが書いてください。\n私はその指示文を確認してから、改めてお願いします。", "tags": ["Excel", "PowerPoint", "時短"], "level": "初級", "source": {"title": "【使わないと損】プロが毎日Copilotで仕事を自動化してる神プロンプト10選【 Copilot  / Excel / （バレないAIの使い方ch）", "url": "https://www.youtube.com/watch?v=xtMLtyP_I68"}, "added": "2026-09-22", "verified": "動画の目次から要約（詳細は動画で確認）", "use": "提案用", "axes": {"kind": "頼み方", "effect": "時間が減る", "effort": "すぐ試せる", "depth": "手順つき", "scene": "全般"}}, {"id": "other-006", "ai": "その他", "origin": "YouTube", "title": "MCPを入れると、AIが自分のパソコンを直接さわれるようになる", "summary": "ファイル・ブラウザ・画像や動画・他のAI呼び出しまで、AIの手が届く範囲が広がる仕組み。", "why": "「AIは文章を返すだけ」という前提が変わる。人気はGitHub・Notion・Slack連携。", "steps": ["よく使うサービスのMCPを入れる（Notion・Slack・カレンダーなど）", "まずは手元のファイル操作から試す", "慣れたらブラウザ操作・画像や動画に広げる", "入れすぎると重くなるので、使うものだけ有効にする"], "prompt": null, "tags": ["自動化", "設定"], "level": "中級", "source": {"title": "MCPサーバー5つを実演｜Claude Codeでの使い方解説（AI market）", "url": "https://www.youtube.com/watch?v=aoLBVOTdALg"}, "added": "2026-09-22", "verified": "動画の目次から要約（詳細は動画で確認）", "use": "両方", "axes": {"kind": "設定・仕組み", "effect": "発想が広がる", "effort": "仕組みを作る", "depth": "考え方だけ", "scene": "環境づくり"}}, {"id": "claude-012", "ai": "Claude", "origin": "YouTube", "title": "「AI社員」を作って役割ごとに仕事を任せる", "summary": "経営方針とルールを書いた担当AIを複数作り、集客・問い合わせ対応などを分担させる考え方。", "why": "1つのAIに全部やらせるより、役割と守るべきルールを持たせたほうが安定する。人を増やすより安い、という発想。", "steps": ["まず「経営方針」にあたる前提を書く", "守ってほしいルールを明文化する", "役割ごとに担当AIを作る", "定型作業はルーチンとして登録する"], "prompt": null, "tags": ["自動化", "設定"], "level": "上級", "source": {"title": "【実演】AI初心者でも作れる！Claude Codeで「AI社長→AI社員→自動化」をゼロから作る方法（Claudeを使えば苦労しない | フィアナ）", "url": "https://www.youtube.com/watch?v=HE0kHYZvH0c"}, "added": "2026-09-22", "verified": "動画の目次から要約（詳細は動画で確認）", "use": "自分用", "axes": {"kind": "設定・仕組み", "effect": "発想が広がる", "effort": "仕組みを作る", "depth": "考え方だけ", "scene": "環境づくり"}}, {"id": "gemini-006", "ai": "Gemini", "origin": "note", "title": "会社のGeminiとChrome拡張で「自分専用エージェント」を作る", "summary": "高機能な有料エージェントを使わなくても、手元の組み合わせで似たことができるという実験記事。", "why": "会社の制約で新しいツールを入れられない人向けの現実解。既にあるものだけで組む。", "steps": ["会社で許可されているGeminiを使う", "Chrome拡張と組み合わせる", "自分の業務に合わせて役割を固定する"], "prompt": null, "tags": ["設定", "時短"], "level": "中級", "source": {"title": "会社のGeminiとChrome拡張で「自分専用エージェント」を作ってみた話──Gemini Sparkの再現実験と、配（まじん（note））", "url": "https://note.com/majin_108/n/n464fb6cabfe4"}, "added": "2026-09-22", "verified": "記事タイトル・冒頭から要約（詳細は記事で確認）", "use": "自分用", "axes": {"kind": "設定・仕組み", "effect": "発想が広がる", "effort": "仕組みを作る", "depth": "考え方だけ", "scene": "環境づくり"}}, {"id": "other-007", "ai": "その他", "origin": "X", "title": "資料の「AIっぽさ」の正体は3つだけ", "summary": "色の使いすぎ・同じ形の箱を機械的に並べる・同じ情報をあちこちに重複させる。これを潰せば一気に人間の資料になる。", "why": "AIで作った資料が安っぽく見える理由が言語化されている。提案書をそのまま出すと確実に見抜かれる。", "steps": ["色を減らす（基本はモノクロ＋アクセント1色）", "同じ形の箱を等間隔に並べるのをやめる。情報の重みで大きさを変える", "同じ内容が2か所に出ていないか確認して片方を消す", "文字は1枚あたり要素3〜5個、テキストは短く"], "prompt": "この資料を「AIが作ったように見える」観点で点検してください。\n\n1. 色を使いすぎている箇所\n2. 同じ形の箱を機械的に並べている箇所\n3. 同じ情報が複数の場所で重複している箇所\n\nを指摘し、それぞれどう直すべきか1行で示してください。", "tags": ["資料作成", "品質アップ", "営業"], "level": "中級", "source": {"title": "「AIっぽい」を卒業する、シンプルテイストのスライドデザインプロンプト（@fujikururi）", "url": "https://x.com/fujikururi/article/2087461428852838623"}, "added": "2026-09-22", "verified": "出典あり", "use": "両方", "axes": {"kind": "考え方", "effect": "質が上がる", "effort": "すぐ試せる", "depth": "手順つき", "scene": "提案書"}}, {"id": "other-008", "ai": "その他", "origin": "X", "title": "提案書は「課題・現状・打ち手」の3列で組む", "summary": "論理を1行で完結させる3列の表（論証テーブル）が提案書の中心。長い資料には中扉を入れて読み手の脳をリセットする。", "why": "コンサル資料の型を分解した結果、この3列が資料の半分近くを占めていた。型を知れば毎回ゼロから悩まない。", "steps": ["課題 / 現状 / 打ち手 の3列表を作る", "1行で論理が閉じるように書く", "10ページを超える資料には、セクション名だけの中扉を挟む"], "prompt": "以下の内容を「課題・現状・打ち手」の3列の表に整理してください。\n各行は、その1行だけを読んで論理が通るように書いてください。\n（課題＝何が問題か／現状＝いま何が起きているか／打ち手＝何をするか）\n\n{整理したい内容}", "tags": ["資料作成", "営業"], "level": "中級", "source": {"title": "コンサル資料は7パターンで完成｜AI再現プロンプト完全ガイド（@Maruo_0314）", "url": "https://x.com/Maruo_0314/article/2078103252579807320"}, "added": "2026-09-22", "verified": "出典あり", "use": "両方", "axes": {"kind": "考え方", "effect": "質が上がる", "effort": "少し準備", "depth": "手順つき", "scene": "提案書"}}, {"id": "other-009", "ai": "その他", "origin": "X", "title": "議事録の自動化は4段階に分けて考える", "summary": "①文字起こし ②議事録作成 ③保管場所へ格納 ④次のアクション（メール下書きなど）。ツールは何でもいい。", "why": "「議事録AIを入れたのに楽にならない」のは、②で止まっているから。④まで繋げて初めて時間が浮く。", "steps": ["会議を自動で文字起こしする", "決定事項・宿題・担当の形に整える", "決まった場所（Notionやドライブ）に自動で貯める", "お礼メールの下書きまで自動で作らせ、人は送信ボタンだけ押す"], "prompt": "この文字起こしから議事録を作ってください。\n\n【議事録】\n1. 決まったこと\n2. 決まらなかったこと（次回持ち越し）\n3. 宿題（担当者と期限つき）\n\n【そのあと】\n参加者へのお礼メールの下書きも作ってください。\n前置きは短く、決定事項と次回日程だけ触れてください。", "tags": ["会議", "メール", "時短"], "level": "初級", "source": {"title": "議事録自動化のベストプラクティス（@masahirochaen）", "url": "https://x.com/masahirochaen/status/2035953738159186107"}, "added": "2026-09-22", "verified": "出典あり", "use": "両方", "axes": {"kind": "考え方", "effect": "時間が減る", "effort": "少し準備", "depth": "考え方だけ", "scene": "会議・議事録"}}, {"id": "claude-013", "ai": "Claude", "origin": "X", "title": "Skillを作るときの4原則", "summary": "責務は1つに絞る／descriptionは「何をする＋いつ使う＋主な機能」／SKILL.mdは500行以内／詳細は別ファイルに逃がす。", "why": "何でもできるSkillを作ると呼び出されなくなる。descriptionが呼び出しの判定に使われるので、ここが一番大事。", "steps": ["1つのSkillに1つの役割だけ持たせる", "descriptionに「いつ使うか」を具体的に書く（ここで呼ばれるかが決まる）", "SKILL.mdは500行以内に収める", "長い手順や資料は reference.md など別ファイルに分け、必要な時だけ読ませる"], "prompt": "---\nname: {スキル名}\ndescription: {何をするか}。{どういう依頼のときに使うか（具体的な言い回しを列挙）}。{主な機能}。\n---\n\n# {スキル名}\n\n## 手順\n1. \n2. \n\n## 詳細\n詳しい仕様は references/detail.md を参照すること（必要になった時だけ読む）", "tags": ["MDファイル", "設定"], "level": "上級", "source": {"title": "Claude Code Skillsを体系的にまとめた記事（@yusaku_0426）", "url": "https://x.com/yusaku_0426/status/2045831777806372950"}, "added": "2026-09-22", "verified": "出典あり", "use": "自分用", "axes": {"kind": "設定・仕組み", "effect": "質が上がる", "effort": "仕組みを作る", "depth": "手順つき", "scene": "環境づくり"}}, {"id": "claude-014", "ai": "Claude", "origin": "X", "title": "SKILL.mdを自分で書けないなら「skill-creator」に作らせる", "summary": "公式の「スキルを作るためのスキル」。対話しながら中身を作ってくれる。", "why": "書式を覚える必要がない。最初の1個をこれで作れば、2個目から自分で書けるようになる。", "steps": ["skill-creator を呼び出す", "作りたい作業を日本語で説明する", "質問に答えるとSKILL.mdができる"], "prompt": "skill-creator を使って、{毎週の営業報告をまとめる}作業をスキルにしてください。\n私は非エンジニアなので、専門用語を使わずに質問してください。", "tags": ["MDファイル", "設定", "時短"], "level": "中級", "source": {"title": "9割の人が知らない「Claude Skills」を全部まとめた（@makeai_ceo）", "url": "https://x.com/makeai_ceo/status/2035564899338973373"}, "added": "2026-09-22", "verified": "出典あり", "use": "自分用", "axes": {"kind": "操作手順", "effect": "時間が減る", "effort": "少し準備", "depth": "手順つき", "scene": "環境づくり"}}, {"id": "other-010", "ai": "その他", "origin": "X", "title": "3つのAIの使い分け（2026年版のざっくり結論）", "summary": "文章を書く・大量の資料を読む＝Claude／調べ物のレポート化＝GeminiのDeep Research／情報収集と要約＝ChatGPT。", "why": "「どれが一番いいか」は最新モデルが出るたび入れ替わる。用途で分けるほうが現実的。", "steps": ["長文を書く・細かい指示を守らせる → Claude", "数百サイトを調べてレポートにする → Gemini（Deep Research）", "GmailやドライブとつなぐならGemini、道具を横断して実行させるならClaude", "迷ったら、自分が一番使い慣れているものでよい"], "prompt": null, "tags": ["全AI共通", "リサーチ"], "level": "初級", "source": {"title": "で、結局Claude・Gemini・ChatGPT、どれがいいの？（@mercarioji）", "url": "https://x.com/mercarioji/article/2026948253183516686"}, "added": "2026-09-22", "verified": "出典あり", "use": "両方", "axes": {"kind": "考え方", "effect": "質が上がる", "effort": "すぐ試せる", "depth": "考え方だけ", "scene": "全般"}}, {"id": "claude-015", "ai": "Claude", "origin": "note", "title": "構造を「知識グラフ」に登録するとコスト26%減・応答29%短縮", "summary": "ファイルを探し回る動きが消え、関係を辿るだけになる。同じ作業での実測値。", "why": "速くなる・安くなる・ブレが減る、が同時に起きる。全体を俯瞰する質問（どこが詰まるか等）にも強くなる。", "steps": ["記憶用のMCPを追加する（※下の注意を参照）", "「このプロジェクトを読んで、構造を知識グラフとして登録して」と頼む", "要素の種類・つながりの名前・1行の説明をセットで書かせる", "以降は毎回そのグラフを見て動くようになる"], "prompt": "このプロジェクトを読んで、構造を知識グラフとして memory に登録してください。\n- 登場する要素には種類を付ける\n- つながりには「何をする関係か」を示す名前を付ける\n- 各要素の役割を1行の説明として添える", "tags": ["節約", "設定", "品質アップ"], "level": "上級", "source": {"title": "オントロジーでClaudeの性能を上げよう(2)：コスト26%減・応答29%短縮を実測（Claude Code Lab note）", "url": "https://note.com/claudecode_lab/n/n4de40aedf1a8"}, "added": "2026-09-22", "verified": "出典あり（本文を読んで要約）／⚠️注意：元記事の導入手順は npx を使います。npx は未インストールの部品をその場で実行する仕組みなので、導入前に安全性の確認を", "use": "自分用", "axes": {"kind": "設定・仕組み", "effect": "枠を節約", "effort": "仕組みを作る", "depth": "手順つき", "scene": "環境づくり"}}, {"id": "claude-016", "ai": "Claude", "origin": "note", "title": "関係の呼び名は「型」を決めて固定する", "summary": "つながりの名前がバラバラだと効果が出ない。使う言葉をあらかじめ5つ程度に限定する。", "why": "同じ関係を毎回違う言葉で書くと、AIが別物だと判断してしまう。名前を固定するだけで精度が変わる。", "steps": ["使う関係語をあらかじめ決める（例：使う／依存する／所有する／設定する／呼び出す）", "その一覧をCLAUDE.mdに書く", "新しい関係語を勝手に増やさせない"], "prompt": "関係の型は次の中から必ず選んでください。新しい語を作らないでください。\n- calls（呼び出す）\n- depends-on（依存する）\n- owns（所有する）\n- configures（設定する）\n- uses（使う）", "tags": ["設定", "MDファイル", "品質アップ"], "level": "上級", "source": {"title": "オントロジーでClaudeの性能を上げよう(2)（Claude Code Lab note）", "url": "https://note.com/claudecode_lab/n/n4de40aedf1a8"}, "added": "2026-09-22", "verified": "出典あり（本文を読んで要約）", "use": "自分用", "axes": {"kind": "設定・仕組み", "effect": "質が上がる", "effort": "仕組みを作る", "depth": "手順つき", "scene": "環境づくり"}}, {"id": "other-011", "ai": "その他", "origin": "note", "title": "事務仕事こそ「規程と承認ルート」をAIに持たせると効く", "summary": "社内規程・承認ルート・書類の関係を書いておくと、「180万円なら取締役会の稟議」のような判定が即答になる。", "why": "規程を毎回確認する時間が消える。改定時の影響範囲も逆引きできるので、漏れがなくなる。", "steps": ["規程・申請・承認者・書類の関係を書き出す", "「AとBは同時に使えない」のような排他関係も明記する", "属人化している経験則（この人は金曜は外出が多い等）も書いておく", "改定時は「これが変わると何が影響するか」を聞く"], "prompt": "次の社内ルールを前提にしてください。\n\n- {出張申請} は {金額} によって承認者が変わる\n  - 50万円未満 → {部長}\n  - 50万〜180万円 → {本部長}\n  - 180万円以上 → {取締役会の稟議}\n- {在宅勤務手当} と {通勤定期代} は同時に支給できない\n\nこのうえで、次の申請に必要な書類と承認ルートを教えてください。\n{申請の内容}", "tags": ["社内資料", "時短"], "level": "中級", "source": {"title": "オントロジーでClaudeの性能を上げよう(4)：事務職編（Claude Code Lab note）", "url": "https://note.com/claudecode_lab/n/n58abee2e1feb"}, "added": "2026-09-22", "verified": "出典あり（本文を読んで要約）", "use": "両方", "axes": {"kind": "設定・仕組み", "effect": "時間が減る", "effort": "仕組みを作る", "depth": "考え方だけ", "scene": "環境づくり"}}, {"id": "claude-017", "ai": "Claude", "origin": "note", "title": "賢いモデルほど「指示を削る」ほうが速くなる", "summary": "旧モデル向けに手厚く書いた手順は、上位モデルではむしろ足を引っ張る。手順を削り、目的と境界線を残す。", "why": "指示を削る方向に書き直したら「速くなり、途中で止まる回数が明確に減った」との報告。今のCLAUDE.mdが重すぎる人は要見直し。", "steps": ["CLAUDE.mdから細かい手順の指定を削る", "代わりに「ゴール（何ができたら完成か）」を明確に書く", "「やってはいけないこと」の境界線は残す", "ただし雑にするのとは違う。目的の記述はむしろ厚くする"], "prompt": "## ゴール\n{これができたら完成}\n\n## やってはいけないこと\n- {境界線}\n\n## 手順\n手順は指定しません。上のゴールを満たす方法はあなたが判断してください。\nただし、進める前に方針を3行で説明してください。", "tags": ["設定", "MDファイル", "品質アップ"], "level": "中級", "source": {"title": "Codexがこの1週間で別物に。GPT-6 Astra時代の最適化術（チャエン note）", "url": "https://note.com/chaen_channel/n/nab103088ebef"}, "added": "2026-09-22", "verified": "出典あり（無料部分を読んで要約。詳細は有料部分）", "use": "自分用", "axes": {"kind": "考え方", "effect": "質が上がる", "effort": "少し準備", "depth": "考え方だけ", "scene": "環境づくり"}}, {"id": "claude-018", "ai": "Claude", "origin": "note", "title": "これからは「プロンプト」より「環境の設計」", "summary": "どのファイルに方針を書くか・権限をどこまで渡すか・何を禁止するか・外部と何をつなぐか。この4つの設計が効く。", "why": "指示文をいくら磨いても、環境が整っていなければ結果は安定しない。関心の移りどころが変わってきている。", "steps": ["方針をどのファイルに書くか決める（CLAUDE.md / SKILL.md / 参照ファイル）", "どこまで自分で判断させるかを決める", "禁止事項を明文化する", "外部サービスとの接続は必要なものだけに絞る"], "prompt": null, "tags": ["設定", "MDファイル"], "level": "上級", "source": {"title": "GPT-6 Astra時代の最適化術（チャエン note）", "url": "https://note.com/chaen_channel/n/nab103088ebef"}, "added": "2026-09-22", "verified": "出典あり（無料部分を読んで要約）", "use": "自分用", "axes": {"kind": "考え方", "effect": "質が上がる", "effort": "仕組みを作る", "depth": "考え方だけ", "scene": "環境づくり"}}, {"id": "claude-019", "ai": "Claude", "origin": "X", "title": "メモ帳とつないで「第二の脳」にする（3つの操作だけ覚える）", "summary": "取り込む(Ingest)・横断して聞く(Query)・矛盾を指摘させる(Lint)。この3つでメモが資産になる。", "why": "メモは貯めるだけでは死蔵する。AIが横断して読み、古い記述や矛盾まで指摘してくれると、初めて生きた資料になる。", "steps": ["メモをテキスト（マークダウン）で1か所に貯める", "取り込む：新しいメモを整理して所定の場所に入れさせる", "横断して聞く：出典つきで答えさせる", "点検させる：矛盾している記述・古くなった記述を指摘させる"], "prompt": "私のメモ全体を読んで、次の3つをやってください。\n\n1. 【横断】「{知りたいこと}」について、どのメモに何が書いてあるか出典つきで答える\n2. 【矛盾】互いに食い違っている記述があれば指摘する\n3. 【劣化】明らかに古くなっている記述を挙げ、どう直すべきか提案する\n\n勝手に書き換えないでください。指摘と提案だけにしてください。", "tags": ["社内資料", "リサーチ", "品質アップ"], "level": "中級", "source": {"title": "Obsidian×Claudeで「第二の脳」を作る方法（@SuguruKun_ai）", "url": "https://x.com/SuguruKun_ai/article/2077582634340016400"}, "added": "2026-09-22", "verified": "出典あり", "use": "自分用", "axes": {"kind": "設定・仕組み", "effect": "発想が広がる", "effort": "仕組みを作る", "depth": "手順つき", "scene": "調べもの"}}, {"id": "claude-020", "ai": "Claude", "origin": "X", "title": "依頼は「置き場所」に投げ込むだけにする", "summary": "依頼用フォルダにファイルを置くと、AIが読んで結果を別フォルダに返す。指示を打つ手間が消える。", "why": "毎回チャットで説明するより、決まった場所にお題を置くほうが速い。溜まっても順番に処理できる。", "steps": ["「依頼」フォルダと「完成」フォルダを作る", "依頼したいことを1件1ファイルで置く（ファイル名に内容を書く）", "AIには「依頼フォルダを見て、順に処理して完成フォルダに出す」と伝える"], "prompt": "{依頼}フォルダの中を確認してください。\n未処理のファイルがあれば、古い順に1件ずつ処理し、\n結果を{完成}フォルダに同じ名前で保存してください。\n処理が終わったファイルは、先頭に「済」と付けてください。\n判断に迷ったら実行せず、私に質問してください。", "tags": ["自動化", "時短"], "level": "上級", "source": {"title": "ObsidianをClaude CodeとCodexにつなぐ方法（@dansyu_callenge）", "url": "https://x.com/dansyu_callenge/article/2052504525433700706"}, "added": "2026-09-22", "verified": "出典あり", "use": "自分用", "axes": {"kind": "設定・仕組み", "effect": icrosoft 365 公式）", "url": "https://x.com/MSOfficeJP/status/2010992717824717141"}, "added": "2026-09-22", "verified": "出典あり", "use": "提案用", "axes": {"kind": "頼み方", "effect": "時間が減る", "effort": "すぐ試せる", "depth": "手順つき", "scene": "会議・議事録"}}, {"id": "copilot-008", "ai": "Copilot", "origin": "X", "title": "英語の会議を、日本語の議事録にして受け取る", "summary": "Teams会議の議事録は言語を指定できる。英語の会議に出ても、日本語でまとめが残る。", "why": "聞き取りに集中しなくてよくなる。海外とのやりとりがある人には効果が大きい。", "steps": ["Teams会議でCopilotを有効にする", "終了後に日本語で要約するよう指示する", "決定事項と自分の宿題だけ抜き出させる"], "prompt": "この会議の内容を日本語で要約してください。\n\n1. 決まったこと\n2. 保留になったこと\n3. 私（{自分の名前}）がやるべきこと（期限つき）\n\n専門用語は日本語に訳し、必要なら英語も併記してください。", "tags": ["会議", "時短"], "level": "初級", "source": {"title": "Teams で Copilot を活用しましょう（Microsoft 365 公式）", "url": "https://x.com/MSOfficeJP/status/1866037571274322256"}, "added": "2026-09-22", "verified": "出典あり", "use": "提案用", "axes": {"kind": "操作手順", "effect": "時間が減る", "effort": "すぐ試せる", "depth": "手順つき", "scene": "会議・議事録"}}, {"id": "copilot-009", "ai": "Copilot", "origin": "note", "title": "Copilotを入れる前に「フォルダ整理」をやめてメタデータに移る", "summary": "フォルダ階層だけでは、AIは書類の意味を理解できない。会社名・書類種別・年度などを属性として付ける。", "why": "Copilotが「使えない」と言われる会社の多くは、ファイルの置き方が原因。導入前に整えるべき土台の話。", "steps": ["フォルダ階層では複数の属性を表せないと理解する（1つの分類しかできない）", "「会社名」「文書種別」「年度」などを属性として付ける", "Copilotのオートフィル機能で、本文から属性を自動抽出させる", "既存ファイルに後付けするのは大変なので、**新しい置き場から**始める", "属性が揃うと、絞り込みとグループ化で一瞬で探せるようになる"], "prompt": null, "tags": ["社内資料", "つまずき対策", "Excel"], "level": "中級", "source": {"title": "SharePointはファイルサーバーではない？！Copilot時代に求められるファイル管理（ソフクリ note）", "url": "https://note.com/sc_microsoft/n/nc38da4fae12a"}, "added": "2026-09-22", "verified": "出典あり（本文を読んで要約）", "use": "提案用", "axes": {"kind": "考え方", "effect": "質が上がる", "effort": "仕組みを作る", "depth": "考え方だけ", "scene": "環境づくり"}}, {"id": "gemini-010", "ai": "Gemini", "origin": "note", "title": "ドライブの「フォルダ丸ごと」を資料として指定できる", "summary": "ファイルを1つずつ選ばなくていい。案件フォルダや顧客フォルダをそのまま渡せる。", "why": "NotebookLMは1ファイルずつ選ぶ必要があるが、こちらはフォルダ単位。案件ごとの情報集約に向く。", "steps": ["Googleドライブに案件ごとのフォルダを作る", "そのフォルダを丸ごとソースに指定する", "以降、その案件の質問はすべてそのフォルダを根拠に答えさせる"], "prompt": null, "tags": ["社内資料", "時短", "リサーチ"], "level": "初級", "source": {"title": "【組織のAI活用#257】Google WorkspaceでGeminiが使える会社が意外と知らない便利や対策（寺田昇平 note）", "url": "https://note.com/green_ai/n/n31b1999257e9"}, "added": "2026-09-22", "verified": "出典あり（本文を読んで要約）", "use": "自分用", "axes": {"kind": "操作手順", "effect": "時間が減る", "effort": "すぐ試せる", "depth": "手順つき", "scene": "調べもの"}}, {"id": "gemini-011", "ai": "Gemini", "origin": "note", "title": "Deep Researchは「調べる範囲」を絞れる（追加費用なし）", "summary": "特定のサイトだけに限定したり、GmailやGoogleドライブを調査対象にできる。設定変更だけ。", "why": "ネット全体を調べさせると精度が落ちる。範囲を絞るほど、使える答えが返る。", "steps": ["調べる前に対象を指定する（特定サイト／Gmail／ドライブ）", "長いレポートは図解に変換させる", "定期的に必要な調査は、自動で回してドライブに保存させる"], "prompt": "次の範囲だけを調べてください。範囲外の情報は使わないでください。\n\n- 対象：{公式サイトのみ／自社ドライブのみ など}\n- 期間：{直近1年}\n\n結果は、最後に「調べきれなかったこと」も正直に書いてください。", "tags": ["リサーチ", "社内資料"], "level": "中級", "source": {"title": "【組織のAI活用#257】（寺田昇平 note）", "url": "https://note.com/green_ai/n/n31b1999257e9"}, "added": "2026-09-22", "verified": "出典あり（本文を読んで要約）", "use": "自分用", "axes": {"kind": "操作手順", "effect": "質が上がる", "effort": "すぐ試せる", "depth": "手順つき", "scene": "調べもの"}}, {"id": "gemini-012", "ai": "Gemini", "origin": "note", "title": "共有したGemは「一度実行してもらう」まで相手の一覧に出ない", "summary": "配った相手が「見当たりません」と言ってくる原因はこれ。案内文に一言添えるだけで解決する。", "why": "社内にGemを配るときの定番のつまずき。知らないと問い合わせ対応に時間を取られる。", "steps": ["Gemを共有する", "案内文に「リンクを開いて、まず1回実行してください」と書く", "実行後、相手の一覧に表示されるようになる"], "prompt": null, "tags": ["つまずき対策", "社内資料"], "level": "初級", "source": {"title": "【組織のAI活用#257】（寺田昇平 note）", "url": "https://note.com/green_ai/n/n31b1999257e9"}, "added": "2026-09-22", "verified": "出典あり（本文を読んで要約）", "use": "自分用", "axes": {"kind": "操作手順", "effect": "事故を防ぐ", "effort": "すぐ試せる", "depth": "考え方だけ", "scene": "環境づくり"}}, {"id": "claude-022", "ai": "Claude", "origin": "note", "title": "長い会話ほど最初のルールが消える。分割して「その都度」貼り直す", "summary": "会話が進むほど初期の指示が薄れる（コンテキストドリフト）。プロンプトを強くするのでなく、入れ方を変える。", "why": "「最初にちゃんと指示したのに守られない」の正体。長文の仕様書づくりで破綻した実例の報告。", "steps": ["1回の会話で全部やろうとしない。章ごとに分ける", "章を始めるたびに、守ってほしい制約を貼り直す", "資料は1つの長文にせず、複数のファイルに分けて渡す", "点検は全体でなく「章ごとの矛盾チェック」に絞る"], "prompt": "【この章の制約（毎回貼り直すこと）】\n- 読み手：{誰}\n- 分量：{どれくらい}\n- 禁止：{やってはいけないこと}\n- 用語：{統一する呼び方}\n\n上の制約を守って、{第○章}だけを書いてください。\n他の章には触れないでください。", "tags": ["つまずき対策", "品質アップ", "資料作成"], "level": "中級", "source": {"title": "【長文破綻防御】Claude Projectsのコンテキストドリフトを食い止める（アリス｜AI検証ログ note）", "url": "https://note.com/alix78/n/n67a9b7b8e757"}, "added": "2026-09-22", "verified": "出典あり（無料部分を読んで要約。具体的なテンプレートは有料部分）", "use": "自分用", "axes": {"kind": "考え方", "effect": "質が上がる", "effort": "少し準備", "depth": "手順つき", "scene": "環境づくり"}}, {"id": "other-013", "ai": "その他", "origin": "note", "title": "2段組PDFをそのままAIに読ませると、文章が横に繋がって真逆の結論になる", "summary": "左の段の1行目と右の段の1行目を、1つの文としてくっつけて読んでしまう事故（読み順崩壊）。", "why": "読めているように見えて、中身が入れ替わっている。契約書・仕様書・財務資料で起きると致命的。「AIが要約したから大丈夫」が一番危ない。", "steps": ["2段組の論文・ガイドライン、罫線が省略された帳票、ページ下部に注記がある文書は特に危険と知る", "丸投げせず、出てきた要約と元のPDFを1行ずつ突き合わせる", "重要な数字は、必ず元のページ番号を示させて自分の目で確認する", "可能なら、段組を解除したテキストにしてから渡す"], "prompt": "このPDFを読むとき、次を守ってください。\n\n1. 2段組・表・注記がある場合、**どの順番で読んだか**を先に説明する\n2. 要約に使った箇所は、必ずページ番号を添える\n3. 段組やレイアウトが原因で読み順が怪しい箇所があれば、断定せず「ここは読み順が不確かです」と明示する\n\nそのうえで要約してください。", "tags": ["つまずき対策", "リサーチ", "社内資料"], "level": "中級", "source": {"title": "【PDF要約の死角】多段組や帳票をAIに読ませていませんか？（アリス｜AI検証ログ note・2026-09-12）", "url": "https://note.com/alix78/n/ne195f9275717"}, "added": "2026-09-23", "verified": "出典あり（無料部分を読んで要約）", "use": "両方", "axes": {"kind": "失敗回避", "effect": "事故を防ぐ", "effort": "すぐ試せる", "depth": "手順つき", "scene": "調べもの"}}, {"id": "other-014", "ai": "その他", "origin": "note", "title": "資料は「1枚1メッセージ」。事実と判断を持つ完全な文で言い切る", "summary": "見出しを体言止めにせず、「〜なので〜すべき」と言い切った文にする。これだけで資料の質が変わる。", "why": "「売上推移」では何も言っていない。「主力商品の落ち込みが全体を押し下げているため、投資先を切り替えるべき」まで書くと、読み手が判断できる。", "steps": ["1枚に伝えたいことを1つだけ決める", "それを「事実＋判断」の完全な文にする（体言止め禁止）", "図表はその文を支えるためだけに置く", "図表の型は「決めさせる/分解する/比べる/変化を見せる/関係と位置/時間と工程/地図化」の7用途から選ぶ"], "prompt": "このページの見出しを、体言止めをやめて「事実＋判断」の完全な文に書き直してください。\n\n悪い例：「売上推移」「課題の整理」\n良い例：「主力商品の落ち込みが全体を押し下げているため、投資先を切り替えるべき」\n\nそのうえで、その主張を支えるのに最適な図表を、\n決めさせる／分解する／比べる／変化を見せる／関係と位置／時間と工程／地図化\nの7つから1つ選び、理由も述べてください。", "tags": ["資料作成", "営業", "品質アップ"], "level": "中級", "source": {"title": "AIで資料作成を終わらす。コンサル品質を求めて辿り着いた究極プロンプト（note・2026-09-08）", "url": "https://note.com/uchita_success/n/na5babdc58b0e"}, "added": "2026-09-23", "verified": "出典あり（無料部分を読んで要約）", "use": "両方", "axes": {"kind": "考え方", "effect": "質が上がる", "effort": "すぐ試せる", "depth": "手順つき", "scene": "提案書"}}, {"id": "other-015", "ai": "その他", "origin": "note", "title": "自動化は「1業務ずつ・2〜4週間・人が最後に押す」", "summary": "繰り返し頻度が高く、ルールが明確で、失敗を直せる業務を1つだけ選んで試す。複数同時にやらない。", "why": "いきなり全部自動化しようとして失敗する例が多い。目的は「完璧に動かすこと」ではなく「何が自動化でき、どこでエラーが出るか」を知ること。", "steps": ["対象を1つに絞る（日報集計・メール下書きなどが向く）", "既にある道具（Copilot・Gemini）で2〜4週間だけ試す", "AIの出力を100%そのまま使わない。最後に人が確認して実行ボタンを押す", "何が自動化できて、どのエラーが出たかを記録する"], "prompt": null, "tags": ["自動化", "社内資料"], "level": "初級", "source": {"title": "ＡＩに質問は古い？ Ａiに仕事をしていただく方法（note・2026-09-07）", "url": "https://note.com/miya73630/n/n33e9979efb55"}, "added": "2026-09-23", "verified": "出典あり", "use": "両方", "axes": {"kind": "考え方", "effect": "事故を防ぐ", "effort": "少し準備", "depth": "手順つき", "scene": "全般"}}, {"id": "claude-023", "ai": "Claude", "origin": "note", "title": "消費の正体は会話の長さでなく「読ませたファイルの量」", "summary": "AIは返信のたびに会話内の全ファイルを読み直す。1度読ませたファイルは返信回数分だけ課金される。", "why": "実測では消費の79%が自動処理（ファイル読取33%・書出・検索）で、人との対話ではなかった。「会話を短くする」では解決しない。", "steps": ["ファイル全体でなく、必要な部分だけを読ませる（行数を指定する）", "作業ごとに会話を分ける。前の作業のファイルを引きずらない", "重い調べ物は別のAI・別セッションに任せ、本体には結論だけ戻す", "実測例：1日の文脈合計 174〜255M → 15〜93M に削減"], "prompt": "このファイルは全部読まないでください。\n{○○について書かれている部分}だけを探して、その周辺だけ読んでください。\n読んだ範囲（行番号）を最初に報告してください。", "tags": ["節約", "時短"], "level": "中級", "source": {"title": "Claude Codeのトークンが減る原因は会話ではなかった。1週間のログを全部数えた（note・2026-09-20）", "url": "https://note.com/macha_ai/n/nb1091da35f90"}, "added": "2026-09-23", "verified": "出典あり", "use": "自分用", "axes": {"kind": "考え方", "effect": "枠を節約", "effort": "すぐ試せる", "depth": "考え方だけ", "scene": "環境づくり"}}, {"id": "claude-024", "ai": "Claude", "origin": "note", "title": "脱線したら小手先で直さず、計画モードに巻き戻す", "summary": "Claude Code開発者本人の仕事術。途中で指示を足して修正しようとせず、潔く計画から作り直す。", "why": "汚れた文脈のまま指示を足すと、歪んだ判断が積み重なる。物理的にやり直すほうが速い。", "steps": ["作業が脱線したら、その場で直そうとせず中断する", "今のスレッドでは「問題の要約だけ」を箇条書きにさせる", "新しいセッションを開く（過去のエラーログを持ち込まない）", "その要約だけを渡して、計画から立て直す", "計画が納得できる形になってから、一度で実行させる"], "prompt": "ここまでの作業は一旦止めます。\n修正はしないでください。\n\n代わりに、いま起きている問題の要約だけを箇条書きで書いてください。\n- 何をしようとしていたか\n- 何が想定と違ったか\n- 原因として考えられること\n\nこれを持って、別のセッションでやり直します。", "tags": ["品質アップ", "つまずき対策"], "level": "中級", "source": {"title": "Claude Code生みの親が明かした仕事術──Plan Modeの真実（note・2026-09-18）", "url": "https://note.com/echoesr/n/n4515f63f2e9e"}, "added": "2026-09-23", "verified": "出典あり", "use": "自分用", "axes": {"kind": "考え方", "effect": "時間が減る", "effort": "すぐ試せる", "depth": "考え方だけ", "scene": "環境づくり"}}, {"id": "claude-025", "ai": "Claude", "origin": "note", "title": "CLAUDE.mdは「この行を消したらAIは間違えるか」で選ぶ", "summary": "書けば効くのではなく、削るほど効く。目安は200行以下（著者の運用例は135行）。", "why": "膨らんだ指示書は、本当に守ってほしい指示を埋もれさせる。AIが自力で分かることを書いても効果がない。", "steps": ["1行ずつ「これを消すとAIは間違えるか？」と自問し、ノーなら消す", "手順化できるものは → スキルに移す", "守られないと困るものは → hook（強制）に移す", "特定のフォルダだけの話は → そのフォルダのCLAUDE.mdに移す", "一度言えば済むものは → その場の会話で訂正する"], "prompt": "このCLAUDE.mdを1行ずつ点検してください。\n各行について「この行を消すと、あなたは間違えますか？」を判定し、\n\n- 消してよい行\n- スキルに移すべき行\n- hook（強制）にすべき行\n- 特定フォルダに移すべき行\n\nに仕分けしてください。まだ変更はしないでください。", "tags": ["設定", "MDファイル", "節約"], "level": "中級", "source": {"title": "CLAUDE.mdの書き方｜「書けば効く」ではなく「削るほど効く」（note・2026-09-18）", "url": "https://note.com/weel_media/n/n17a541413f48"}, "added": "2026-09-23", "verified": "出典あり", "use": "自分用", "axes": {"kind": "考え方", "effect": "質が上がる", "effort": "少し準備", "depth": "手順つき", "scene": "環境づくり"}}, {"id": "claude-026", "ai": "Claude", "origin": "note", "title": "消費は「雪だるま式」に増える。後半ほど同じ指示が重くなる", "summary": "起動時に指示書・記憶・スキル一覧・道具情報が読まれ、その後も読んだファイル・検索結果が毎回積み上がる。", "why": "この荷物は毎回いっしょに運ばれる。だから作業の後半は、同じことを頼んでも消費が増える。「後半で急に枠が減る」の正体。", "steps": ["長い作業は途中で区切り、新しい会話に移る", "前の作業のファイルを引きずらない", "重い調べ物は別枠（サブエージェント）に投げて、結論だけ受け取る", "指示書・記憶が膨らむと起動時点の荷物が増えるので、定期的に整理する"], "prompt": null, "tags": ["節約", "つまずき対策"], "level": "中級", "source": {"title": "5時間上限を1時間で溶かした話。サブエージェントで消費を分散する（note・2026-09-09）", "url": "https://note.com/miccell/n/n443d0dd3600d"}, "added": "2026-09-23", "verified": "出典あり", "use": "自分用", "axes": {"kind": "考え方", "effect": "枠を節約", "effort": "すぐ試せる", "depth": "考え方だけ", "scene": "環境づくり"}}, {"id": "claude-027", "ai": "Claude", "origin": "note", "title": "重い読み込みは別枠に投げて「結論だけ」受け取る", "summary": "記事の例では、6,100トークン分を読んでも、本体に戻るのは420トークンの要約だけ。差し引き5,700トークン分が節約される。", "why": "サブエージェントは独立した作業場を持つので、大量に読んでも本体の荷物が増えない。手動で毎回指示しなくても、条件を書いておけば自動で効く。", "steps": ["指示書に「どういうときに委譲するか」を書く（例：3ファイル以上を横断する調べ物、出力が長くなる作業）", "依頼するときは「対象範囲」と「返してほしい形式」を必ず指定する", "役割ごとに使える道具を絞っておく", "戻ってきた結論だけを本体で使う"], "prompt": "次の調べ物は、別枠（サブエージェント）に任せてください。\n\n対象範囲：{どのフォルダ／どのファイル群}\n知りたいこと：{○○がどこに書かれているか}\n返してほしい形式：{結論3行＋根拠のファイル名と行番号だけ}\n\n本文や全文は戻さないでください。", "tags": ["節約", "時短"], "level": "上級", "source": {"title": "5時間上限を1時間で溶かした話（note・2026-09-09）", "url": "https://note.com/miccell/n/n443d0dd3600d"}, "added": "2026-09-23", "verified": "出典あり（※数字は記事内の図の説明。公式ドキュメントからの引用かは記事上で明示されていない）", "use": "自分用", "axes": {"kind": "設定・仕組み", "effect": "枠を節約", "effort": "仕組みを作る", "depth": "手順つき", "scene": "環境づくり"}}, {"id": "claude-028", "ai": "Claude", "origin": "note", "title": "「消費が激しい」の正体は単価でなく“長く走るようになった”こと", "summary": "22人の報告を突き合わせた結果。値下げは単価の話で、月額プランの枠は「量」で削られるため恩恵がない。", "why": "賢くなって途中で止まらなくなった分、一度のやり取りで枠の87〜90%を使う報告が出た。体感の「急に減る」は仕様変化によるもの。", "steps": ["軽い作業では考える深さ（effort）を low に落とす", "⚠️ただし別の検証記事では「low は『思考の深さ』でなく『工程そのものの省略』」との指摘あり。手順が細かく決まっている作業で low にすると、工程が飛ばされて品質が落ちる", "→ 使い分け：自由度の高い相談・下調べは low、手順が決まった作業は既定のまま", "新モデルが出た直後は評価が割れるので、2週間ほど自分の用途で試してから判断する"], "prompt": null, "tags": ["節約", "設定"], "level": "中級", "source": {"title": "Claude Fable 5.1「トークン消費が激しい」の正体｜22人の報告を全件照合（note・2026-09-05）", "url": "https://note.com/instkoni/n/nf52e7f5c5397"}, "added": "2026-09-23", "verified": "出典あり（※effort=lowの解釈は記事間で食い違いあり。両論を併記）", "use": "自分用", "axes": {"kind": "考え方", "effect": "枠を節約", "effort": "すぐ試せる", "depth": "考え方だけ", "scene": "環境づくり"}}, {"id": "other-016", "ai": "その他", "origin": "note", "title": "URLだけ渡すと嘘が増える。本文をそのまま渡すと正答率99%", "summary": "3モデルを検証した結果、製品URLだけ渡すと基本仕様を誤答。HTML全文を渡したClaude Opus 5は99.1%正答。", "why": "URLだけだとAIは記憶と推測で埋める。公式ページに書いていない機能を、それらしく創作することがある。価格は特に誤りやすい。", "steps": ["ページのURLではなく、**本文テキストやHTMLをそのまま貼る**", "出してほしい項目をあらかじめ列挙する（構造化して指定）", "「自己採点してから出して」を付ける", "最後は必ず人が確認する。精度が要る仕事で無チェック利用は危険"], "prompt": "以下は{製品ページ}の本文そのものです。**ここに書かれていることだけ**を根拠に答えてください。\n\n---\n{本文を貼る}\n---\n\n次の項目を表にしてください：{項目1／項目2／項目3}\n本文に記載が無い項目は、推測せず「記載なし」と書いてください。\n最後に、各項目が本文のどこに書かれていたかを示してください。", "tags": ["品質アップ", "リサーチ", "つまずき対策"], "level": "初級", "source": {"title": "【検証】生成AIにガジェットレビュー手伝わせると死ぬ｜3モデルのハルシネーション検証（note・2026-09-11）", "url": "https://note.com/kanu8240/n/n6e0bd9081d4d"}, "added": "2026-09-23", "verified": "出典あり", "use": "両方", "axes": {"kind": "失敗回避", "effect": "事故を防ぐ", "effort": "すぐ試せる", "depth": "手順つき", "scene": "調べもの"}}, {"id": "other-017", "ai": "その他", "origin": "note", "title": "非エンジニアの会社が1ヶ月で自動化したこと（実例）", "summary": "請求書作成・予約メールの自動登録・一斉連絡・前日リマインドを、手作業からAIに移した実例。", "why": "「AIで何ができるか分からない」への具体的な答え。どれも社内に必ずある種類の作業で、提案の材料にもなる。", "steps": ["請求書：雛形コピー＋手入力 →「○○社宛に今月分の請求書を作って」の一言", "予約メール：届いたら内容を読み取って自動でデータベースに登録", "一斉連絡：案件が発生したら関係者へ稼働確認を自動送信", "前日リマインド：担当者へ詳細案内が自動で届く", "判断以外（調べ物・下書き・データ整理）はすべて任せる"], "prompt": null, "tags": ["自動化", "営業", "社内資料"], "level": "初級", "source": {"title": "アナログなツアー会社が1ヶ月本気でClaude Codeを活用してみた結果（note・2026-09-08）", "url": "https://note.com/maruryo0729/n/n4cb7a080f333"}, "added": "2026-09-23", "verified": "出典あり", "use": "両方", "axes": {"kind": "考え方", "effect": "時間が減る", "effort": "仕組みを作る", "depth": "考え方だけ", "scene": "全般"}}, {"id": "other-018", "ai": "その他", "origin": "note", "title": "「社内アプリを作りました」はだいたい意味がない", "summary": "日報アプリを作っても、書くのは相変わらず人間。手作業がExcelからアプリ画面に引っ越しただけ。", "why": "完成直後は話題になるが2週間で使われなくなる。MITの2025年調査では、企業の生成AI導入の95%が収益への測定可能な効果を出していない。**提案・研修の場でそのまま使える論点。**", "steps": ["作る前に「誰の業務が週何分減るか」を数値で出す", "人間がその画面を操作する時間を書き出す", "その操作自体を消して「結果だけが届く形」にできないか考える", "→ たいていの場合、画面そのものが不要だと気づく", "例：日報は書く工程を消し、カレンダーと商談履歴から自動生成させる"], "prompt": "これから{作ろうとしているもの}について、作る前の判定をしてください。\n\n1. これが完成すると、誰の業務が週に何分減りますか（数値で）\n2. 完成後、人間がこの画面を操作する時間はどれくらい残りますか\n3. その操作自体を無くして「結果だけが届く形」にできませんか\n\n3が可能な場合は、画面を作らない案を提示してください。", "tags": ["自動化", "営業", "社内資料"], "level": "中級", "source": {"title": "「Claude Codeで社内アプリ作りました」が、だいたい意味ない話（note・2026-09-01）", "url": "https://note.com/heartandbrain/n/n4e9d5579c75e"}, "added": "2026-09-23", "verified": "出典あり", "use": "両方", "axes": {"kind": "考え方", "effect": "事故を防ぐ", "effort": "すぐ試せる", "depth": "考え方だけ", "scene": "提案書"}}, {"id": "claude-029", "ai": "Claude", "origin": "note", "title": "止まる原因は能力不足でなく「決めることが多すぎる」", "summary": "入れたのに使わなくなるのは、どの業務を任せるか・どこまで触らせるかが決まらないから。", "why": "記事を読んでも判断できず、試行錯誤のうちに手が止まる。最初の1つを決め切ることが突破口になる。", "steps": ["「決まった手順の繰り返し」を1つだけ選ぶ（人に説明できる作業がよい）", "頼むときは4つを必ず指定する：**見るもの／やること／出す形／触っていい範囲**", "ざっくり頼まない（例：×「整理して」 ○「下書きフォルダのメモを読んで、投稿文に整えて保存」）", "触らせる範囲を先に限定し、大事なファイルを守る"], "prompt": "【見るもの】{どのフォルダ・どのファイル}\n【やること】{何をするか}\n【出す形】{どこに・どんな形式で出すか}\n【触っていい範囲】{このフォルダの中だけ。他は読むだけ}\n\n上の範囲を超える必要が出たら、実行せずに私に聞いてください。", "tags": ["つまずき対策", "設定"], "level": "初級", "source": {"title": "Claude Code、入れただけで止まっていませんか（note・2026-08-24）", "url": "https://note.com/mako_lab0/n/n9f85bdd57df3"}, "added": "2026-09-23", "verified": "出典あり", "use": "自分用", "axes": {"kind": "考え方", "effect": "事故を防ぐ", "effort": "すぐ試せる", "depth": "考え方だけ", "scene": "全般"}}, {"id": "claude-030", "ai": "Claude", "origin": "note", "title": "公式の無料学習サイト「Claude Academy」がある", "summary": "Anthropic公式。22コース・289リソース・完全無料。AI基礎からClaude Code、MCP・エージェントまで体系的に学べる。", "why": "研修の教材選定や、社内展開時の「まずここを見てください」の案内先として使える。公式なので信頼性の担保にもなる。", "steps": ["https://academy.claude.com/ を開く", "初心者は「Claude 101」（約2.5時間）から", "活用力を上げたい人は「4D Framework」の章", "開発寄りはClaude Code・API（約9時間）・MCPのコース", "※日本語対応かは未確認。確認してから案内すること"], "prompt": null, "tags": ["社内資料", "全AI共通"], "level": "初級", "source": {"title": "【無料で学べる】Anthropicの「Claude Academy」とは？（note・2026-08-24）", "url": "https://note.com/asuni_nare/n/na8a792d0ec85"}, "added": "2026-09-23", "verified": "出典あり（日本語対応可否は未確認）", "use": "自分用", "axes": {"kind": "操作手順", "effect": "発想が広がる", "effort": "すぐ試せる", "depth": "考え方だけ", "scene": "全般"}}, {"id": "other-019", "ai": "その他", "origin": "note", "title": "AIリテラシー0の会社に教える順番は「成功体験が先、理屈は後」", "summary": "仕組みの説明より先に、10分の作業が数十秒になる体験をさせる。そこで初めて話を聞いてもらえる。", "why": "**研修設計に直接使える。**理屈から入ると「難しそう」で終わる。最初に自分の仕事が短縮される体験を作ると、その後の理解が速い。", "steps": ["① 成功体験：実際の業務が10分→数十秒になるところを体験させる", "② 基礎：「この文章をわかりやすくして」など、普通の日本語で十分動くと示す", "③ 型：**目的・背景・材料・出力**の4要素で精度が変わることを体感させる", "④ リスク：ハルシネーション・著作権・個人情報を明示的に教える", "最終ゴールは「ツールの習熟」でなく「AIを前提に仕事を設計できる思考」に置く"], "prompt": "【目的】{何のために}\n【背景】{相手・状況・前提}\n【材料】{使ってよい情報・資料}\n【出力】{どんな形で・どれくらいの分量で}\n\n※この4つを書くだけで精度が変わる。研修ではこの型を最初に教える。", "tags": ["社内資料", "営業", "全AI共通"], "level": "初級", "source": {"title": "AIセミナー『はじめてのGemini』AIリテラシー0から始める企業のAI活用（note・2026-08-29）", "url": "https://note.com/murosakikeita/n/nc2ebe32bdc11"}, "added": "2026-09-23", "verified": "出典あり", "use": "両方", "axes": {"kind": "考え方", "effect": "質が上がる", "effort": "少し準備", "depth": "考え方だけ", "scene": "研修・登壇"}}, {"id": "other-020", "ai": "その他", "origin": "note", "title": "研修で詰まる4つの場所と、その外し方", "summary": "「プロンプト」という言葉で拒否反応が出る、一回聞いて終わる、精度を過信する、レベル差で置いていかれる。", "why": "研修の現場で必ず起きる。先に潰しておけば進行が止まらない。**提案書の「想定される課題と対策」にそのまま書ける。**", "steps": ["レベル差 → 受講者のレベル別に成功体験を用意する（同じ題材にしない）", "「プロンプト」への抵抗 → 「AIに指示する」「相手に仕事を依頼する」と言い換える", "一回で終わる癖 → 対話を往復させる演習を必ず入れる", "精度の過信 → ハルシネーション・著作権・個人情報のリスクを明示的に扱う"], "prompt": null, "tags": ["社内資料", "営業"], "level": "中級", "source": {"title": "AIセミナー『はじめてのGemini』（note・2026-08-29）", "url": "https://note.com/murosakikeita/n/nc2ebe32bdc11"}, "added": "2026-09-23", "verified": "出典あり", "use": "両方", "axes": {"kind": "考え方", "effect": "事故を防ぐ", "effort": "少し準備", "depth": "手順つき", "scene": "研修・登壇"}}, {"id": "gemini-013", "ai": "Gemini", "origin": "note", "title": "「学習ノートブック」で引き継ぎ資料を教材に変えられる", "summary": "資料を入れると ed": "動画の目次から要約（詳細は動画で確認）", "use": "両方", "axes": {"kind": "考え方", "effect": "質が上がる", "effort": "すぐ試せる", "depth": "考え方だけ", "scene": "全般"}}, {"id": "other-025", "ai": "その他", "origin": "note", "title": "研修資料は「土台」と「調整パーツ」に分ける", "summary": "毎回ゼロから作らない。どの現場でも変わらない土台を1式作り、業種・対象者で差し替える部分だけを用意する。", "why": "**あなたの本業そのもの。**前日夜まで格闘していた準備が、その日のうちに終わるようになったという実例。案件が増えるほど効く。", "steps": ["過去の研修内容を棚卸しし、AIと対話しながら『土台』と『調整』に分類する", "土台：どの現場でも変わらない部分（基本の考え方・共通の型）を一式作る", "調整パーツ：業種別の事例、対象者別の伝え方、難易度など差し替える部分を用意する", "新規依頼が来たら、土台に調整パーツを組み替えるだけにする", "作り直さない。組み替えるだけ、という状態を目指す"], "prompt": "これまでの研修資料を渡します。次の2つに分類してください。\n\n【土台】どの現場・どの業種でも変わらない部分\n【調整パーツ】業種・対象者・難易度によって差し替える部分\n\n分類したうえで、調整パーツについては\n「どういう切り口で何パターン用意しておけばよいか」を提案してください。", "tags": ["資料作成", "PowerPoint", "社内資料", "時短"], "level": "中級", "source": {"title": "研修資料、毎回ゼロから作っていませんか。私はそれで4年、消耗していました（note・2026-08-15）", "url": "https://note.com/mika_0419/n/n30579467664d"}, "added": "2026-09-23", "verified": "出典あり", "use": "両方", "axes": {"kind": "考え方", "effect": "時間が減る", "effort": "仕組みを作る", "depth": "考え方だけ", "scene": "研修・登壇"}}, {"id": "other-026", "ai": "その他", "origin": "note", "title": "下書きを毎回作らせるのでなく「前提」を覚えさせる", "summary": "屋号・業務内容・自己紹介・文体の好み・提案書の見出し構成・見積のルール。この5つを覚えさせておく。", "why": "一度きりの時短でなく、**明日も明後日も同じだけ時間が浮く**。打ち合わせメモを渡すだけで、中身の入った下書きが出てくる状態になる。", "steps": ["① 会社の屋号と業務内容", "② 自己紹介文のテンプレート", "③ 文章の書き方の好み", "④ 提案書の見出し構成（いつもの型）", "⑤ 見積を作るときのルール", "→ これらをプロジェクトのカスタム指示や CLAUDE.md に書いておく", "以降は打ち合わせメモを渡すだけ。人は『その客先に合わせる部分』だけ手を入れる"], "prompt": "以降の提案書作成では、次を前提としてください。\n\n【屋号・事業】{会社名／何をしている会社か}\n【自己紹介】{定型文}\n【文体の好み】{過剰な敬語を使わない／結論から書く など}\n【提案書の見出し構成】{いつもの章立て}\n【見積のルール】{単価・端数処理・記載順}\n\n今後は打ち合わせメモを渡すので、この前提に沿った下書きを出してください。", "tags": ["資料作成", "営業", "時短", "設定"], "level": "初級", "source": {"title": "AIに下書きを作らせるより、「仕組み」を作ってみませんか（note・2026-08-10）", "url": "https://note.com/june_maimai_/n/n861429899e47"}, "added": "2026-09-23", "verified": "出典あり", "use": "両方", "axes": {"kind": "設定・仕組み", "effect": "時間が減る", "effort": "少し準備", "depth": "手順つき", "scene": "環境づくり"}}, {"id": "claude-034", "ai": "Claude", "origin": "note", "title": "仕事は5段階に分けて、意思決定だけ人が持つ", "summary": "情報収集→構造化→分析→示唆出し→意思決定。前2つはAI、真ん中2つは共同、最後だけ人間。", "why": "**経営企画の業務を115件に分解して作られた設計図。**「どこまで任せるか」で迷わなくなる。数字：経営会議資料が月35時間→14時間、レポート作成が月12時間→3時間。", "steps": ["① 情報収集 → AIに任せる（データの自動読み込み）", "② 構造化 → AIに任せる（整形・集計・可視化）", "③ 分析 → 共同（AIが案を出し、人が検証）", "④ 示唆出し → 共同（複数の解釈を一緒に検討）", "⑤ 意思決定 → **人間のみ**（この数字は何を意味するのか）", "⚠️前提：データの掃除に2人日かかった。正しい元データを用意するのが本体"], "prompt": "この業務を、次の5段階に分解してください。\n\n① 情報収集 ② 構造化 ③ 分析 ④ 示唆出し ⑤ 意思決定\n\nそのうえで、各段階を「AIに任せる／共同でやる／人間だけ」に割り振り、\n理由も添えてください。意思決定は必ず人間に残してください。", "tags": ["自動化", "社内資料", "営業"], "level": "中級", "source": {"title": "経営企画に残ったのは、問いを立てる仕事だけだった。経営企画/IR AI分業の設計図（note・2026-08-26）", "url": "https://note.com/19831112/n/nddd81e659443"}, "added": "2026-09-23", "verified": "出典あり", "use": "自分用", "axes": {"kind": "考え方", "effect": "質が上がる", "effort": "少し準備", "depth": "手順つき", "scene": "提案書"}}, {"id": "other-027", "ai": "その他", "origin": "note", "title": "非エンジニアの人事部が630時間削減した進め方", "summary": "まず業務を可視化して「やらなくていい仕事」を消す。次にルール処理は自動化、精度を許せる部分だけAIに。", "why": "**AIを入れる前に「やめる」が先。**この順番を飛ばすと、無駄な作業を高速化するだけになる。各メンバーが自分専用のミニアプリを持つ状態まで到達した実例。", "steps": ["① 業務フローを図にして可視化する", "② **やらなくていい仕事を先に消す**（ここが最重要）", "③ ルールが決まっている処理は自動化する（GASなど）", "④ ある程度の精度で許せる業務だけAIに任せる（二層構造）", "⑤ セキュリティ上、既存の環境（Google Workspace等）の中で完結させる", "自動化した例：会議室予約・来客手配・面接日程調整・合否通知・ファイル整理・評価入力漏れのリマインド"], "prompt": null, "tags": ["自動化", "社内資料", "営業"], "level": "中級", "source": {"title": "非エンジニアが630時間削減して気づいた、AI時代の人事組織のあり方（note・2026-08-27）", "url": "https://note.com/mao_obata/n/ncd5ebe076dc5"}, "added": "2026-09-23", "verified": "出典あり", "use": "両方", "axes": {"kind": "考え方", "effect": "時間が減る", "effort": "仕組みを作る", "depth": "考え方だけ", "scene": "提案書"}}, {"id": "other-028", "ai": "その他", "origin": "note", "title": "「現場の解像度が高い人ほど、高度な自動化ができる」", "summary": "業務の細部を分かっている人ほど、AIへの指示が具体的になり、結果も良くなる。", "why": "**AI導入がうまくいくかは、ツールでなく「業務を細かく説明できるか」で決まる。**面接メモの記載フォーマットを細かく指定できる人ほど、高度な自動化ができたという観察。研修や提案の論点として強い。", "steps": ["「AIが使えない」の前に「自分の業務を細かく説明できるか」を確認する", "説明できない工程があれば、そこが自動化できない箇所", "組織としては『全員が使う型を作る』ことが人材育成になる", "文書を作るより、日常的に使われる仕組みを作るほうが効く", "浮いた時間は「人間にしかできない領域」に回す"], "prompt": null, "tags": ["社内資料", "営業", "全AI共通"], "level": "中級", "source": {"title": "非エンジニアが630時間削減して気づいた（note・2026-08-27）", "url": "https://note.com/mao_obata/n/ncd5ebe076dc5"}, "added": "2026-09-23", "verified": "出典あり", "use": "両方", "axes": {"kind": "考え方", "effect": "質が上がる", "effort": "すぐ試せる", "depth": "考え方だけ", "scene": "全般"}}, {"id": "other-029", "ai": "その他", "origin": "note", "title": "従業員ゼロで回すAI活用20業務（棚卸しリスト）", "summary": "毎日の定型業務と、従来は外注していた企画・制作業務の2種類に分かれる。", "why": "**自分の仕事の何を渡せるかを棚卸しするチェックリストとして使える。**提案時に「御社ではどれが当てはまりますか」と聞く材料にもなる。", "steps": ["【毎日の定型】メール返信・予定確認・TODO確認・ニュース収集・議事録・会議準備・外出先での指示出し", "【資料まわり】資料/書類作成・スライド作成・ブログ執筆・分析", "【制作系】ロゴ/バナー/画像・ホームページ作成と管理・SEO・アクセス確認・動画・アプリ開発", "【調べ物】市場調査・競合調査・取引先や人物の下調べ", "【思考】考えの整理・壁打ち"], "prompt": null, "tags": ["自動化", "時短", "営業"], "level": "初級", "source": {"title": "従業員・外注費ゼロで、ビジネスを運営する私のAI活用事例20選（note・2026-08-17）", "url": "https://note.com/shin_experiment/n/n0021691b8116"}, "added": "2026-09-23", "verified": "出典あり", "use": "両方", "axes": {"kind": "考え方", "effect": "発想が広がる", "effort": "すぐ試せる", "depth": "考え方だけ", "scene": "提案書"}}, {"id": "other-030", "ai": "その他", "origin": "note", "title": "速くしただけでは成果は増えない（下流に仕事を移しただけ）", "summary": "一人が10倍速く資料を作れても、誰かが10倍確認する仕事が生まれたら、組織全体は良くなっていない。", "why": "**AI導入の効果測定で一番見落とされる点。**「作業時間が減りました」だけの報告は、仕事の場所を移しただけの可能性がある。提案でも研修でも、この視点があると説得力が変わる。", "steps": ["仕事を3つに分ける：**やめる／自動化する／時間を投じる**", "成果を「やったこと」でなく「**相手に届いたこと**」で定義する", "検証する問い：相手の判断は進んだか／手戻りは減ったか／次の仕事は動いたか", "AIを入れるときは、**下流工程に確認作業が増えていないか**まで見る", "増えていたら、それは効率化でなく作業の場所移動"], "prompt": "この施策の効果を、次の観点で点検してください。\n\n1. 誰の作業が何分減りましたか（数値）\n2. その結果、**別の誰かに確認や手直しの仕事が増えていませんか**\n3. 相手の判断は実際に進みましたか／手戻りは減りましたか\n4. 差し引きで、組織全体の仕事は減っていますか\n\n2で増えている場合は、効率化ではなく「作業の場所移動」だと指摘してください。", "tags": ["営業", "社内資料", "自動化"], "level": "中級", "source": {"title": "仕事を速くしても、成果は増えない｜『生産性の高めかた』（note・2026-09-16）", "url": "https://note.com/kisha_koku/n/n98ec07228680"}, "added": "2026-09-23", "verified": "出典あり", "use": "両方", "axes": {"kind": "考え方", "effect": "事故を防ぐ", "effort": "すぐ試せる", "depth": "考え方だけ", "scene": "提案書"}}, {"id": "other-031", "ai": "その他", "origin": "note", "title": "データ分析が進まない原因は、だいたい「表記の揺れ」", "summary": "社名の書き方、日付の形式、数値と文字列の混在、見えない全角スペース。ここで止まっている。", "why": "**分析の前段で消耗している人が多い。**AIに渡す前にここを整えるだけで、以降が一気に進む。年間150時間以上の手作業削減という試算もある。", "steps": ["表記揺れ：「〇〇株式会社」「(株)〇〇」を統一する", "日付：「2026/08/04」「2026-8-4」「令和8年8月4日」が混在していないか", "型の混在：「1,000」と「1000円」（数値と文字列）が混ざっていないか", "見えない文字：全角スペース・改行コードが紛れていないか", "→ まずこの4点をAIに点検させてから、分析を依頼する"], "prompt": "この表を分析する前に、データの状態を点検してください。\n\n1. 表記揺れ（同じものが違う書き方をされている列）\n2. 日付の形式が混在している列\n3. 数値と文字列が混ざっている列\n4. 全角スペース・改行など見えない文字が入っている箇所\n\n見つかった箇所を一覧にし、**どう直すべきか**を示してください。\n私が確認するまで、勝手に書き換えないでください。", "tags": ["Excel", "つまずき対策", "リサーチ"], "level": "中級", "source": {"title": "なぜあなたのデータ分析は進まないのか？「不揃いなデータ」の自動クレンジング（note・2026-08-25）", "url": "https://note.com/minato74_/n/n70a2af4f885e"}, "added": "2026-09-23", "verified": "出典あり", "use": "両方", "axes": {"kind": "失敗回避", "effect": "事故を防ぐ", "effort": "少し準備", "depth": "考え方だけ", "scene": "表・データ"}}, {"id": "copilot-013", "ai": "Copilot", "origin": "YouTube", "title": "Copilotを使う前にやる7つの設定", "summary": "プラン確認・会社情報を教える・ファイル添付を避ける・質問させる・マークダウン指定・モデル把握・プロンプト予約。", "why": "設定せずに使って「大したことない」と判断してしまう人が多い。特に『ファイルを添付しない』は意外な落とし穴。", "steps": ["① 自分のプラン（何が使えるか）を確認する", "② 会社のこと（事業・用語・体制）を教えておく", "③ ファイル添付に頼らず、SharePointやOneDrive上の場所を指定する", "④ 作業前に質問させる", "⑤ 出力はマークダウン形式で指定する", "⑥ どのモデルが動いているか把握する", "⑦ よく使う指示は予約（保存）しておく"], "prompt": null, "tags": ["設定", "Excel", "つまずき対策"], "level": "初級", "source": {"title": "【差がつく設定】天才がこっそりCopilotで仕事を自動化してる秘密の裏設定6選【 Copilot  / Exc（バレないAIの使い方ch）", "url": "https://www.youtube.com/watch?v=AGfJGhuIHag"}, "added": "2026-09-23", "verified": "動画の目次から要約（詳細は動画で確認）", "use": "提案用", "axes": {"kind": "設定・仕組み", "effect": "質が上がる", "effort": "すぐ試せる", "depth": "手順つき", "scene": "環境づくり"}}, {"id": "copilot-014", "ai": "C
