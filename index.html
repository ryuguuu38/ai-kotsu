nd": "note", "title": "【AIスキル】Webのダークパターンを監査する「dark-pattern-audit」", "url": "https://note.com/keito_12kk2/n/n021476efc4a5", "date": "2026-09-01", "thumb": "https://assets.st-note.com/production/uploads/images/309104412/rectangle_large_type_2_b0d0f34d34409ae81b1f5e463932667b.png?width=800", "author": "KEITO（note）", "pick": "オーナー指定", "ai": "Claude", "chapters": [], "summary": "WebサイトやLPのURLを渡すだけで、ダークパターン100類型と突き合わせた監査レポートが出来上がるClaude Codeスキル「dark-pattern-audit」を販売します。スクショ・ページ全文・タイマーの動きまで機械で集めて、「どこが・どの類型に・なぜ当たるか」を証拠つきで指摘するレポートを生成します。検証は消費者庁などの行政が注意喚起しているダークパターンをまとめた下記のオリジナルサイトを元に行います。続きをみる"}, {"kind": "note", "title": "【AIスキル】雑な指示でSeedance 2.5用のプロンプトが出来上がる「seedance-2-5-prompt」", "url": "https://note.com/keito_12kk2/n/nb9ffbf7c3ad2", "date": "2026-08-22", "thumb": "https://assets.st-note.com/production/uploads/images/306033268/rectangle_large_type_2_9d64be65c9032d535626bfee84f469c5.png?width=800", "author": "KEITO（note）", "pick": "オーナー指定", "ai": "Claude", "chapters": [], "summary": "「夜の商店街で女性が猫を抱き上げて終わり」くらいの話し言葉を渡すと、Seedance 2.5にそのまま貼れる完成プロンプトが1本出てくるスキル「seedance-2-5-prompt」を販売します。画像・動画・音声・手描きの絵コンテを渡しても動きます。Seedance 2.5のプロンプトには「こう書くと当たる」正解パターンがあって、それを公式ガイドから抜き出して覚えさせたものです。Codexで作ってますが、Claude Codeでもそのまま使えます。続きをみる"}, {"kind": "note", "title": "【スキル配布】サイトの右下に0円で動く「AIに相談」ボタンを3分で付ける「ask-ai-widget」", "url": "https://note.com/keito_12kk2/n/nedf06311148f", "date": "2026-08-21", "thumb": "https://assets.st-note.com/production/uploads/images/305550256/rectangle_large_type_2_f5cfbb230316aba495aa1f63e91f4351.png?width=800", "author": "KEITO（note）", "pick": "オーナー指定", "ai": "Claude", "chapters": [], "summary": "ウェブサイトのフォルダを渡すだけで、全ページの右下に「AIに相談」ボタンが付くClaude Codeスキル「ask-ai-widget」を販売します。訪問者がボタンを押すと、そのページの内容に合わせた質問が3つ並び、ChatGPT・Claude・Gemini・Perplexityから選んだAIが質問入りで開く。サイト側にサーバーもAPIキーも要らないので、月額0円で動きます。続きをみる"}, {"kind": "note", "title": "【WebMCP】スキル共有がURL1本になる。自分専用の配布所キットスキル「webmcp-skill-server」", "url": "https://note.com/keito_12kk2/n/n542e326ffb62", "date": "2026-08-14", "thumb": "https://assets.st-note.com/production/uploads/images/303416045/rectangle_large_type_2_fbfc738358a77c7cd514361333e9010e.png?width=800", "author": "KEITO（note）", "pick": "オーナー指定", "ai": "Claude", "chapters": [], "summary": "自作のAIスキルをURL1本でチームや他社に配れるようになるスターターキット「webmcp-skill-server」を販売します。フォルダをClaude Codeに渡して「セットアップして」と頼むと、Cloudflare上に自分専用のスキル配布所が建ちます。あとはスキルを格納して、相手にURLと接続キーを送るだけです。続きをみる"}, {"kind": "note", "title": "ループ・グラフ・プロンプト...増えすぎた「◯◯エンジニアリング」の違いを整理", "url": "https://note.com/keito_12kk2/n/n918dbc078dfd", "date": "2026-08-10", "thumb": "https://assets.st-note.com/production/uploads/images/302114350/rectangle_large_type_2_1e27ab1fa2cf1a49b52359b6a0e76d5d.png?width=800", "author": "KEITO（note）", "pick": "オーナー指定", "ai": "Claude", "chapters": [], "summary": "AIの精度は設計で決まる。最近「ループエンジニアリング」って言葉をよく見るようになった。Anthropicの中の人が「最近ほとんど指示してない。ループを組んでるだけ」って言って一気に広まったやつ。続きをみる"}, {"kind": "note", "title": "【スキル】AI実写＋図解解説動画が出来上がる「zukai-kaisetsu」スキル", "url": "https://note.com/keito_12kk2/n/n9cc8f92529a6", "date": "2026-08-08", "thumb": "https://assets.st-note.com/production/uploads/images/302115741/rectangle_large_type_2_0675a6c59061a2372f0537800f509f70.png?width=800", "author": "KEITO（note）", "pick": "オーナー指定", "ai": "Claude", "chapters": [], "summary": "資料や議事録を貼るだけで、AI実写ベースの解説動画（MP4）が出来上がるClaude Codeスキル「zukai-kaisetsu」を販売します。※スキルは各々カスタマイズしていく前提だと考えてください。続きをみる"}, {"kind": "note", "title": "【AIスキル】画像生成だけで縦長LPを丸ごと作る自作スキル「image-only-lp」（Claude&Codex）", "url": "https://note.com/keito_12kk2/n/nb6bbb12905de", "date": "2026-08-05", "thumb": "https://assets.st-note.com/production/uploads/images/302115850/rectangle_large_type_2_6a3dd969b5e3cf251a2b34fdb95aaf16.png?width=800", "author": "KEITO（note）", "pick": "オーナー指定", "ai": "Claude", "chapters": [], "summary": "こんにちは。KEITOです。YouTubeとかXとかでAIに関する情報発信してます。 KEITO【AI&amp;WEB ch】AI x WEB YouTuber and Director. In this channel, he introduceyoutube.com 続きをみる"}, {"kind": "note", "title": "エージェントAI開発とは、知識を用意し、経験を言語化し、手段を繋ぐことである", "url": "https://note.com/brave_quince241/n/nf11a13e37ac9", "date": "2026-08-03", "thumb": "https://assets.st-note.com/production/uploads/images/299914544/rectangle_large_type_2_8482d903d0f3dd2aa31e274bba99038e.png?width=800", "author": "伊志嶺｜LLMで業務改善（note）", "pick": "オーナー指定", "ai": "その他", "chapters": [], "summary": "最近のAIエンジニアの基本的な仕事は、突き詰めるとすべて同じ構造をしています。知識を用意し、経験を言語化し、手段をシステム化する。RAG（社内文書などを検索し、回答に反映させる仕組み）を組むのも、プロンプトを書くのも、マルチエージェント構成を設計するのも、ツールを繋ぎ込むのも、すべてこの3つのどれかに分類できます。LLMは「カスタマイズ可能な頭脳」である続きをみる"}, {"kind": "note", "title": "今雇える最低ラインのエンジニアの要件を整理してみたら、レベルが高すぎて絶望した話", "url": "https://note.com/brave_quince241/n/n4bdfac4bdd35", "date": "2026-08-01", "thumb": "https://assets.st-note.com/production/uploads/images/299293928/rectangle_large_type_2_d3661ace2351dc7d79f2374b25546ce2.png?width=800", "author": "伊志嶺｜LLMで業務改善（note）", "pick": "オーナー指定", "ai": "その他", "chapters": [], "summary": "「即戦力」という言葉を、自分はどういう意味で使っているのか。採用の話をするたびに引っかかっていたので、雇う価値があると判断できる最低ラインを一度書き出してみました。出てきたのは 5 項目です。書き終えて最初に思ったのは、これは本当に「最低」なのか、という戸惑いでした。数年前に自分が「一人前」と呼んでいた像と、ほとんど重なっていたからです。しかも中身は、手を動かして作れることよりも、要件と設計のどちらがおかしいのかを判断できることに寄っていました。エンジニアを雇う最低ラインの要件を言語化してみる続きをみる"}, {"kind": "note", "title": "そろそろ LLMO に手を出してみようと思ったわけ。見送った去年との違い", "url": "https://note.com/brave_quince241/n/n1153c9ba1659", "date": "2026-07-24", "thumb": "https://assets.st-note.com/production/uploads/images/297211693/rectangle_large_type_2_0da9d8a714c383319a2ec4d4f0ecb79c.png?width=800", "author": "伊志嶺｜LLMで業務改善（note）", "pick": "オーナー指定", "ai": "Claude", "chapters": [], "summary": "去年、LLMO という言葉は何度も目に入っていました。ChatGPT や Claude のような大規模言語モデルに自分の情報を参照してもらう取り組みを指す言葉として、タイムラインを流れていました。それでも私は何もしませんでした。「llms.txt を置くべきだ」といった攻略法めいた話が、出所も示されないまま並んでいたからです。その私が今年になって、自分の作ったものをどう見つけてもらうかを考え直しています。手を出すかどうかを決める材料が、この一年で変わったからです。去年は、真偽のわからない話ばかりが流れていました続き"}, {"kind": "note", "title": "特化型AIはなぜ今も必要なのか。エージェントAI時代の道具の使い分け", "url": "https://note.com/brave_quince241/n/nb98f2fbd35cf", "date": "2026-07-22", "thumb": "https://assets.st-note.com/production/uploads/images/296465874/rectangle_large_type_2_a108b447db8689c80eb59a1c2bef8a33.png?width=800", "author": "伊志嶺｜LLMで業務改善（note）", "pick": "オーナー指定", "ai": "Claude", "chapters": [], "summary": "ChatGPT や Claude のような、頼めば何でもこなす AI が身近になりました。こうしたエージェント AI が文章も画像も一通り扱えるなら、画像認識や翻訳に特化した従来型の AI はもう役割を終えたのでしょうか。実際にはその逆で、目的をしぼった特化型 AI は今も広く使われています。人間が複雑な計算もできるのに、速さのために電卓を使うのと同じ理屈です。大切なのは、どちらが優れているかを競うことよりも、目的に応じて道具を使い分けることです。その分かれ目が、コストと速度の桁の差にあらわれます。エージェントAI"}, {"kind": "note", "title": "プロンプト・コンテキスト・ハーネス・ループ。AIエージェントを支える四つのエンジニアリングの違い", "url": "https://note.com/brave_quince241/n/n82d3e73663e3", "date": "2026-07-11", "thumb": "https://assets.st-note.com/production/uploads/images/293151756/rectangle_large_type_2_4997437beb7cb7f4017d1a62e84835ff.png?width=800", "author": "伊志嶺｜LLMで業務改善（note）", "pick": "オーナー指定", "ai": "その他", "chapters": [], "summary": "「プロンプトエンジニアリング」に続いて「コンテキストエンジニアリング」、さらに「ハーネス」「ループ」と、似た響きの言葉が次々に現れています。どれを使えばよいのか、これまでの言葉はもう不要になったのか、と戸惑う方も多いのではないでしょうか。けれどこの四つは、互いを置き換え合う流行語ではありません。内側が外側に含まれる入れ子の関係にあり、プロンプトをコンテキストが含み、それをハーネスが含み、さらにループが含みます。この入れ子が分かれば、それぞれの言葉が何を設計するためのものかを、内側から順に置いていけます。四つの言葉が"}, {"kind": "note", "title": "組織の知識管理は分散型へ、社員一人ひとりの「レプリカント」が支える近未来", "url": "https://note.com/brave_quince241/n/n2403bdcba0b5", "date": "2026-07-10", "thumb": "https://assets.st-note.com/production/uploads/images/292958375/rectangle_large_type_2_c03f61e416be08670250b7972b091f67.png?width=800", "author": "伊志嶺｜LLMで業務改善（note）", "pick": "オーナー指定", "ai": "その他", "chapters": [], "summary": "退職する同僚の頭の中にあった判断の理由は、引き継ぎ資料にはほとんど残りません。組織の知識管理は長らく、この抜け落ちを「サイロの問題」ととらえ、情報を一元管理することで埋めようとしてきました。ですが、本人が不在でも本人に代わって問い合わせに答える「レプリカント(記憶の複製)」が現実味を帯びるにつれ、その前提は揺らぎ始めます。集中型から分散型へ。組織の知識管理をめぐる一つの見取り図を、順を追って共有します。以下に書くのは、一つの構想であり思考実験です。続きをみる"}, {"kind": "note", "title": "エンジニアでなくても知っておきたい、AIに丸投げしない5段階の資料づくり", "url": "https://note.com/brave_quince241/n/n84fcc51af64d", "date": "2026-07-09", "thumb": "https://assets.st-note.com/production/uploads/images/292741015/rectangle_large_type_2_9a053beb37bea398707896341deacd80.png?width=800", "author": "伊志嶺｜LLMで業務改善（note）", "pick": "オーナー指定", "ai": "その他", "chapters": [], "summary": "AIに資料づくりを頼んだのに、それらしいけれど芯を外した出来にがっかりした経験はないでしょうか。開発現場で古くから使われてきた「要件定義→設計→レビュー→実行→自己レビュー」という5段階の進め方は、エンジニアでなくても日々の資料づくりにそのまま応用できます。たとえば取引先への提案資料も、いきなり書かせるのではなく目的と骨組みを先に決めてから任せると、出来がはっきり変わります。特別な技術ではなく、作る前に狙いを固め、作った後に見直すという、誰の作業にも効く汎用的な段取りだからです。丸投げをやめてこの段取りで任せるだけ"}, {"kind": "note", "title": "Claude Code のモデル使い分け：役割別割り当てでコストと品質を両立する", "url": "https://note.com/brave_quince241/n/nf057e0190777", "date": "2026-07-08", "thumb": "https://assets.st-note.com/production/uploads/images/292619916/rectangle_large_type_2_52be0882db1abab81dd66a02d71b6e64.png?width=800", "author": "伊志嶺｜LLMで業務改善（note）", "pick": "オーナー指定", "ai": "Claude", "chapters": [], "summary": "サブエージェントを組んでいると、要件定義・実装・テスト・レビューのどの工程にどのモデルを割り当てるべきか、毎回迷う場面が出てきます。ここを役割ごとに整理して割り当てると、コストと品質を無理なく両立できます。基本は、4 つの役割それぞれに、求められる能力とコストの釣り合う 1 モデルを対応づけることです。単価が高く常用しにくい Fable だけは例外で、常時は割り当てず、判断に迷った要所でだけ助言を仰ぐ相談相手として使います。サブエージェントの役割を分解する続きをみる"}, {"kind": "note", "title": "動画を丸投げするだけでnotionマニュアルが完成するAIスキル｜セットアップ解説動画付き", "url": "https://note.com/keito_12kk2/n/nd85494896097", "date": "2026-06-24", "thumb": "https://assets.st-note.com/production/uploads/images/302115973/rectangle_large_type_2_a01f06cf20eb665fab339f06e169862a.png?width=800", "author": "KEITO（note）", "pick": "オーナー指定", "ai": "Claude", "chapters": [], "summary": "今回は、Claude CodeやCodexに動画を丸投げするだけで、画像付きのマニュアルがNotion上に自動で完成するスキルを紹介します。あわせて、この記事ではそのスキルのセットアップ方法も解説していきます。続きをみる"}, {"kind": "note", "title": "Claude Code と GitHub Pages で毎日論文を自動解説する自分専用ジャーナルの作り方", "url": "https://note.com/brave_quince241/n/nf38105d6ed53", "date": "2026-06-19", "thumb": "https://assets.st-note.com/production/uploads/images/286654414/rectangle_large_type_2_e78a42d8adb61539abd77ec4cb1861aa.png?width=800", "author": "伊志嶺｜LLMで業務改善（note）", "pick": "オーナー指定", "ai": "Claude", "chapters": [], "summary": "AI 分野は論文が出るスピードが速く、正式な査読を待っていると情報が古くなりがちです。だからこそ、査読前のプレプリント（査読を経る前の段階で公開される論文）を追う情報感度が問われます。とはいえ、毎日 arXiv を手で巡回し続けるのは負担が大きいものです。Claude Code と GitHub Pages を組み合わせれば、毎朝 1 本の論文解説が自分専用サイトに届きます。実際に動いているサイトはpaper-lens の公開サイトで確認できます。公開リポジトリをフォークすれば、同じ仕組みを自分の手元に用意できます"}, {"kind": "note", "title": "【公式から学ぶ】Claude・Claude Codeのプロンプトのコツ", "url": "https://note.com/keito_12kk2/n/n0f340029ed46", "date": "2026-06-02", "thumb": "https://assets.st-note.com/production/uploads/images/288350117/rectangle_large_type_2_9999169b542bf24aa7e49b323fc42198.jpeg?width=800", "author": "KEITO（note）", "pick": "オーナー指定", "ai": "Claude", "chapters": [], "summary": "Anthropic公式ドキュメント『プロンプトのベストプラクティス』を参考にClaude・Claude Codeのプロンプトのコツをまとめていきます。https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices続きをみる"}, {"kind": "note", "title": "OpenAI『Codex』を解説！基本概念から主要機能、スキル作成、自動化の設定方法など", "url": "https://note.com/keito_12kk2/n/nd0c2617b64ea", "date": "2026-06-01", "thumb": "https://assets.st-note.com/production/uploads/images/288349191/rectangle_large_type_2_52cb9216f9473e653a8cb9d6951a558a.png?width=800", "author": "KEITO（note）", "pick": "オーナー指定", "ai": "Claude", "chapters": [], "summary": "OpenAIが開発した最新のAIコーディング・業務実行エージェントであるOpenAI CodexはこれまでのAIチャットツールとは一線を画し、「考える」だけでなく「実行する」パートナーとして、デスクトップ上の様々な作業を自律的にこなします。本記事では、Codexの基本概念から主要機能、スキルの作成、自動化の設定方法、そして具体的な業務自動化ワークフローまでを徹底的に解説します。続きをみる"}, {"kind": "note", "title": "【革命的機能】Claude Opus 4.8の『Dynamic Workflow』を解説", "url": "https://note.com/keito_12kk2/n/n687a7030d9e6", "date": "2026-05-30", "thumb": "https://assets.st-note.com/production/uploads/images/288349361/rectangle_large_type_2_5d7580520af96c32639c5a3ec9854a48.png?width=800", "author": "KEITO（note）", "pick": "オーナー指定", "ai": "Claude", "chapters": [], "summary": "2025年5月、Anthropicが最新モデル「Claude Opus 4.8」をリリースしました。目玉機能が「Dynamic Workflow」です。この記事では、Dynamic Workflowがどんな機能なのか、どんな場面で使えるのか、従来のやり方と何が違うのかを、初心者にもわかるようにまとめます。最後に、実際にDynamic Workflowでゲームを作った事例も紹介します。続きをみる"}, {"kind": "note", "title": "発信で意識してる「視聴者心理」と「メタ認知」", "url": "https://note.com/keito_12kk2/n/ne43bb99dba16", "date": "2026-05-22", "thumb let mergedCount = 0;
function mergeSaved(){
  const sv = (typeof DATA!=="undefined" && DATA.saved) ? DATA.saved : null;
  if(!sv || (!sv.likes && !sv.nopes)) return;
  const off = offList();
  let f=favs(), fm=likeMeta(), n=nopes(), nm=nopeMeta(), added=0;
  Object.entries(sv.nopes||{}).forEach(([id,info])=>{
    if(off.indexOf(id)>=0) return;
    if(n.indexOf(id)<0){ n.push(id); nm[id]=info; added++; }
    const j=f.indexOf(id); if(j>=0){ f.splice(j,1); delete fm[id]; }   // 👎が勝つ
  });
  Object.entries(sv.likes||{}).forEach(([id,info])=>{
    if(off.indexOf(id)>=0 || n.indexOf(id)>=0) return;
    if(f.indexOf(id)<0){ f.push(id); fm[id]=info; added++; }
  });
  try{
    localStorage.setItem(FAV_KEY, JSON.stringify(f));
    localStorage.setItem(FAV_KEY+"_meta", JSON.stringify(fm));
    localStorage.setItem(NG_KEY, JSON.stringify(n));
    localStorage.setItem(NG_KEY+"_meta", JSON.stringify(nm));
  }catch(e){}
  mergedCount = added;
}

function sendToClaude(){
  const L=favs(), N=nopes(), OFF=offList();
  if(!L.length && !N.length){ alert("まだ何も押されていません。\n気に入ったものに👍、違うものに👎を押してから使ってください。"); return; }
  const d=new Date(); const stamp=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const body =
    "L: "+L.join(",")+"\n"+
    "N: "+N.join(",")+"\n"+
    "OFF: "+OFF.join(",")+"\n"+
    "at: "+stamp+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  const url="https://github.com/ryuguuu38/ai-kotsu/issues/new"
    +"?title="+encodeURIComponent("いいね "+stamp)
    +"&body="+encodeURIComponent(body);
  if(url.length>7000){ alert("件数が多すぎて送れません。コピー方式に切り替えます。"); exportLikes(); return; }
  // 先に手元にもコピーしておく（GitHubが開かなかったときの保険）
  try{ navigator.clipboard && navigator.clipboard.writeText(body); }catch(e){}
  window.open(url, "_blank", "noopener");
  // GitHubがエラーになっても困らないように、案内を残す
  const b=document.createElement("div"); b.id="syncnote";
  b.innerHTML="GitHubが開きます。<b>送信を押すだけ</b>です。<br>"+
    "<span style=\"font-weight:400;font-size:11.5px\">開かない／エラーが出た場合は、"+
    "同じ内容をコピー済みなのでチャットに貼ってください</span>";
  document.body.appendChild(b);
  setTimeout(()=>{ b.style.opacity="0"; setTimeout(()=>b.remove(),600); }, 9000);
}
function exportLikes(){
  const meta=likeMeta(); const ids=favs();
  const rows=ids.map(id=>{
    const m=meta[id]||{};
    return {id:id, kind:m.kind||"", title:m.title||"", ai:m.ai||"", tags:m.tags||[],
            level:m.level||"", use:m.use||"", origin:m.origin||"", author:m.author||"",
            axes:m.axes||{}, at:m.at||""};
  });
  // 傾向がひと目で分かるよう、こちらで集計まで済ませておく
  const tally=(f)=>{const c={}; rows.forEach(r=>{const v=f(r); if(v) c[v]=(c[v]||0)+1;});
    return Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,v])=>k+":"+v).join(" / ");};
  const summary={
    "AI別": tally(r=>r.ai),
    "① 場面": tally(r=>r.axes.scene),
    "② 種類": tally(r=>r.axes.kind),
    "③ 効き方": tally(r=>r.axes.effect),
    "④ 手間": tally(r=>r.axes.effort),
    "⑤ 具体度": tally(r=>r.axes.depth),
    "レベル": tally(r=>r.level),
    "用途": tally(r=>r.use),
    "出どころ": tally(r=>r.origin)
  };
  const nmeta=nopeMeta();
  const nrows=nopes().map(id=>{const m=nmeta[id]||{};
    return {id:id, title:m.title||"", ai:m.ai||"", axes:m.axes||{}, at:m.at||""};});
  const out=JSON.stringify({exported:new Date().toISOString().slice(0,16),
    count:rows.length, 違うと答えた数:nrows.length,
    傾向: summary, likes:rows, nopes:nrows, 外したもの: offList()}, null, 1);
  navigator.clipboard.writeText(out).then(()=>{
    alert("いいね "+rows.length+"件をコピーしました。\nClaudeのチャットに貼り付けてください。");
  }).catch(()=>{
    const b=new Blob([out],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(b);
    a.download="私のいいね.json"; a.click();
  });
}

  return `<button class="pill ${onlyLiked?"on":""}" id="fLiked">👍 いいねしたもの<b>${n}</b></button>`;
}
function items(){ return view==="tips"?DATA.tips:(view==="feed"?DATA.feed:DATA.news); }

/* ===== 今日の10分 ===== */
const ED_KEY="aikotsu_edition";
let castEd=(function(){ try{ return localStorage.getItem(ED_KEY)||"all"; }catch(e){ return "all"; } })();
function edList(){ return Object.keys(DATA.casts||{}); }
function edSwitch(){
  const ks=edList();
  if(ks.length<2) return "";
  if(ks.indexOf(castEd)<0) castEd=ks[0];
  const emoji={all:"🎁",claude:"🟠",gemini:"🔵",chatgpt:"🟢",news:"📰"};
  return `<div class="edrow" id="edrow">`+ks.map(k=>{
    const c=DATA.casts[k];
    return `<button class="edpill ${k===castEd?"on":""}" data-ed="${k}">`+
           `${emoji[k]||"🎧"} ${esc(c.label||k)}<b>${c.minutes}分</b></button>`;
  }).join("")+`</div>`;
}
function castView(){
  const all=DATA.casts||{};
  const c=(all[castEd])||DATA.cast||{};
  const ls=c.lines||[];
  if(!ls.length) return edSwitch()+`<p class="empty">今日の台本はまだ作られていません。</p>`;
  const body=ls.map((l,i)=>
    `<div class="line ${l.who==="zunda"?"zunda":"metan"}" data-i="${i}">
       <span class="who">${l.who==="zunda"?"ずんだもん":"四国めたん"}</span>
       <span class="txt">${esc(l.text)}</span></div>`).join("")
    + `<p class="credit">${esc(c.credit||"")}</p>`;
  const mp3="audio/today"   /* サイトと同じ場所に置いた音声（配布置き場のURLだとiPhoneで鳴らないため 2026-10-18） */
            +(castEd&&castEd!=="all"?"_"+castEd:"")+".mp3";
  const ready=(DATA.voice_ready||["all"]).indexOf(castEd)>=0;
  if(!ready){
    return edSwitch()+`<div class="audiobox waiting">
      <h3>🔊 ずんだもん × 四国めたん<span class="edtag">${esc(c.label||"")}</span></h3>
      <p class="note"><b>この版の音声は、まだ作られていません。</b><br>
        次の自動更新（毎朝7時すぎ）で作られます。下の台本は今日の内容です。</p>
    </div>`+`<div class="castbar">
      <span class="castmeta" style="margin-left:0">台本（約${c.minutes}分・${c.date}版）／ セリフを押すとその場所を目立たせます</span>
    </div>
    <div class="script">${body}</div>`;
  }
  const player=`<div class="audiobox">
      <h3>🔊 ずんだもん × 四国めたん<span class="edtag">${esc(c.label||"全部")}</span></h3>
      <audio controls preload="none" src="${mp3}"></audio>
      <p class="note" id="vnote">毎朝7時すぎに自動で更新されます。
        <a href="${mp3}" download>ダウンロード ↓</a></p>
    </div>`;
  // 台本より音声が古い場合は警告を出す
  const vb = (c.voice_built||"").slice(0,10);
  const stale = vb && c.date && vb < c.date;
  const warn = stale
    ? `<p class="note" style="color:#b4531f"><b>⚠️ この音声は ${esc(vb)} 版です。</b>下の台本（${esc(c.date)}版）とは内容が違います。次の自動更新（毎朝7時）で揃います。</p>`
    : (vb ? `<p class="note">音声も台本も ${esc(vb)} 版です ✅</p>` : "");
  return edSwitch() + player.replace("</div>", warn + "</div>") + `<div class="castbar">
      <span class="castmeta" style="margin-left:0">台本（約${c.minutes}分・${c.date}版）／ セリフを押すとその場所を目立たせます</span>
    </div>
    <div class="script">${body}</div>`;
}

function match(it){
  if(hideNope && nopes().includes(it.id||it.url)) return false;
  if(onlyLiked){
    const key = it.id || it.url;
    if(!favs().includes(key)) return false;
  }
  if(ai!=="すべて" && it.ai!==ai) return false;
  if(view==="tips"){
    if(level!=="すべて" && it.level!==level) return false;
    if(onlyPrompt && !it.prompt) return false;
    if(useFor!=="すべて" && it.use!==useFor && it.use!=="両方") return false;
    for(const [k] of AXIS){ if(ax[k]!=="すべて" && (it.axes||{})[k]!==ax[k]) return false; }
  }
  if(view==="tips" && tag!=="すべて"){
    if(tag==="★お気に入り"){ if(!favs().includes(it.id)) return false; }
    else if(tag.indexOf("出どころ:")===0){ if((it.origin||"Claude")!==tag.slice(5)) return false; }
    else if(!(it.tags||[]).includes(tag)) return false;
  }
  if(view==="feed"){
    if(author!=="すべて" && it.author!==author) return false;
    if(onlyNew && daysAgo(it.date)>2) return false;
    if(onlyChap && !(it.chapters||[]).length) return false;
  }
  if(!q) return true;
  return JSON.stringify(it).toLowerCase().indexOf(q)>=0;
}

function pills(){
  const order=["すべて","ChatGPT","Claude","Gemini","Copilot","その他"];
  const base=items().filter(it=>!q||JSON.stringify(it).toLowerCase().indexOf(q)>=0);
  el("#aipills").innerHTML=order.map(a=>{
    const n=a==="すべて"?base.length:base.filter(x=>x.ai===a).length;
    return `<button class="pill ${a===ai?"on":""}" data-ai="${a}">${a}<b>${n}</b></button>`;
  }).join("");
  document.querySelectorAll("[data-ai]").forEach(b=>b.onclick=()=>{ai=b.dataset.ai;shown=PAGE;render();});
  setTimeout(()=>{ const fn2=el("#fNope2");
    if(fn2) fn2.onclick=()=>{hideNope=!hideNope;shown=PAGE;render();}; },0);

  if(view==="tips"){
    const base=DATA.tips.filter(t=>(ai==="すべて"||t.ai===ai));
    const lv=(L)=>base.filter(t=>t.level===L).length;
    const un=(U)=>DATA.tips.filter(t=>t.use===U||t.use==="両方").length;
    el("#axpills").style.display="";
    el("#filterpills").innerHTML = likeBar() +
      `<button class="pill ${useFor==="自分用"?"on":""}" data-use="自分用">🙋 自分用<b>${un("自分用")}</b></button>`+
      `<button class="pill ${useFor==="提案用"?"on":""}" data-use="提案用">💼 提案・研修用<b>${un("提案用")}</b></button>`+
      `<span style="width:10px"></span>`+
      ["初級","中級","上級"].map(L=>
        `<button class="pill ${level===L?"on":""}" data-lv="${L}">${L}<b>${lv(L)}</b></button>`).join("")
      + `<button class="pill ${onlyPrompt?"on":""}" id="fPrompt">📋 コピーできる<b>${base.filter(t=>t.prompt).length}</b></button>`
      + `<button class="pill" id="fSort">↕ ${sortBy}</button>`
      + (nopes().length ? `<button class="pill ${hideNope?"":"on"}" id="fNope">👎 違うと答えた<b>${nopes().length}</b></button>` : "")
      + (level!=="すべて"||onlyPrompt||useFor!=="すべて" ? `<button class="pill" id="fClear">✕ 絞り込み解除</button>` : "");
    document.querySelectorAll("[data-use]").forEach(b=>b.onclick=()=>{
      useFor = (useFor===b.dataset.use) ? "すべて" : b.dataset.use; shown=PAGE; render();});
    document.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{
      level = (level===b.dataset.lv) ? "すべて" : b.dataset.lv; shown=PAGE; render();});
    el("#fPrompt").onclick=()=>{onlyPrompt=!onlyPrompt;shown=PAGE;render();};
    el("#fSort").onclick=()=>{sortBy = sortBy==="新着順"?"AI順":"新着順"; render();};
    const fn=el("#fNope"); if(fn) fn.onclick=()=>{hideNope=!hideNope;shown=PAGE;render();};
    const fc=el("#fClear"); if(fc) fc.onclick=()=>{level="すべて";onlyPrompt=false;useFor="すべて";shown=PAGE;render();};

    // 5軸の絞り込み
    const axBase=DATA.tips.filter(t=>(ai==="すべて"||t.ai===ai));
    el("#axpills").innerHTML = AXIS.map(([k,label])=>{
      const vals=[...new Set(axBase.map(t=>(t.axes||{})[k]).filter(Boolean))]
        .sort((a,b)=>axBase.filter(t=>(t.axes||{})[k]===b).length-axBase.filter(t=>(t.axes||{})[k]===a).length);
      if(!vals.length) return "";
      return `<div class="axrow"><span class="axlabel">${label}</span>`+
        vals.map(v=>`<button class="pill sm ${ax[k]===v?"on":""}" data-ax="${k}" data-axv="${esc(v)}">${esc(v)}<b>${axBase.filter(t=>(t.axes||{})[k]===v).length}</b></button>`).join("")+
        `</div>`;
    }).join("") + (axCleared()?"":`<div class="axrow"><button class="pill sm" id="axClear">✕ 5軸をすべて解除</button></div>`);
    document.querySelectorAll("[data-ax]").forEach(b=>b.onclick=()=>{
      const k=b.dataset.ax, v=b.dataset.axv;
      ax[k] = (ax[k]===v) ? "すべて" : v; shown=PAGE; render();});
    const axc=el("#axClear"); if(axc) axc.onclick=()=>{axReset();shown=PAGE;render();};

    const origins=[...new Set(DATA.tips.map(t=>t.origin||"Claude"))].map(o=>"出どころ:"+o);
    const all=["すべて"].concat(favs().length?["★お気に入り"]:[]).concat(origins)
              .concat([...new Set(DATA.tips.flatMap(t=>t.tags||[]))]);
    const shownTags = showAllTags ? all : all.slice(0, 9);
    el("#tagpills").innerHTML=shownTags.map(t=>
      `<button class="pill ${t===tag?"on":""}" data-tag="${t}">${t}</button>`).join("")
      + (all.length>9 ? `<button class="pill" id="moreTags">${showAllTags?"タグを閉じる":"タグをもっと見る（+"+(all.length-9)+"）"}</button>` : "");
    document.querySelectorAll("[data-tag]").forEach(b=>b.onclick=()=>{tag=b.dataset.tag;shown=PAGE;render();});
    const mt=el("#moreTags"); if(mt) mt.onclick=()=>{showAllTags=!showAllTags;render();};
  } else if(view==="news"){
    const _ax=el("#axpills"); if(_ax){_ax.innerHTML=""; _ax.style.display="none";}
    el("#tagpills").innerHTML = likeBar() + nopeBar();
    const lb2=el("#fLiked"); if(lb2) lb2.onclick=()=>{onlyLiked=!onlyLiked;shown=PAGE;render();};
    el("#filterpills").innerHTML=""; el("#authorpills").innerHTML="";
  } else { const _ax=el("#axpills"); if(_ax){_ax.innerHTML=""; _ax.style.display="none";}
    el("#tagpills").innerHTML=""; el("#filterpills").innerHTML=""; }

  if(view==="feed"){
    const _ax=el("#axpills"); if(_ax){_ax.innerHTML=""; _ax.style.display="none";}
    const nNew=DATA.feed.filter(f=>daysAgo(f.date)<=2).length;
    const nChap=DATA.feed.filter(f=>(f.chapters||[]).length).length;
    el("#tagpills").innerHTML = likeBar() + nopeBar() +
      (view==="feed" ? `<button class="pill ${onlyNew?"on":""}" id="fNew">🆕 直近2日<b>${nNew}</b></button>` : "")+
      (view==="feed" ? `<button class="pill ${onlyChap?"on":""}" id="fChap">📑 目次あり<b>${nChap}</b></button>` : "");
    if(el("#fNew")) el("#fNew").onclick=()=>{onlyNew=!onlyNew;shown=PAGE;render();};
    if(el("#fChap")) el("#fChap").onclick=()=>{onlyChap=!onlyChap;shown=PAGE;render();};
    const names=["すべて"].concat([...new Set(DATA.feed.map(f=>f.author))]);
    el("#authorpills").innerHTML=names.map(a=>{
      const n=a==="すべて"?DATA.feed.length:DATA.feed.filter(x=>x.author===a).length;
      const mark=a!=="すべて"&&(DATA.feed.find(x=>x.author===a)||{}).pick==="オーナー指定"?"★":"";
      const fresh=a==="すべて"?DATA.feed.filter(x=>daysAgo(x.date)<=2).length
                              :DATA.feed.filter(x=>x.author===a&&daysAgo(x.date)<=2).length;
      return `<button class="pill ${a===author?"on":""}" data-au="${a}">${mark}${a}<b>${fresh?"🆕"+fresh+" / ":""}${n}</b></button>`;
    }).join("");
    document.querySelectorAll("[data-au]").forEach(b=>b.onclick=()=>{author=b.dataset.au;shown=PAGE;render();});
  } else el("#authorpills").innerHTML="";
}

function tipCard(t){
  const st=(t.steps||[]);
  const steps = st.length<=5
    ? st.map(s=>`<li>${esc(s)}</li>`).join("")
    : st.slice(0,4).map(s=>`<li>${esc(s)}</li>`).join("")
      + `</ol><details class="chap"><summary>残り${st.length-4}手順を見る</summary><ol class="steps" start="5">`
      + st.slice(4).map(s=>`<li>${esc(s)}</li>`).join("") + `</ol></details><ol class="steps" style="display:none">`;
  const prompt=t.prompt?`<div class="promptbox"><button class="copy">コピー</button>${esc(t.prompt)}</div>`:"";
  const src = (t.source && t.source.url)
    ? `<a class="src" href="${esc(t.source.url)}" target="_blank" rel="noopener">出典 ↗</a>`
    : (t.source ? `<span class="src" style="color:var(--muted);font-weight:600" title="${esc(t.source.title||"")}">出典: 配布教材</span>`
                : `<span class="src unverified">出典なし</span>`);
  return `<article class="card">
    <div class="badges"><span class="ai ${aiClass(t.ai)}">${esc(t.ai)}</span>
      <span class="lv">${esc(t.level||"")}</span>
      <span class="org ${esc(t.origin||"Claude")}">${t.origin==="Claude"?"Claude独自":esc(t.origin||"Claude")}</span>
      <button class="fav ${favs().includes(t.id)?"on":""}" data-fav="${esc(t.id)}"
        data-info='${esc(JSON.stringify({kind:"tip",title:t.title,ai:t.ai,tags:t.tags||[],level:t.level,use:t.use,origin:t.origin,axes:t.axes||{}}))}'
        >${favs().includes(t.id)?"👍 いいね済":"👍 いいね"}</button
      ><button class="nope ${nopes().includes(t.id)?"on":""}" data-nope="${esc(t.id)}"
        title="これは自分には合わない、と伝えます"
        data-ninfo='${esc(JSON.stringify({kind:"tip",title:t.title,ai:t.ai,level:t.level,use:t.use,axes:t.axes||{}}))}'
        >${nopes().includes(t.id)?"👎 違う済":"👎"}</button></div>
    <h3>${esc(t.title)}</h3>
    <p class="sum">${esc(t.summary)}</p>
    ${t.why?`<p class="why">${esc(t.why)}</p>`:""}
    ${steps?`<ol class="steps">${steps}</ol>`:""}
    ${prompt}
    <div class="foot">${(t.tags||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join("")}${src}</div>
  </article>`;
}

function daysAgo(d){
  if(!d) return 999;
  const p=String(d).split("-");
  if(p.length<3) return 999;
  const t=new Date();
  const today=Date.UTC(t.getFullYear(), t.getMonth(), t.getDate());
  const x=Date.UTC(+p[0], +p[1]-1, +p[2]);
  const n=Math.round((today-x)/86400000);
  return n<0 ? 0 : n;   // 時差で未来日付になった分は「今日」扱い
}

let filterOpen=false;
function activeFilters(){
  const a=[];
  if(onlyLiked) a.push("👍いいね");
  if(view==="tips"){
    if(ai!=="すべて") a.push(ai);
    if(useFor!=="すべて") a.push(useFor);
    AXIS.forEach(([k])=>{ if(ax[k]!=="すべて") a.push(ax[k]); });
    if(level!=="すべて") a.push(level);
    if(onlyPrompt) a.push("コピーできる");
    if(tag!=="すべて") a.push(tag);
  }
  if(view==="feed"){
    if(ai!=="すべて") a.push(ai);
    if(author!=="すべて") a.push(author);
    if(onlyNew) a.push("直近2日");
    if(onlyChap) a.push("目次あり");
  }
  if(view==="news" && ai!=="すべて") a.push(ai);
  return a;
}
function renderFilterHead(n){
  const act=activeFilters();
  el("#filterhead").innerHTML = `<div class="fhead">
    <button class="fbtn ${act.length?"act":""}" id="fToggle">⚙ 絞り込み${act.length?"（"+act.length+"）":""} ${filterOpen?"▲":"▼"}</button>
    ${act.length?`<span class="fsum2">${act.map(esc).join(" / ")}</span><button class="fbtn" id="fReset">✕ 解除</button>`:""}
    <span class="fsum2" style="margin-left:auto">${n}件</span></div>`;
  el("#filterwrap").classList.toggle("open", filterOpen);
  el("#fToggle").onclick=()=>{filterOpen=!filterOpen;render();};
  const fr=el("#fReset");
  if(fr) fr.onclick=()=>{ ai="すべて"; tag="すべて"; author="すべて"; level="すべて";
    useFor="すべて"; onlyPrompt=false; onlyNew=false; onlyChap=false; onlyLiked=false;
    axReset(); shown=PAGE; render(); };
}
function render(){
  let list=items().filter(match);
  renderFilterHead(list.length);
  if(view==="tips"){
    if(sortBy==="新着順") list=[...list].reverse();
    else list=[...list].sort((a,b)=>(a.ai+a.level).localeCompare(b.ai+b.level));
  }
  pills();
  if(view==="cast"){
    el("#filterhead").innerHTML=""; el("#filterwrap").classList.remove("open");
    el("#aipills").innerHTML=""; el("#tagpills").innerHTML=""; el("#authorpills").innerHTML="";
    el("#hint").textContent="上の🔊がずんだもん＆四国めたんの音声です。下は同じ内容の台本なので、読み物としてどうぞ。";
    el("#body").innerHTML=castView();
    const edrow=el("#edrow");
    if(edrow){ edrow.querySelectorAll(".edpill").forEach(b=>{ b.onclick=()=>{
      castEd=b.dataset.ed;
      try{ localStorage.setItem(ED_KEY,castEd); }catch(e){}
      render();
    };}); }
    document.querySelectorAll(".line").forEach(p=>p.onclick=()=>{
      document.querySelectorAll(".line").forEach(x=>x.classList.remove("now"));
      p.classList.add("now");
    });
    return;
  }
  if(view==="home"){
    el("#filterhead").innerHTML=""; el("#filterwrap").classList.remove("open");
    el("#aipills").innerHTML=""; el("#tagpills").innerHTML=""; el("#authorpills").innerHTML="";
    el("#hint").textContent="毎朝ここだけ見れば足ります。★はあなたが指定した発信者です。";
    el("#body").innerHTML=homeView();
    document.querySelectorAll(".copy").forEach(b=>b.onclick=()=>{
      const txt=b.parentElement.textContent.replace(/^コピー/,"");
      navigator.clipboard.writeText(txt).then(()=>{b.textContent="コピーしました";b.classList.add("done");
        setTimeout(()=>{b.textContent="コピー";b.classList.remove("done")},1400);});
    });
    const lb=el("#fLiked"); if(lb) lb.onclick=()=>{onlyLiked=!onlyLiked;shown=PAGE;render();};
  document.querySelectorAll("[data-fav]").forEach(b=>b.onclick=(e)=>{
      e.preventDefault(); e.stopPropagation();
      let info={}; try{ info=JSON.parse(b.dataset.info||"{}"); }catch(_){}
      toggleFav(b.dataset.fav, info);
    });
  document.querySelectorAll("[data-nope]").forEach(b=>b.onclick=(e)=>{
      e.preventDefault(); e.stopPropagation();
      let info={}; try{ info=JSON.parse(b.dataset.ninfo||"{}"); }catch(_){}
      toggleNope(b.dataset.nope, info);
    });
    document.querySelectorAll("[data-goto]").forEach(a=>a.onclick=(e)=>{
      e.preventDefault();
      const v=a.dataset.goto;
      document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.dataset.view===v));
      view=v; ai="すべて"; tag="すべて"; author="すべて"; render();
      window.scrollTo(0,0);
    });
    return;
  }
  const hints={tips:"プロンプトはそのままコピーできます。黒い X バッジ＝Xで話題の投稿、オレンジ＝Claude独自の知見です。",
    feed:"★はあなたが指定した発信者。「この回の内容」を開くと、動画のどこで何を話しているかが分かります。",
    news:"自動収集（1日1回）。見出しと出典だけの速報です。"};
  el("#hint").textContent = hints[view];
  const page=list.slice(0,shown);
  const moreBtn = list.length>shown
    ? `<button class="more" id="more">もっと見る（残り ${list.length-shown} 件）</button>` : "";
  el("#body").innerHTML = list.length===0 ? `<p class="empty">該当なし</p>`
    : (view==="tips" ? `<div class="grid">${page.map(tipCard).join("")}</div>${moreBtn}`
       : view==="feed" ? `<div>${page.map(feedCard).join("")}</div>${moreBtn}`
                     : `<div>${page.map(newsRow).join("")}</div>${moreBtn}`);
  const mb=el("#more"); if(mb) mb.onclick=()=>{ shown+=PAGE; render(); };
  document.querySelectorAll(".copy").forEach(b=>b.onclick=()=>{
    const txt=b.parentElement.textContent.replace(/^コピー/,"");
    navigator.clipboard.writeText(txt).then(()=>{b.textContent="コピーしました";b.classList.add("done");
      setTimeout(()=>{b.textContent="コピー";b.classList.remove("done")},1400);});
  });
    const lb=el("#fLiked"); if(lb) lb.onclick=()=>{onlyLiked=!onlyLiked;shown=PAGE;render();};
  document.querySelectorAll("[data-fav]").forEach(b=>b.onclick=(e)=>{
      e.preventDefault(); e.stopPropagation();
      let info={}; try{ info=JSON.parse(b.dataset.info||"{}"); }catch(_){}
      toggleFav(b.dataset.fav, info);
    });
  document.querySelectorAll("[data-nope]").forEach(b=>b.onclick=(e)=>{
      e.preventDefault(); e.stopPropagation();
      let info={}; try{ info=JSON.parse(b.dataset.ninfo||"{}"); }catch(_){}
      toggleNope(b.dataset.nope, info);
    });
}
window.addEventListener("scroll",()=>{
  el("#totop").classList.toggle("show", window.scrollY>600);
});
el("#totop").onclick=()=>window.scrollTo({top:0,behavior:"smooth"});
document.addEventListener("keydown",(e)=>{
  if(e.key==="/" && document.activeElement!==el("#q")){ e.preventDefault(); el("#q").focus(); }
  if(e.key==="Escape"){ el("#q").value=""; q=""; shown=PAGE; render(); el("#q").blur(); }
});
mergeSaved();
render();
if(mergedCount>0){
  const b=document.createElement("div");
  b.id="syncnote";
  b.textContent="👍 他の端末で押した "+mergedCount+" 件を取り込みました";
  document.body.appendChild(b);
  setTimeout(()=>{ b.style.opacity="0"; setTimeout(()=>b.remove(), 600); }, 5000);
}
</script>
</body>
