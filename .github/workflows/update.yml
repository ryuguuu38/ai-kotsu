name: AIコツ図鑑を毎日更新

on:
  schedule:
    # 毎日 22:00 UTC = 日本時間の朝7:00
    - cron: "0 22 * * *"
  workflow_dispatch:
  # 手元から送った（Push）とき：音声は作り直さず、サイトの公開だけする（下の deploy-only）
  push:
    branches: [main]

permissions:
  contents: write
  pages: write      # サイトを公開するため
  id-token: write   # 公開を頼んだのがこの処理だと証明するため

jobs:
  update:
    # 毎朝の自動実行と、手動の実行のときだけ（Pushのときは動かない）
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    # 公開が2つ同時に走らないように順番待ちにする
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 1) 情報を集めて、台本とサイトを作る
      - name: 情報を集めてサイトを作り直す
        run: python update_all.py

      # 1.5) 音声をまとめる道具を用意（入っていない場合に備えて）
      - name: ffmpegを用意
        run: |
          if ! command -v ffmpeg > /dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1

      # 2) VOICEVOXのエンジンを起動（Macに入っているものと同じ 0.25.2）
      - name: 音声エンジンを起動
        run: |
          docker run -d --name voicevox -p 50021:50021 \
            voicevox/voicevox_engine:cpu-amd64-0.25.2
          echo "起動を待ちます..."
          for i in $(seq 1 60); do
            if curl -s -m 2 http://127.0.0.1:50021/version > /dev/null; then
              echo "エンジン準備OK（$((i*5))秒）"; exit 0
            fi
            sleep 5
          done
          echo "エンジンが応答しませんでした"; exit 1

      # 3) 台本を音声にする（全部入り＋テーマ別）
      - name: 今日の10分を音声にする
        timeout-minutes: 90
        env:
          VOICE_OUT: ./today.mp3
        run: python make_voice.py all claude gemini chatgpt news

      # 3.5) いつの台本で音声を作ったかを記録する（サイトでズレを検知するため）
      - name: 音声の作成日を記録
        run: date -u +%Y-%m-%d\ %H:%M > data/voice_built.txt

      # 3.6) 音声の日付を反映するため、サイトだけ組み立て直す
      #      （これを飛ばすと「音声が古い」の注意書きが毎日出てしまう）
      - name: サイトに音声の日付を反映する
        run: python build.py

      # 4) 音声を配布用の置き場にも上げる（予備。Pushのときの公開はここから音声を取る）
      - name: 音声を配布する
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view audio > /dev/null 2>&1 || \
            gh release create audio --title "今日の10分（音声）" --notes "毎朝自動で作られる音声です。VOICEVOX:ずんだもん / 四国めたん"
          ls -la ./today*.mp3
          gh release upload audio ./today*.mp3 --clobber

      # 5) 集めた結果を保存する（音声は履歴に入れず、公開用のフォルダへ移す）
      - name: 結果を保存する
        run: |
          mkdir -p _site/audio
          mv ./today*.mp3 _site/audio/
          git config user.name "ai-kotsu-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "自動更新 $(date -u +%Y-%m-%d)"
          git push

      # 6) サイトと音声をひとまとめにして公開する
      #    音声をサイトと同じ場所に置くと「音声」として正しく渡され、iPhoneでも鳴る
      #    （配布置き場の音声は「ただのファイル」として渡されるため、iPhoneのSafariでは鳴らなかった）
      - name: 公開する中身をそろえる
        run: |
          git ls-files -z | grep -zv '^\.github/' | xargs -0 cp --parents -t _site/
          ls -la _site _site/audio

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: サイトを公開する
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-only:
    # 手元から送った（Push）ときだけ。音声は作り直さず、配布置き場の今日の音声を使って公開する
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 今日の音声を配布置き場から取ってくる
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/audio
          gh release download audio --repo "${{ github.repository }}" --pattern "today*.mp3" --dir _site/audio
          ls -la _site/audio

      - name: 公開する中身をそろえる
        run: |
          git ls-files -z | grep -zv '^\.github/' | xargs -0 cp --parents -t _site/
          ls -la _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: サイトを公開する
        id: deployment
        uses: actions/deploy-pages@v5
